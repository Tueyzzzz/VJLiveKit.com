<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Latest Follower Overlay</title>
<link rel="icon" href="favicon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@500;700&display=swap');
  html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Mali','Itim',sans-serif; }
  #card { position:fixed; top:20px; left:20px; display:flex; align-items:center; gap:14px; padding:12px 22px 12px 12px;
    background:rgba(255,250,252,.95); border:3px solid #fff; border-radius:999px; box-shadow:0 10px 26px rgba(150,120,180,.3); }
  .ava { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; color:#fff; font-family:'Itim',sans-serif; font-size:24px;
    background:#8fe3cf; background-size:cover; background-position:center; flex:none; }
  .lbl { font-size:14px; color:#ab96b5; }
  .nm { font-family:'Itim',sans-serif; font-size:24px; color:#5f4a66; max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cnt { font-size:13px; color:#5fc9b0; }
  #card.pop { animation:pop .6s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { 0%{transform:scale(.8);} 60%{transform:scale(1.06);} 100%{transform:none;} }
</style>
</head>
<body>
  <div id="card">
    <div class="ava" id="ava">➕</div>
    <div>
      <div class="lbl" id="lbl">ผู้ติดตามล่าสุด</div>
      <div class="nm" id="nm">รอผู้ติดตามคนแรก…</div>
      <div class="cnt" id="cnt"></div>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script>
  (function(){
    // ?label=ข้อความหัวการ์ด  ?showCount=1 แสดงจำนวนผู้ติดตามใหม่ในไลฟ์นี้
    const $=(id)=>document.getElementById(id);
    const cols=['#ff93c0','#b9a6f2','#8fe3cf','#ffcf5c','#ff6aa8','#9d86e8']; const colOf=(nm)=>cols[(nm||'?').charCodeAt(0)%cols.length];
    const showCount=Overlay.param('showCount','1')!=='0';
    $('lbl').textContent=Overlay.param('label','ผู้ติดตามล่าสุด');
    function setCount(n){ $('cnt').textContent=showCount&&n?`+${Overlay.fmt(n)} คนในไลฟ์นี้`:''; }
    function follow(user){
      const nm=user?(user.nickname||user.uniqueId):'ผู้ชม';
      const ava=$('ava');
      if(user&&user.avatar&&/^https:\/\//.test(user.avatar)){ ava.style.backgroundImage=`url("${user.avatar.replace(/"/g,'')}")`; ava.textContent=''; }
      else { ava.style.backgroundImage=''; ava.style.background=colOf(nm); ava.textContent=(nm||'?')[0]; }
      $('nm').textContent=nm;
      const card=$('card'); card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
    }
    Overlay.on('event',(e)=>{ if(e.type==='follow') follow(e.user); });
    Overlay.on('stats',(s)=>setCount(s.followCount));
    Overlay.on('state',(s)=>setCount(s.stats&&s.stats.followCount));
    if(!Overlay.connected){ const names=['mimi','บิ๊ก','lisa','ต้นน้ำ','somchai']; let n=0;
      setInterval(()=>{ n++; follow({nickname:names[Math.floor(Math.random()*names.length)]}); setCount(n); }, 3000); }
  })();
  </script>
</body>
</html>
