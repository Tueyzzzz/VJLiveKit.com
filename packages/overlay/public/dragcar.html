<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gift Car Overlay</title>
  <link rel="icon" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Kanit',sans-serif;color:#fff}
    #fx{position:fixed;inset:0}
    #alert{position:fixed;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;
      background:rgba(20,10,30,.55);backdrop-filter:blur(4px);opacity:0;transform:translate(-50%,10px);transition:opacity .35s,transform .35s;white-space:nowrap;pointer-events:none;
      text-shadow:0 2px 4px rgba(0,0,0,.65)}
    #alert.show{opacity:1;transform:translate(-50%,0)}
    #alert img.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#b9a6f2}
    #alert img.gift{width:36px;height:36px;object-fit:contain}
    #alert .nm{font-weight:600;font-size:18px} #alert .sub{font-size:15px;opacity:.9}
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="alert"><img class="ava" alt="" /><div><div class="nm"></div><div class="sub"></div></div><img class="gift" alt="" /></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script src="js/collect-store.js"></script>
  <script src="js/juice.js"></script>
  <script>
  /*
   * รถลากของขวัญ (แบบรถงานแต่งลากกระป๋อง) — ของขวัญจริงผูกเชือกท้ายรถ ลากไปกับพื้น กระเด้งตามถนน กางเป็นพัด
   *   car=van                    แบบรถ (ภาพ 3D มุมหลัง)
   *   hue=0 sat=1 bright=1       เปลี่ยนสีรถ
   *   scale=1 giftScale=1 x=0 y=0 alert=1 minCoins=0 max=140 reset=1
   */
  (function () {
    const P = (k, d) => Overlay.param(k, d);
    const num = (k, d) => { const v = parseFloat(P(k, d)); return Number.isFinite(v) ? v : d; };
    const SCALE = num('scale', 1), GIFT_SCALE = num('giftScale', 1), OX = num('x', 0), OY = num('y', 0);
    const SHOW_ALERT = P('alert', '1') !== '0', MIN_COINS = num('minCoins', 0);
    const MAX = Math.round(Math.max(30, Math.min(400, num('max', 140) / (GIFT_SCALE * GIFT_SCALE))));

    // รถ (ภาพมุมหลัง) — พิกัดหน่วยออกแบบ: 0,0 = กลางล่างของรถ · hook = ตะขอกลางกันชนท้าย
    const CARS = {
      pickup2: { src: 'themes/car-pickup2.webp', x: -209.4, y: -360, w: 418.9, h: 360, hook: { x: -0.4, y: -42.5 } },
      camper: { src: 'themes/car-camper.webp', x: -214.8, y: -360, w: 429.5, h: 360, hook: { x: -0.2, y: -47.0 } },
      sports: { src: 'themes/car-sports.webp', x: -333.4, y: -360, w: 666.8, h: 360, hook: { x: -0.2, y: -38.9 } },
      offroad: { src: 'themes/car-offroad.webp', x: -242.6, y: -360, w: 485.2, h: 360, hook: { x: -0.4, y: -60.1 } },
      jdm: { src: 'themes/car-jdm.webp', x: -261.2, y: -360, w: 522.5, h: 360, hook: { x: -0.4, y: -54.7 } },
      bike: { src: 'themes/car-bike.webp', x: -145.2, y: -360, w: 290.5, h: 360, hook: { x: -0.2, y: -113.1 }, open: true, balAt: 0.2, balMax: 12, balTight: true },
      tourbus: { src: 'themes/car-tourbus.webp', x: -163.5, y: -360, w: 327.0, h: 360, hook: { x: -0.3, y: -74.6 }, music: true },
      limo: { src: 'themes/car-limo.webp', x: -285.3, y: -360, w: 570.6, h: 360, hook: { x: -0.4, y: -58.5 }, music: true },
      vintage: { src: 'themes/car-vintage.webp', x: -290.5, y: -360, w: 580.9, h: 360, hook: { x: -0.2, y: -89.1 }, open: true, music: true },
      van: { src: 'themes/car-heart.webp', x: -209.3, y: -360, w: 418, h: 360, hook: { x: -2, y: -54 } },
      beetle: { src: 'themes/car-beetle.webp', x: -207.1, y: -360.0, w: 414.2, h: 360.0, hook: { x: -0.7, y: -59.1 } },
      minivan: { src: 'themes/car-minivan.webp', x: -191.1, y: -360.0, w: 382.2, h: 360.0, hook: { x: -0.7, y: -48.1 } },
      convertible: { src: 'themes/car-convertible.webp', x: -216.5, y: -360.0, w: 433.0, h: 360.0, hook: { x: -0.6, y: -39.3 }, open: true },
      pickup: { src: 'themes/car-pickup.webp', x: -209.4, y: -360.0, w: 418.9, h: 360.0, hook: { x: 0.0, y: -49.6 } },
    };
    const CAR = CARS[P('car', 'van')] || CARS.van;
    // ลูกโป่ง: ของขวัญทุก ๆ BAL_EVERY ชิ้น ไปผูกเป็นลูกโป่งลอยเหนือหลังคา (รถเปิดประทุน = ผูกที่เบาะหลัง) · ?balloons=0 ปิด
    const BAL_ON = P('balloons', '1') !== '0', BAL_EVERY = 2, BAL_MAX = 45;
    const BAL_COLORS = ['#ffb5d4', '#c9b8ff', '#a8e6cf', '#ffd3a5', '#a9d8ff', '#fff1a8', '#ff9ec4'];
    const carImg = Juice.skin(CAR.src, num('hue', 0), num('sat', 1), num('bright', 1));
    const CAR_Y = -250;
    if (CAR.music) setInterval(() => { if (!document.hidden && fx.notes) fx.notes((Math.random() - .5) * CAR.w * 0.5, CAR_Y + CAR.y + 30, 1); }, 1700); // รถยกขึ้นจากขอบล่าง → ของขวัญลากอยู่ด้านหน้า (ใกล้กล้อง) เชือกยาวแบบรถงานแต่ง
    const ROPE = Math.max(40, num('rope', 90)); // ระยะเว้นจากท้ายรถถึงแถวแรก (ยิ่งมาก เชือกยิ่งยาว)

    const canvas = document.getElementById('fx'), ctx = canvas.getContext('2d');
    const DPR = Math.min(2, devicePixelRatio || 1);
    let W = 0, H = 0;
    const S = () => SCALE * Math.min(1.6, Math.max(0.5, H / 720));
    const origin = () => ({ x: W / 2 + OX, y: H - 20 * SCALE + OY });
    function resize() { W = innerWidth; H = innerHeight; canvas.width = W * DPR; canvas.height = H * DPR; canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; layoutUi(); }

    // ---- ตำแหน่งที่ของขวัญถูกลาก: พัดหลายแถวจากตะขอ (แถวไกล = ใกล้รถ, แถวใกล้กล้อง = ล่างจอ ตัวใหญ่ขึ้น) ----
    const hook = () => ({ x: CAR.hook.x, y: CAR_Y + CAR.hook.y });
    const slots = [];
    // แถวบนพื้นจากท้ายรถลงมาหาขอบล่าง แต่ละแถวกางออกด้านข้างกว้างขึ้นเรื่อย ๆ (จำนวนรอบจำกัด → จบแน่นอน)
    for (let j = 0; j < 12; j++) {
      const y = CAR_Y + ROPE + j * 22; if (y > -10) break;
      for (let m = 0; m < 34; m++) for (const sgn of m ? [-1, 1] : [1]) {
        const x = sgn * (m * 32 + (j % 2 ? 16 : 0));
        slots.push({ x, y, k: j, ph: (x * 0.13 + y * 0.07 + 6.28) % 6.28 });
      }
    }
    // ช่องที่ใกล้ท้ายรถก่อน (กองจากตรงกลางออกไป)
    slots.sort((p, q) => Math.hypot(p.x * 0.6, p.y - CAR_Y) - Math.hypot(q.x * 0.6, q.y - CAR_Y));

    // ---- ของขวัญ ----
    const gifts = [], fx = new Juice.Particles(), punch = new Juice.Spring(260, 11);
    const imgCache = {};
    function giftImg(url) { if (!url || !/^https:\/\//.test(url)) return null; let im = imgCache[url]; if (!im) { im = new Image(); im.src = url; imgCache[url] = im; } return im; }
    const EMOJI = { Rose: '🌹', 'Finger Heart': '🫰', Perfume: '🧴', Galaxy: '🌌', Lion: '🦁', Universe: '🪐', Heart: '❤️', TikTok: '🎵' };
    const sizeFor = Juice.sizeFor || (() => 1);
    let addCount = 0;
    function nextBalIdx() { const used = new Set(gifts.filter((b) => b.balloon && !b.dying).map((b) => b.bi)); for (let i = 0; ; i++) if (!used.has(i)) return i; }
    // จุดผูกลูกโป่ง: กลางหลังคา / เบาะหลังของรถเปิดประทุน
    // จุดผูก = ขอบหลังคาจริงของรูปรถ (วัดจากภาพ: พิกเซลทึบแรกตรงกลางจากด้านบน) · รถเปิดประทุน = เบาะหลัง
    let roofF = 0.12;
    (function () {
      const im = new Image(); im.onload = () => {
        try {
          const c = document.createElement('canvas'); c.width = 100; c.height = 100; const x = c.getContext('2d'); x.drawImage(im, 0, 0, 100, 100);
          const d = x.getImageData(46, 0, 8, 100).data;
          for (let y = 0; y < 100; y++) { let n = 0; for (let k = 0; k < 8; k++) if (d[(y * 8 + k) * 4 + 3] > 120) n++; if (n >= 4) { roofF = y / 100; break; } }
        } catch (e) { /* ignore */ }
      }; im.src = CAR.src;
    })();
    const balAnchor = () => ({ x: 0, y: CAR_Y + CAR.y + CAR.h * (CAR.balAt != null ? CAR.balAt : CAR.open ? 0.42 : roofF + 0.09) });
    function balloonPos(b, t) {
      const a = balAnchor(), i = b.bi, ring = Math.floor(Math.sqrt(i)), k = i - ring * ring, n = 2 * ring + 1;
      const ang = -Math.PI / 2 + (n > 1 ? (k / (n - 1) - 0.5) : 0) * (CAR.balTight ? 0.9 : Math.min(2.2, 0.7 + ring * 0.35));
      const len = CAR.balTight ? 95 + ring * 18 + (i % 2) * 10 : 85 + ring * 24 + (i % 3) * 8;
      const gust = Math.sin(t * 0.45) * 0.35 + Math.sin(t * 0.83 + 1.3) * 0.2; // ลมพัดเป็นระลอก (ทุกลูกไปทางเดียวกัน)
      const sw = gust * 0.16 + Math.sin(t * 1.1 + i * 1.7) * 0.07;
      // จอเตี้ย: บีบกลุ่มลูกโป่งให้อยู่ในจอ (ไม่ล้นขอบบน)
      const room = origin().y / S() + a.y - 50, fit = Math.min(1, room / 230);
      // ที่เหนือรถน้อย → กางกลุ่มลูกโป่งออกด้านข้างแทน (ไม่ทับกันเป็นก้อน)
      return { x: a.x + Math.cos(ang + sw) * len * (0.95 + (1 - fit) * 1.1), y: a.y + Math.min(-50 - (i % 3) * 30 * Math.max(0.5, fit * 2), Math.sin(ang + sw) * len * fit) + Math.sin(t * 2 + i) * 4, ax: a.x, ay: a.y };
    }
    function freeSlot() {
      const used = new Set(gifts.filter((g) => !g.dying && !g.balloon).map((g) => g.slot));
      for (let i = 0; i < slots.length && i < MAX + 20; i++) if (!used.has(i)) return i;
      return -1;
    }
    function addGift(g, born) {
      let slot = freeSlot();
      const alive = gifts.filter((b) => !b.dying);
      if (alive.length >= MAX || slot < 0) { const old = (window.VJLCollect && VJLCollect.victims) ? VJLCollect.victims(gifts.map((x) => ({ ...x, d: x.g.d, ref: x })), 1).map((x) => x.ref)[0] : alive[0]; if (old) { old.dying = true; slot = old.slot; } }
      if (slot < 0) slot = 0;
      const r = Math.min(78, 18 * GIFT_SCALE * sizeFor(g.d, 4.2)); // ของแพงใหญ่ชัด ๆ (Lion/Universe ≈ 4 เท่า)
      const nBal = gifts.filter((b) => b.balloon && !b.dying).length;
      const balloon = BAL_ON && (g.d || 0) < 100 && nBal < (CAR.balMax || BAL_MAX) && /* ของแพงอยู่บนพื้น เด่นกว่า */ (++addCount % BAL_EVERY === 0);
      gifts.push({ g, img: giftImg(g.u), slot, r, born, life: 1, sx: (Math.random() - .5) * 160, sy: CAR_Y - 420 - Math.random() * 120, balloon, bi: balloon ? nextBalIdx() : -1 });
      if (born > 0) punch.kick(g.d >= 1000 ? -6 : -2.5);
    }

    // ---- จำไว้ (รีโหลด/deploy ใหม่ไม่หาย) ----
    const KEY = 'vjl-vehicle:' + (P('t', '') || P('username', 'demo')).slice(-24);
    let saveT = null;
    const saveNow = () => { try { localStorage.setItem(KEY, JSON.stringify({ g: gifts.filter((b) => !b.dying).map((b) => b.g) })); } catch { /* storage ปิด */ } };
    const save = () => { clearTimeout(saveT); saveT = setTimeout(saveNow, 500); };
    addEventListener('pagehide', () => { clearTimeout(saveT); saveNow(); });
    try {
      if (P('reset', '0') === '1') localStorage.removeItem(KEY);
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      let list = s ? (s.g || []) : [];
      // กองกลาง (ใช้ร่วมทุกแบบ) มาก่อน — เปลี่ยนแบบแล้วของขวัญไม่หาย
      if (window.VJLCollect) { VJLCollect.seed(list); if (VJLCollect.has()) list = VJLCollect.gifts(MAX).map((g) => ({ u: g.u, e: g.em || VJLCollect.emoji(g.name, '🎁'), d: g.d })); }
      list.slice(-MAX).forEach((g) => addGift(g, -1e6));
    } catch { /* ignore */ }

    // ---- วาด ----
    function drawGift(img, e, size) {
      const st = Juice.sticker ? Juice.sticker(img, size * S() * DPR) : null;
      if (st) { const s = size * Juice.STICKER_PAD; ctx.drawImage(st, -s / 2, -s / 2, s, s); }
      else if (img && img.complete && img.naturalWidth) ctx.drawImage(img, -size / 2, -size / 2, size, size);
      else { ctx.font = Math.round(size * .85) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e || '🎁', 0, 2); }
    }
    function giftPos(b, t, now) {
      const sl = slots[b.slot] || slots[0];
      const sp = 3.2 + (b.slot % 5) * 0.35, ph = sl.ph;
      const hop = Math.pow(Math.max(0, Math.sin(t * sp + ph)), 6) * (6 + sl.k * 1.2); // กระเด้งตามหลุมถนน
      let x = sl.x + Math.sin(t * 1.4 + ph) * 3, y = sl.y - hop;
      if (b.born > 0) { // ลอยเข้ามาผูก
        const k = Math.min(1, (now - b.born) / 700), e = Juice.easeOutBack ? Juice.easeOutBack(k) : k;
        x = b.sx + (x - b.sx) * e; y = b.sy + (y - b.sy) * Math.min(1, k * 1.1);
        if (k >= 1 && !b.landed) { b.landed = true; fx.dust(x, y + b.r * 0.6, 5); fx.sparkle(x, y, 5, b.g.d >= 1000 ? '#ffe08a' : '#fff6e8'); }
      }
      return { x, y, rot: Math.sin(t * 2.1 + ph) * 0.18 + hop * 0.01, depth: 0.88 + Math.max(0, (sl.y - CAR_Y)) / 600 };
    }
    function frame(now) {
      const t = now / 1000;
      punch.step(1 / 60); fx.step();
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H); ctx.imageSmoothingQuality = 'high';
      const o = origin(), s = S(); ctx.translate(o.x, o.y); ctx.scale(s, s);
      // รถสั่นเหมือนกำลังวิ่ง
      const bob = Math.sin(t * 9) * 1.2 + Math.max(0, Math.sin(t * 2.3)) ** 12 * 4, sq = 1 + Math.max(-0.08, Math.min(0.08, punch.x * 0.012));
      const h = hook(), hy = h.y - bob;
      // ของแพงวาดทีหลัง = อยู่บนสุดของกอง ไม่โดนของถูกบัง (แพงพอกันค่อยเรียงไกล → ใกล้)
      const tier = (d) => (d >= 1000 ? 3 : d >= 100 ? 2 : d >= 20 ? 1 : 0);
      const list = gifts.filter((b) => !b.balloon).map((b) => ({ b, p: giftPos(b, t, now) })).sort((a, c) => tier(a.b.g.d) - tier(c.b.g.d) || a.p.y - c.p.y);
      // เงารถ
      ctx.beginPath(); ctx.ellipse(0, CAR_Y - 4, CAR.w * 0.42, 14, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(60,40,90,.28)'; ctx.fill();
      // รถ
      ctx.save(); ctx.translate(0, CAR_Y - bob); ctx.scale(2 - sq, sq);
      if (carImg.ready()) ctx.drawImage(carImg.source, CAR.x, CAR.y, CAR.w, CAR.h);
      ctx.restore();
      // เชือก (วาดก่อนของขวัญ ทับกันชนเล็กน้อย)
      ctx.lineCap = 'round';
      for (const { b, p } of list) {
        if (b.born > 0 && !b.landed) continue;
        const tx = p.x, ty = p.y - b.r * 0.55 * p.depth, mx = (h.x + tx) / 2, my = Math.max(hy, ty) + 14 + Math.abs(tx - h.x) * 0.05; // เชือกหย่อนตามความยาว
        ctx.globalAlpha = b.life;
        ctx.beginPath(); ctx.moveTo(h.x, hy); ctx.quadraticCurveTo(mx, my, tx, ty);
        ctx.lineWidth = 2.6; ctx.strokeStyle = 'rgba(90,60,120,.35)'; ctx.stroke();
        ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // ลูกโป่งบนหลังคา: เชือก → ลูกโป่งสีพาสเทล มีของขวัญอยู่ตรงกลาง
      for (const b of gifts) {
        if (!b.balloon) continue;
        if (b.dying) b.life -= 0.03;
        const p = balloonPos(b, t), ay = p.ay - bob;
        // ลูกโป่งตามรถแบบหน่วง ๆ (รถเด้ง/ได้ของขวัญใหม่ → ลูกโป่งกระตุกตามช้า ๆ แล้วแกว่งกลับ)
        b.ly = (b.ly || 0) + ((-bob * 1.6 + punch.x * 3) - (b.ly || 0)) * (0.05 + (b.bi % 5) * 0.008);
        b.lx = (b.lx || 0) + ((punch.x * (b.bi % 2 ? 2 : -2)) - (b.lx || 0)) * 0.04;
        let x = p.x + b.lx, y = p.y + b.ly;
        if (b.born > 0) { const k = Math.min(1, (now - b.born) / 900), e = Juice.easeOutBack ? Juice.easeOutBack(k) : k; x = b.sx + (x - b.sx) * e; y = b.sy + (y - b.sy) * Math.min(1, k * 1.1); if (k >= 1 && !b.landed) { b.landed = true; fx.sparkle(x, y, 6, '#fff6e8'); } }
        const R = Math.max(22, Math.min(34, b.r * 1.2)), col = BAL_COLORS[b.bi % BAL_COLORS.length];
        ctx.save(); ctx.globalAlpha = Math.max(0, b.life);
        const ex = x, ey = y + R * 0.8, dx = ex - p.ax, dy = ey - ay, wind = Math.sin(t * 0.45) * 14 + Math.sin(t * 1.7 + b.bi) * 5 + b.lx * 0.8; // แกว่งเบา ๆ
        ctx.beginPath(); ctx.moveTo(p.ax, ay); // เชือกหย่อน ๆ เป็นรูปตัว S เอนตามลม
        ctx.bezierCurveTo(p.ax + dx * 0.15 - wind, ay + dy * 0.35 + 10, p.ax + dx * 0.75 + wind * 0.8, ay + dy * 0.7 + 6, ex, ey);
        ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
        // ของขวัญลอยเองเหมือนลูกโป่ง (ไม่มีลูกโป่งครอบ) ผูกเชือกที่ใต้ของขวัญ
        ctx.translate(x, y); ctx.rotate(Math.sin(t * 1.5 + b.bi) * .1); drawGift(b.img, b.g.e, R * 1.6); ctx.restore();
      }
      // ปมผูกบนหลังคา
      if (BAL_ON && gifts.some((b) => b.balloon)) { const a = balAnchor(); ctx.beginPath(); ctx.arc(a.x, a.y - bob, 4, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(120,90,160,.6)'; ctx.stroke(); }
      // ตะขอ
      ctx.beginPath(); ctx.arc(h.x, hy, 5, 0, Math.PI * 2); ctx.fillStyle = '#f4f0fb'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(120,90,160,.6)'; ctx.stroke();
      // ของขวัญ (ไกล → ใกล้)
      for (const { b, p } of list) {
        if (b.dying) b.life -= 0.03;
        const size = b.r * 2 * p.depth;
        if (b.g.d >= 20 && b.life > 0.5) Juice.aura(ctx, p.x, p.y, size * 0.5, b.g.d, t);
        ctx.save(); ctx.globalAlpha = Math.max(0, b.life);
        ctx.beginPath(); ctx.ellipse(p.x, p.y + size * 0.45, size * 0.38, size * 0.1, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(60,40,90,.22)'; ctx.fill(); // เงาบนพื้น
        ctx.translate(p.x, p.y); ctx.rotate(p.rot); drawGift(b.img, b.g.e, size); ctx.restore();
      }
      for (let i = gifts.length - 1; i >= 0; i--) if (gifts[i].life <= 0) gifts.splice(i, 1);
      fx.draw(ctx);
      requestAnimationFrame(frame);
    }

    // ---- แจ้งเตือนชื่อคนส่ง ----
    const $alert = document.getElementById('alert');
    function layoutUi() { const o = origin(), s = S(); $alert.style.left = o.x + 'px'; $alert.style.top = Math.max(4, o.y - 680 * s) + 'px'; }
    let alertT = null;
    function showAlert(e, count) {
      if (!SHOW_ALERT) return;
      const u = e.user || {};
      $alert.querySelector('.ava').src = u.avatar || ''; $alert.querySelector('.gift').src = e.giftImage || '';
      $alert.querySelector('.nm').textContent = u.nickname || u.uniqueId || '';
      $alert.querySelector('.sub').textContent = `ส่ง ${e.giftName || 'ของขวัญ'} ×${count}`;
      $alert.classList.add('show'); clearTimeout(alertT); alertT = setTimeout(() => $alert.classList.remove('show'), 3200);
    }

    function onGift(e) {
      const count = e.repeatCount || 1, unit = e.diamondCount || 0;
      if (unit < MIN_COINS) return;
      const g = { u: (e.giftImage || (window.VJLCollect ? VJLCollect.imgFor(e.giftName) : '')), e: EMOJI[e.giftName] || '🎁', d: unit };
      const n = unit >= 1000 ? 1 : Math.min(count, 150); // ส่ง 100 ดอก = ลาก 100 ชิ้น (เดิมตัดที่ 25)
      const k = e.__add != null ? Math.min(e.__add, n) : n; // คอมโบ: ผูกทันทีทีละชุดระหว่างกด
      for (let i = 0; i < k; i++) setTimeout(() => { addGift(g, e.__shot ? -1e6 : performance.now()); save(); }, i * (k > 25 ? 60 : 140));
      if (e.__partial) return; // ยังกดคอมโบอยู่ → แจ้งเตือน/บันทึก ทำตอนจบครั้งเดียว
      if (window.VJLCollect) VJLCollect.record(e, n);
      if (CAR.music && fx.notes) fx.notes(0, CAR_Y + CAR.y + 20, unit >= 100 ? 5 : 2);
      if (!e.__quiet) showAlert(e, count);
    }
    Overlay.on('state', (st) => { if (window.VJLCollect) VJLCollect.backfill(st, onGift); }); // เติมชิ้นที่พลาด (deploy/รีโหลดกลางไลฟ์)
    if (window.VJLCollect && VJLCollect.live) VJLCollect.live(onGift); else Overlay.on('event', (e) => { if (e.type === 'gift' && !e.streaking) onGift(e); });

    if (P('debug', '0') === '1') window.__car = { gifts, slots };
    addEventListener('resize', resize); resize(); requestAnimationFrame(frame);

    if (!Overlay.connected) {
      VJLCollect.demoBurst(onGift);
      const names = ['somchai', 'mimi', 'บิ๊ก', 'lisa', 'ต้นน้ำ'];
      const I = 'https://p16-webcast.tiktokcdn.com/img/', list = [['Rose', 1, I + 'maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.webp'], ['Rose', 1, I + 'maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.webp'], ['Finger Heart', 5, I + 'maliva/webcast-va/a4c4dc437fd3a6632aba149769491f49.png~tplv-obj.webp'], ['Perfume', 20, I + 'maliva/webcast-va/20b8f61246c7b6032777bb81bf4ee055~tplv-obj.webp'], ['Galaxy', 1000, I + 'alisg/webcast-sg/resource/79a02148079526539f7599150da9fd28.png~tplv-obj.webp'], ['Lion', 29999, I + 'maliva/webcast-va/4fb89af2082a290b37d704e20f4fe729~tplv-obj.webp']]; // ตัวอย่างใช้รูปของขวัญจริง
      setInterval(() => {
        const g = list[Math.floor(Math.random() * list.length)], nm = names[Math.floor(Math.random() * names.length)];
        onGift({ type: 'gift', user: { uniqueId: nm, nickname: nm }, giftName: g[0], giftImage: g[2], diamondCount: g[1], repeatCount: g[1] >= 1000 ? 1 : 1 + Math.floor(Math.random() * 3) });
      }, 1300);
    }
  })();
  </script>
