<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tug of War Overlay</title>
  <link rel="icon" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&family=Mali:wght@700&display=swap" rel="stylesheet" />
  <style>
    html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Kanit',sans-serif;color:#fff}
    #fx{position:fixed;inset:0;pointer-events:none;z-index:5}
    #game{position:fixed;left:50%;width:min(94vw,1100px);transform:translateX(-50%) scale(var(--k,1));transform-origin:50% 100%}
    #game.bottom{bottom:4vh} #game.top{top:4vh;transform-origin:50% 0} #game.center{top:50%;transform:translate(-50%,-50%) scale(var(--k,1));transform-origin:50% 50%}
    /* ภาพวาด GPT: tug/panel.webp (กรอบ) · rope.webp (เชือก+โบว์กลาง) · bunny.webp / bear.webp (ตัวดึง) */
    .ttlbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:-2%;position:relative;z-index:3}
    .ttl{font:700 26px/1 'Mali','Kanit',sans-serif;letter-spacing:.02em;color:#fff;padding:7px 18px;border-radius:999px;
      background:linear-gradient(90deg,var(--ca),color-mix(in srgb,var(--ca) 50%,var(--cb)),var(--cb));box-shadow:0 4px 0 rgba(0,0,0,.12),0 8px 18px rgba(80,40,120,.25);text-shadow:0 2px 0 rgba(0,0,0,.2);border:3px solid #fff}
    .clock{font-weight:700;font-size:20px;padding:5px 14px;border-radius:999px;background:#fff;color:#8a5bd6;min-width:64px;text-align:center;box-shadow:0 4px 12px rgba(80,40,120,.2)}
    .clock.hot{background:#ff4f6d;color:#fff;animation:hot 1s steps(2) infinite} @keyframes hot{50%{background:#ff8fa3}}
    .board{position:relative;width:100%;aspect-ratio:1164/500;background:url(tug/panel.webp) center/100% 100% no-repeat;filter:drop-shadow(0 10px 22px rgba(80,40,120,.28))}
    .inner{position:absolute;left:10.5%;right:10.5%;top:21%;bottom:21%;overflow:hidden;border-radius:9% / 22%}
    .goal{position:absolute;top:8%;bottom:8%;width:0;border-left:4px dashed rgba(255,255,255,.9);filter:drop-shadow(0 0 3px rgba(150,90,200,.6))}
    .goal.ga{left:20%} .goal.gb{left:80%}
    .goal::before{content:'🏁';position:absolute;top:-4px;left:-12px;font-size:20px}
    .mid{position:absolute;left:50%;top:10%;bottom:10%;border-left:2px dotted rgba(160,120,200,.5)}
    #rig{position:absolute;left:50%;top:0;width:160%;height:100%;transform:translateX(-50%);will-change:transform}
    #rig .rope{position:absolute;left:0;width:100%;top:56%;height:9%;transform:translateY(-50%);background:url(tug/rope-seg.webp) left center/auto 100% repeat-x;filter:drop-shadow(0 3px 2px rgba(120,70,40,.25))}
    #rig .bow{position:absolute;left:50%;top:56%;height:44%;transform:translate(-50%,-31%);filter:drop-shadow(0 4px 6px rgba(200,60,120,.3));z-index:2}
    #knot{position:absolute;left:50%;top:56%;width:8%;height:40%;transform:translate(-50%,-50%)}
    .chr{position:absolute;bottom:-2%;height:92%;pointer-events:none;transform-origin:50% 95%;transition:transform .25s}
    .chr.ca{left:18%} .chr.cb{right:18%}
    .chr.tug{animation:tug .45s cubic-bezier(.3,1.6,.5,1)}
    .chr.ca.tug{--lx:-6px;--rt:-10deg} .chr.cb.tug{--lx:6px;--rt:10deg}
    @keyframes tug{35%{transform:translateX(var(--lx)) rotate(var(--rt)) scale(1.05)}100%{transform:none}}
    .row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-top:-3%;position:relative;z-index:2;padding:0 4%}
    .team{position:relative;display:flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border-radius:999px;border:3px solid #fff;
      background:linear-gradient(180deg,color-mix(in srgb,var(--c) 80%,white),var(--c));box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,black),0 10px 20px rgba(0,0,0,.18)}
    .team.b{flex-direction:row-reverse;padding:6px 6px 6px 16px}
    .team .gi{width:58px;height:58px;flex:none;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
    .team .gi img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
    .team .gi img:not([src]),.team .gi img.bad{display:none} .team .gi::after{content:'🎁';font-size:30px} .team .gi.has::after{content:none}
    .team .tx{display:flex;flex-direction:column;line-height:1.05;min-width:0}
    .team.b .tx{align-items:flex-end}
    .team .nm{font-weight:700;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.18);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
    .team .sc{font-weight:700;font-size:30px;text-shadow:0 3px 0 rgba(0,0,0,.22)}
    .team .how{font-size:12px;opacity:.95;white-space:nowrap}
    .team.pull{animation:pull .45s cubic-bezier(.3,1.6,.5,1)}
    @keyframes pull{30%{transform:scale(1.08)}100%{transform:none}}
    .team.lead::after{content:'👑';position:absolute;top:-24px;left:22px;font-size:26px;animation:bob 1.2s ease-in-out infinite}
    .team.b.lead::after{left:auto;right:22px}
    @keyframes bob{50%{transform:translateY(-4px)}}
    .plus{position:absolute;top:-8px;left:50%;font-weight:700;font-size:26px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 10px var(--c);animation:up 1.1s ease-out forwards;pointer-events:none}
    @keyframes up{from{opacity:0;transform:translate(-50%,8px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}to{opacity:0;transform:translate(-50%,-50px) scale(1)}}
    .fly{position:fixed;width:56px;height:56px;object-fit:contain;z-index:6;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
    .feed{flex:1;align-self:center;text-align:center;font-size:15px;font-weight:500;color:#7a4fc0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      background:rgba(255,255,255,.9);border-radius:999px;padding:4px 12px;box-shadow:0 3px 10px rgba(80,40,120,.15);transition:opacity .3s;opacity:0}
    .win{position:absolute;left:8%;right:8%;top:14%;bottom:14%;display:none;flex-direction:column;align-items:center;justify-content:center;border-radius:40px;border:4px solid #fff;
      background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--w) 60%,white),var(--w));z-index:4;animation:pop .6s cubic-bezier(.3,1.6,.5,1);box-shadow:0 10px 30px rgba(0,0,0,.2)}
    .win.show{display:flex}
    .win .cr{font-size:48px;line-height:1;animation:bob 1s ease-in-out infinite}
    .win .wt{font:700 40px/1.1 'Mali','Kanit',sans-serif;text-shadow:0 3px 0 rgba(0,0,0,.25);text-align:center}
    .win .mvp{margin-top:4px;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
    .win .nx{margin-top:4px;font-size:14px;opacity:.9}
    @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
    @media (max-width:600px){.ttl{font-size:18px}.clock{font-size:15px}.team .gi{width:40px;height:40px}.team .gi img{width:32px;height:32px}.team .nm{font-size:12px;max-width:90px}.team .sc{font-size:20px}.team .how{display:none}.feed{display:none}.win .wt{font-size:24px}.win .cr{font-size:30px}}
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="game" class="bottom">
    <div class="ttlbar"><span class="ttl" id="ttl">⚔️ ชักเย่อ</span><span class="clock" id="clock" hidden></span></div>
    <div class="board">
      <div class="inner">
        <div class="goal ga"></div><div class="goal gb"></div><div class="mid"></div>
        <div id="rig">
          <div class="rope"></div><img class="bow" src="tug/bow.webp" alt="" />
          <img class="chr ca" id="chA" src="tug/bunny.webp" alt="" />
          <img class="chr cb" id="chB" src="tug/bear.webp" alt="" />
          <div id="knot"></div>
        </div>
      </div>
      <div class="win" id="win"><div class="cr">🏆</div><div class="wt" id="wt"></div><div class="mvp" id="wm"></div><div class="nx" id="wn"></div></div>
    </div>
    <div class="row">
      <div class="team a" id="ta"><div class="gi"><img id="ia" alt="" /></div><div class="tx"><div class="nm" id="na"></div><div class="sc" id="sa">0</div><div class="how" id="ha"></div></div></div>
      <div class="feed" id="feed"></div>
      <div class="team b" id="tb"><div class="gi"><img id="ib" alt="" /></div><div class="tx"><div class="nm" id="nb"></div><div class="sc" id="sb">0</div><div class="how" id="hb"></div></div></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script src="js/juice.js"></script>
  <script>
  /*
   * ⚔️ ชักเย่อ 2 ทีม — ของขวัญทีม A ดึงเชือกไปซ้าย · ทีม B ดึงไปขวา (คะแนน = เหรียญ × จำนวน หรือนับชิ้น)
   * ชนะเมื่อ: ปมเชือกถึงเส้นชัย (คะแนนนำห่าง ≥ win) หรือหมดเวลา (sec) ทีมที่นำชนะ → ฉลอง + MVP → เริ่มรอบใหม่เองหลัง next วิ
   * พารามิเตอร์: nameA colorA giftA nameB colorB giftB win=300 sec=180 next=10 count=coins|pieces pos=bottom|top|center scale bg title
   * จำรอบที่เล่นอยู่ในเครื่อง (รีโหลด/เปิด OBS ใหม่ไม่หาย) · ปุ่ม "เริ่มรอบใหม่" ใน Dashboard (resetAt) = รีเซ็ตคะแนน
   */
  (function () {
    const P = (k, d) => Overlay.param(k, d), num = (k, d) => { const v = Number(P(k, d)); return Number.isFinite(v) ? v : d; };
    const A = { name: P('nameA', 'ทีมชมพู'), color: P('colorA', '#ff6fae'), gift: P('giftA', 'Rose') };
    const B = { name: P('nameB', 'ทีมฟ้า'), color: P('colorB', '#4fa8ff'), gift: P('giftB', 'GG') };
    const WIN = Math.max(10, num('win', 300)), SEC = Math.max(0, num('sec', 180)), NEXT = Math.max(3, num('next', 10)), PIECES = P('count', 'coins') === 'pieces';
    const $ = (id) => document.getElementById(id), game = $('game');
    game.className = ['bottom', 'top', 'center'].includes(P('pos', 'bottom')) ? P('pos', 'bottom') : 'bottom';
    game.style.setProperty('--k', String(Math.max(0.4, Math.min(2, num('scale', 1)))));
    game.style.setProperty('--bg', String(Math.max(0, Math.min(100, num('bg', 72))) / 100));
    game.style.setProperty('--ca', A.color); game.style.setProperty('--cb', B.color);
    $('ta').style.setProperty('--c', A.color); $('tb').style.setProperty('--c', B.color);
    $('ttl').textContent = P('title', '⚔️ ชักเย่อ');
    $('na').textContent = A.name; $('nb').textContent = B.name;
    $('ha').textContent = 'ส่ง ' + A.gift; $('hb').textContent = 'ส่ง ' + B.gift;

    // รูปของขวัญประจำทีม (คลังรูปจริงจาก TikTok)
    const imgs = {};
    const setImg = (el, name) => { const u = imgs[name.toLowerCase()]; if (!u) return; el.onload = () => el.parentNode.classList.add('has'); el.onerror = () => el.classList.add('bad'); el.src = u; };
    fetch('/api/gifts').then((r) => r.json()).then(({ gifts }) => { for (const g of gifts || []) if (g.image) imgs[g.name.toLowerCase()] = g.image; setImg($('ia'), A.gift); setImg($('ib'), B.gift); }).catch(() => {});

    // ---- สถานะรอบ (จำในเครื่อง) ----
    const KEY = 'vjl-tug:' + (P('t', '') || P('username', 'demo')).slice(-24);
    const fresh = () => ({ a: 0, b: 0, start: Date.now(), winner: null, endAt: 0, ua: {}, ub: {} });
    let S = fresh();
    try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v && typeof v.a === 'number') S = v; } catch { /* ignore */ }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* ignore */ } };

    // ---- ปมเชือก: สปริงตามคะแนน (ดึงแล้วกระตุก + เด้งกลับ) ----
    const spring = new Juice.Spring(90, 9); let shown = 0;
    const target = () => Math.max(-1, Math.min(1, (S.b - S.a) / WIN)); // ลบ = ทีม A (ซ้าย) นำ
    spring.x = target(); shown = spring.x;

    // ---- เอฟเฟกต์ ----
    const cv = $('fx'), ctx = cv.getContext('2d'), fx = new Juice.Particles(500); let W = 0, H = 0; const DPR = Math.min(2, devicePixelRatio || 1);
    const resize = () => { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; };
    addEventListener('resize', resize); resize();

    function render() {
      $('sa').textContent = Overlay.fmt(S.a); $('sb').textContent = Overlay.fmt(S.b);
      $('ta').classList.toggle('lead', !S.winner && S.a > S.b); $('tb').classList.toggle('lead', !S.winner && S.b > S.a);
    }
    function plus(team, n) {
      const el = document.createElement('div'); el.className = 'plus'; el.textContent = '+' + Overlay.fmt(n);
      $(team === 'a' ? 'ta' : 'tb').appendChild(el); setTimeout(() => el.remove(), 1200);
    }
    function flyGift(team, src) { // รูปของขวัญพุ่งเข้าการ์ดทีม
      if (!src) return;
      const card = $(team === 'a' ? 'ta' : 'tb').getBoundingClientRect(), im = document.createElement('img');
      im.className = 'fly'; im.src = src; document.body.appendChild(im);
      const x0 = card.left + card.width / 2 - 28 + (team === 'a' ? -40 : 40), y0 = Math.min(H - 60, card.bottom + 120), x1 = card.left + card.width / 2 - 28, y1 = card.top + 10;
      im.animate([{ transform: `translate(${x0}px,${y0}px) scale(.4) rotate(-20deg)`, opacity: 0 }, { transform: `translate(${(x0 + x1) / 2}px,${Math.min(y0, y1) - 60}px) scale(1.1) rotate(10deg)`, opacity: 1, offset: 0.55 }, { transform: `translate(${x1}px,${y1}px) scale(.7)`, opacity: 0 }], { duration: 800, easing: 'cubic-bezier(.3,.7,.4,1)' }).onfinish = () => im.remove();
    }
    function feed(text) { const f = $('feed'); f.textContent = text; f.style.opacity = '1'; clearTimeout(feed.t); feed.t = setTimeout(() => { f.style.opacity = '0'; }, 2600); }

    function mvpOf(map) { let best = null; for (const [k, v] of Object.entries(map || {})) if (!best || v.p > best.p) best = { n: v.n || k, p: v.p }; return best; }
    function finish(winner) {
      if (S.winner) return;
      S.winner = winner; S.endAt = Date.now() + NEXT * 1000; save(); showWin();
    }
    function showWin() {
      const w = S.winner, box = $('win');
      if (!w) { box.classList.remove('show'); return; }
      const T = w === 'a' ? A : w === 'b' ? B : null;
      box.style.setProperty('--w', T ? T.color : '#9a7bd8');
      $('wt').textContent = T ? `${T.name} ชนะ!` : 'เสมอกัน!';
      const m = w === 'a' ? mvpOf(S.ua) : w === 'b' ? mvpOf(S.ub) : null;
      $('wm').textContent = m ? `👑 MVP: ${m.n} (${Overlay.fmt(m.p)})` : '';
      box.classList.add('show');
      const r = box.getBoundingClientRect();
      for (let i = 0; i < 3; i++) setTimeout(() => fx.confetti(r.left + r.width * (0.25 + i * 0.25), r.top + 20, 50), i * 250);
    }
    function newRound() { S = fresh(); save(); $('win').classList.remove('show'); render(); }

    function onGift(e) {
      if (!e || e.type !== 'gift' || e.streaking) return;
      if (S.winner) return; // ระหว่างฉลอง: ไม่นับ (เริ่มรอบใหม่แล้วค่อยนับ)
      const g = String(e.giftName || '').toLowerCase(), team = g === A.gift.toLowerCase() ? 'a' : g === B.gift.toLowerCase() ? 'b' : null;
      if (!team) return;
      const n = Math.max(1, e.repeatCount || 1), pts = PIECES ? n : (e.diamondCount || 1) * n;
      S[team] += pts;
      const u = e.user || {}, id = u.uniqueId || u.nickname || '?', map = team === 'a' ? S.ua : S.ub;
      map[id] = { n: u.nickname || id, p: ((map[id] && map[id].p) || 0) + pts };
      if (e.giftImage) imgs[g] = imgs[g] || e.giftImage;
      save(); render();
      spring.kick((team === 'a' ? -1 : 1) * Math.min(2.2, 0.5 + pts / WIN * 3)); // กระตุกไปทางทีมที่ดึง
      const card = $(team === 'a' ? 'ta' : 'tb'); card.classList.remove('pull'); void card.offsetWidth; card.classList.add('pull');
      const ch = $(team === 'a' ? 'chA' : 'chB'); ch.classList.remove('tug'); void ch.offsetWidth; ch.classList.add('tug'); // ตัวละครออกแรงดึง
      plus(team, pts); flyGift(team, e.giftImage || imgs[g]);
      feed(`${u.nickname || id} ช่วย${team === 'a' ? A.name : B.name} +${Overlay.fmt(pts)}`);
      const k = $('knot').getBoundingClientRect(); fx.sparkle(k.left + k.width / 2, k.top + k.height / 2, 6); fx.dust(k.left + k.width / 2, k.bottom, 6);
      if (S.a - S.b >= WIN) finish('a'); else if (S.b - S.a >= WIN) finish('b');
    }
    Overlay.on('event', onGift);

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      // สปริงหาเป้าหมาย (คะแนน) + กระตุกที่เตะไว้
      const tg = target(); spring.x -= tg; spring.step(dt); spring.x += tg;
      shown = Math.max(-1.08, Math.min(1.08, spring.x));
      const left = 50 + shown * 30;
      $('rig').style.transform = `translateX(calc(-50% + ${(shown * 30 / 1.6).toFixed(3)}%))`; // ปมเชือก ±30% ของช่อง = ถึงเส้นชัย 🏁
      void left;
      // นาฬิกา
      if (SEC > 0 && !S.winner) {
        const rem = Math.max(0, Math.ceil(SEC - (Date.now() - S.start) / 1000)), c = $('clock');
        c.hidden = false; c.textContent = `${Math.floor(rem / 60)}:${String(rem % 60).padStart(2, '0')}`; c.classList.toggle('hot', rem <= 10);
        if (rem <= 0) finish(S.a > S.b ? 'a' : S.b > S.a ? 'b' : 'draw');
      } else if (S.winner) {
        const rem = Math.max(0, Math.ceil((S.endAt - Date.now()) / 1000)); $('wn').textContent = `รอบใหม่ใน ${rem} วิ`;
        if (Date.now() >= S.endAt) newRound();
      }
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H); fx.step(); fx.draw(ctx);
      requestAnimationFrame(frame);
    }
    render(); if (S.winner) showWin();
    requestAnimationFrame(frame);

    // เดโม (พรีวิวในแดชบอร์ด / เปิดไฟล์ตรง ๆ): ของขวัญสุ่มเข้าทั้งสองทีม
    if (!Overlay.connected) {
      const names = ['mimi', 'บิ๊ก', 'ต้นน้ำ', 'lisa', 'somchai'];
      setInterval(() => {
        const t = Math.random() < 0.5 ? A : B, c = Math.random() < 0.15 ? 5 : 1;
        onGift({ type: 'gift', giftName: t.gift, repeatCount: c, diamondCount: [1, 1, 5, 10, 30][Math.floor(Math.random() * 5)], user: { uniqueId: names[Math.floor(Math.random() * names.length)], nickname: names[Math.floor(Math.random() * names.length)] } });
      }, 900);
    }
  })();
  </script>
</body>
</html>
