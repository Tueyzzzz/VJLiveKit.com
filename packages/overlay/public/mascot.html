<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VJ Mascot Overlay</title>
<link rel="icon" href="favicon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@600;700&display=swap');
  html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Mali','Itim',sans-serif; }
  /* ตัวละคร: กล่องสูง 420px คูณ --s · ยึดมุมตาม pos */
  #wrap { position:fixed; left:0; right:0; bottom:0; display:flex; align-items:flex-end; padding:0 10px; pointer-events:none; }
  .bl #wrap { justify-content:flex-start; } .br #wrap { justify-content:flex-end; } .bc #wrap { justify-content:center; }
  #stage { position:relative; width:420px; height:470px; zoom:var(--s,1); }
  #walker { position:absolute; left:0; right:0; bottom:0; height:420px; transition:transform 1.6s cubic-bezier(.45,.05,.4,1); transform-origin:50% 100%; }
  #shadow { position:absolute; left:50%; bottom:6px; width:230px; height:30px; margin-left:-115px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(70,30,90,.32), rgba(70,30,90,0)); animation:shadowBreath 3s ease-in-out infinite; }
  #char { position:absolute; left:50%; bottom:10px; width:420px; height:420px; margin-left:-210px; transform-origin:50% 100%;
    animation:breath 3.4s ease-in-out infinite; filter:drop-shadow(0 6px 10px rgba(80,40,110,.25)); }
  #char img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity .11s linear; }
  #char img.on { opacity:1; }
  #char.video img:not(.vid) { display:none; }
  #char img.vid { opacity:1; transition:none; }
  /* ท่าทางทั้งตัวต้องเหมือนคนจริง: ไม่เอียง/โยก/หมุน/บีบยืดทั้งรูป — มีแค่หายใจเบา ๆ กับขยับขึ้นลงตามจังหวะ */
  #char.video { animation:none; } /* โหมดวิดีโอ: คลิปขยับเองอยู่แล้ว */
  #char.hop { animation:hop .5s ease-out, breath 3.4s ease-in-out .5s infinite; }
  #char.dance { animation:dance .76s ease-in-out infinite; }
  @keyframes breath { 0%,100% { scale:1 1 } 50% { scale:1.004 1.01 } } /* อกขยายนิดเดียว */
  @keyframes shadowBreath { 50% { transform:scaleX(1.02); opacity:.9 } }
  @keyframes hop { 0% { transform:translateY(0) } 40% { transform:translateY(-14px) } 100% { transform:translateY(0) } } /* เขย่งดีใจ */
  @keyframes dance { 0%,100% { transform:translateY(0) } 30% { transform:translateY(5px) } 60% { transform:translateY(-8px) } } /* ย่อเข่า-เด้งตามจังหวะ */
  #char.walking { animation:walkbob .54s ease-in-out infinite; }
  @keyframes walkbob { 0%,100% { transform:translateY(0) } 25% { transform:translateY(-5px) } 50% { transform:translateY(0) } 75% { transform:translateY(-5px) } }
  #char.bigjump { animation:bigjump .95s cubic-bezier(.3,.7,.4,1); }
  @keyframes bigjump { 0%,18% { transform:translateY(8px) } 45%,62% { transform:translateY(-110px) } 88% { transform:translateY(6px) } 100% { transform:translateY(0) } } /* ย่อตัว → กระโดด → ลงย่อเข่า (ไม่บีบยืดรูป) */

  /* ของขวัญในมือ (ท่ารับของขวัญ) */
  #gift { position:absolute; left:50%; top:var(--gy,58%); width:92px; height:92px; margin:-46px 0 0 -46px; object-fit:contain; opacity:0; pointer-events:none;
    filter:drop-shadow(0 4px 8px rgba(255,180,220,.8)) drop-shadow(0 0 14px rgba(255,255,255,.9)); }
  #gift.on { animation:giftIn .55s cubic-bezier(.3,1.6,.5,1) forwards, giftBob 1.6s ease-in-out .55s infinite; }
  @keyframes giftIn { from { opacity:0; transform:translateY(-120px) scale(.3) rotate(-25deg) } to { opacity:1; transform:none } }
  @keyframes giftBob { 0%,100% { opacity:1; transform:translateY(0) } 50% { opacity:1; transform:translateY(-5px) } }

  /* กล่องคำพูด */
  #bubble { position:absolute; left:50%; bottom:430px; transform:translateX(-50%) scale(.6); opacity:0; max-width:360px; width:max-content;
    padding:12px 18px; border-radius:22px; background:linear-gradient(180deg,#fff,#fff3fa); border:3px solid #ffc6e2; color:#7a3f6e;
    font-size:21px; font-weight:700; line-height:1.35; text-align:center; box-shadow:0 8px 22px rgba(200,90,160,.25); transition:all .35s cubic-bezier(.3,1.5,.5,1); }
  #bubble::after { content:''; position:absolute; left:50%; bottom:-14px; margin-left:-12px; border:12px solid transparent; border-top-color:#ffc6e2; border-bottom:0; }
  #bubble.on { opacity:1; transform:translateX(-50%) scale(1); }
  #bubble b { color:#e0468e; }
  .br #bubble { left:auto; right:30px; transform:scale(.6); transform-origin:85% 100%; } .br #bubble.on { transform:scale(1); } .br #bubble::after { left:auto; right:60px; }
  .bl #bubble { left:30px; transform:scale(.6); transform-origin:15% 100%; } .bl #bubble.on { transform:scale(1); } .bl #bubble::after { left:60px; }

  /* ป้ายชื่อ */
  #name { position:absolute; left:50%; bottom:2px; transform:translateX(-50%); padding:3px 14px; border-radius:999px; font-size:15px; font-weight:700; color:#fff;
    background:linear-gradient(90deg,#ff8ac2,#b28bff); box-shadow:0 3px 10px rgba(180,80,160,.3); white-space:nowrap; }

  /* ประกายระยิบระยับ (ดาว 4 แฉก เรืองแสง) */
  .tw { position:absolute; width:var(--z,16px); height:var(--z,16px); pointer-events:none; background:var(--c,#fff);
    clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%); filter:drop-shadow(0 0 6px var(--c,#fff)) drop-shadow(0 0 14px rgba(255,255,255,1)) brightness(1.15);
    animation:twinkle var(--d,1.4s) ease-in-out forwards; }
  .tw.dot { clip-path:circle(50%); }
  @keyframes twinkle { 0% { opacity:0; transform:scale(.2) rotate(0deg) } 35% { opacity:1; transform:scale(1) rotate(25deg) } 65% { opacity:.9; transform:scale(.75) rotate(45deg) } 100% { opacity:0; transform:scale(.1) rotate(90deg) translateY(-14px) } }
  /* อนุภาค */
  .p { position:absolute; pointer-events:none; font-size:26px; animation:rise var(--d,1.8s) ease-out forwards; }
  @keyframes rise { 0% { opacity:0; transform:translate(0,0) scale(.4) } 15% { opacity:1 } 100% { opacity:0; transform:translate(var(--x,0),-220px) scale(1.2) rotate(var(--r,0deg)) } }
  .cf { position:absolute; width:10px; height:14px; border-radius:3px; pointer-events:none; animation:conf var(--d,1.6s) ease-out forwards; }
  @keyframes conf { 0% { opacity:1; transform:translate(0,0) rotate(0) } 100% { opacity:0; transform:translate(var(--x),var(--y)) rotate(var(--r)) } }
</style>
</head>
<body>
  <div id="wrap"><div id="stage"><div id="walker">
    <div id="bubble"></div>
    <div id="shadow"></div>
    <div id="char"></div>
    <img id="gift" alt="" />
    <div id="name" hidden></div>
  </div></div></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script src="js/collect-store.js"></script>
  <script>
  (function () {
    // ตัวแทนวีเจ (มาสคอต) — ยืนมุมจอ หายใจ กะพริบตา ผมปลิว · ได้กิฟต์ยื่นมือรับ (รูปกิฟต์จริง) + ขอบคุณ · กิฟต์ใหญ่ดีใจแล้วเต้น
    // มีคนติดตามส่งหัวใจ · Action "มาสคอต" สั่งเต้น / เดินมาส่งจุ๊บ / ดีใจ / ส่งหัวใจ ได้จากกฎ
    // ?tint=0 (หมุนเฉดสีชุด/ผม) · ?char=G1 · ?pos=br|bl|bc · ?scale=1 · ?thanks=1 · ?thankText=… · ?big=100 · ?follow=1 · ?name=
    const P = (k, d) => Overlay.param(k, d);
    const CHARS = ['G1', 'G2', 'G4', 'G6', 'G8', 'G11', 'B4', 'B7', 'B8', 'B10'];
    const C = CHARS.includes(P('char', 'G1')) || /^C[A-Za-z0-9]{2,24}$/.test(P('char', '')) ? P('char', 'G1') : 'G1'; // C… = มาสคอตสั่งทำ
    const POS = ['bl', 'br', 'bc'].includes(P('pos', 'br')) ? P('pos', 'br') : 'br';
    document.body.className = POS;
    document.documentElement.style.setProperty('--s', Math.max(.3, Math.min(3, parseFloat(P('scale', '1')) || 1)));
    const THANKS = P('thanks', '1') !== '0', FOLLOW = P('follow', '1') !== '0', BIG = Math.max(1, parseInt(P('big', '100'), 10) || 100);
    const THANK_TEXT = P('thankText', 'ขอบคุณ {user} ที่ส่ง {gift} นะคะ 💖');
    const FOLLOW_TEXT = P('followText', 'ขอบคุณ {user} ที่ติดตามน้า 😘');
    const NAME = P('name', '');
    if (NAME) { const n = document.getElementById('name'); n.textContent = NAME; n.hidden = false; }

    // โหลดทุกท่าไว้ก่อน (สลับท่าไม่กระพริบ)
    const $char = document.getElementById('char'), $bubble = document.getElementById('bubble'), $gift = document.getElementById('gift'), $walker = document.getElementById('walker'), $stage = document.getElementById('stage');
    const imgs = {};
    const TINT = ((parseFloat(P('tint', '0')) || 0) % 360 + 360) % 360;
    // เปลี่ยนสี: หมุนเฉดสีเฉพาะส่วนที่สีสด (ชุด ผม ของประดับ) — ข้ามโทนผิว (ส้มอ่อน ๆ) และสีขาว/เทา
    function recolor(src) {
      return new Promise((ok) => {
        const im = new Image(); im.crossOrigin = 'anonymous';
        im.onload = () => {
          try {
            const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
            const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0);
            const d = x.getImageData(0, 0, c.width, c.height), a = d.data, sh = TINT / 360;
            for (let i = 0; i < a.length; i += 4) {
              if (a[i + 3] < 8) continue;
              const r = a[i] / 255, g = a[i + 1] / 255, b = a[i + 2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, dl = mx - mn;
              if (dl < 0.08) continue; // ขาว/เทา/ดำ
              const s = dl / (1 - Math.abs(2 * l - 1));
              let h = mx === r ? ((g - b) / dl) % 6 : mx === g ? (b - r) / dl + 2 : (r - g) / dl + 4; h /= 6; if (h < 0) h += 1;
              const sv = dl / mx; // ความสดแบบ HSV (ผิวสีอ่อนมากจะไม่ถูกนับว่าสีจัด)
              if ((h <= 0.14 || h >= 0.96) && sv < 0.5 && mx > 0.55) continue; // โทนผิว (รวมแก้มแดง)
              if (h > 0.02 && h < 0.12 && sv < 0.62 && mx > 0.4) continue; // ผิวส่วนเงา
              h = (h + sh) % 1;
              const q = l < .5 ? l * (1 + s) : l + s - l * s, p2 = 2 * l - q;
              const f = (t) => { t = (t + 1) % 1; return t < 1 / 6 ? p2 + (q - p2) * 6 * t : t < .5 ? q : t < 2 / 3 ? p2 + (q - p2) * (2 / 3 - t) * 6 : p2; };
              a[i] = f(h + 1 / 3) * 255; a[i + 1] = f(h) * 255; a[i + 2] = f(h - 1 / 3) * 255;
            }
            x.putImageData(d, 0, 0); ok(c.toDataURL('image/webp', .9));
          } catch (e) { ok(src); }
        };
        im.onerror = () => ok(src); im.src = src;
      });
    }
    for (let n = 1; n <= 17; n++) {
      const im = new Image(), src = `mascot/${C}/${n}.webp?v=${encodeURIComponent(window.VJL_VERSION || '1')}`; im.alt = ''; $char.appendChild(im); imgs[n] = im;
      if (TINT) recolor(src).then((u) => { im.src = u; }); else im.src = src;
    }
    let cur = 0;
    // สลับท่าแบบไม่วูบ: ท่าใหม่จางขึ้น "ทับ" ท่าเดิม (ท่าเดิมยังทึบอยู่ข้างใต้) แล้วค่อยซ่อนท่าเดิมทันทีที่ท่าใหม่ขึ้นเต็ม
    let zTop = 1, hideT = null;
    const pose = (n) => {
      if (cur === n) return;
      const prev = imgs[cur], next = imgs[n];
      next.style.zIndex = String(++zTop); next.classList.add('on');
      clearTimeout(hideT);
      for (const k in imgs) if (+k !== n && imgs[k] !== prev && imgs[k].classList.contains('on')) { const im = imgs[k]; im.style.transition = 'none'; im.classList.remove('on'); requestAnimationFrame(() => { im.style.transition = ''; }); }
      if (prev) hideT = setTimeout(() => { prev.style.transition = 'none'; prev.classList.remove('on'); requestAnimationFrame(() => { prev.style.transition = ''; }); }, 130);
      cur = n;
    };
    pose(1);

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    // ---- โหมดวิดีโอ: ตัวที่มี mascot/<ตัว>/video.json → เล่นคลิปวิดีโอ (WebP เคลื่อนไหวพื้นใส) แทนภาพนิ่ง ----
    // ไม่มีไฟล์ / เปลี่ยนสี (tint) / ?video=0 → ใช้ภาพนิ่งแบบเดิม · คลิปที่ไม่มี (เช่น heart) → ใช้ท่าภาพนิ่งแทน
    const VIDEO = { on: false, clips: {}, el: null, t: null };
    function playClip(k) {
      const c = VIDEO.clips[k]; if (!c) return 0;
      const old = VIDEO.el.src; VIDEO.el.src = URL.createObjectURL(c.blob); // URL ใหม่ = เริ่มคลิปจากต้น
      if (old && old.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(old), 1500);
      clearTimeout(VIDEO.t); if (k !== 'idle') VIDEO.t = setTimeout(() => playClip('idle'), c.ms);
      return c.ms;
    }
    async function clip(k, maxMs) { if (!VIDEO.on || !VIDEO.clips[k]) return false; const ms = playClip(k); await wait(Math.min(ms, maxMs || ms)); return true; }
    (async () => {
      if (TINT || P('video', '1') === '0') return;
      try {
        const v = encodeURIComponent(window.VJL_VERSION || '1');
        const man = await fetch(`mascot/${C}/video.json?v=${v}`).then((r) => (r.ok ? r.json() : null));
        if (!man || !man.idle) return;
        const clips = {};
        await Promise.all(Object.keys(man).map(async (k) => { const b = await fetch(`mascot/${C}/v-${k}.webp?v=${v}`).then((r) => (r.ok ? r.blob() : null)); if (b) clips[k] = { blob: b, ms: man[k] }; }));
        if (!clips.idle) return;
        const el = new Image(); el.alt = ''; el.className = 'vid'; $char.appendChild(el);
        VIDEO.clips = clips; VIDEO.el = el; VIDEO.on = true; $char.classList.add('video'); playClip('idle');
      } catch (e) { /* ใช้ภาพนิ่ง */ }
    })();
    const esc = (s) => Overlay.esc(s);
    const fillText = (t, e) => esc(t).replace(/\{user\}/g, `<b>${esc(e.user ? (e.user.nickname || e.user.uniqueId) : 'ทุกคน')}</b>`).replace(/\{gift\}/g, `<b>${esc(e.giftName || 'ของขวัญ')}</b>`);
    let bubbleT = null;
    function say(html, ms = 3200) { $bubble.innerHTML = html; $bubble.classList.add('on'); clearTimeout(bubbleT); bubbleT = setTimeout(() => $bubble.classList.remove('on'), ms); }
    function hop() { $char.classList.remove('hop'); void $char.offsetWidth; $char.classList.add('hop'); }
    function particles(chars, n = 10, d = 1.8) {
      for (let i = 0; i < n; i++) setTimeout(() => {
        const p = document.createElement('div'); p.className = 'p'; p.textContent = chars[i % chars.length];
        p.style.left = (150 + Math.random() * 120) + 'px'; p.style.bottom = (180 + Math.random() * 80) + 'px';
        p.style.setProperty('--x', (Math.random() * 160 - 80) + 'px'); p.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg'); p.style.setProperty('--d', d + 's');
        $walker.appendChild(p); setTimeout(() => p.remove(), d * 1000 + 100);
      }, i * 90);
    }
    function confetti(n = 40) {
      const cols = ['#ff6aa8', '#ffcf5c', '#8fe3cf', '#b9a6f2', '#7cc6ff'];
      for (let i = 0; i < n; i++) {
        const c = document.createElement('div'); c.className = 'cf'; c.style.background = cols[i % cols.length];
        c.style.left = '210px'; c.style.bottom = '300px';
        const a = Math.random() * Math.PI - Math.PI, v = 140 + Math.random() * 220;
        c.style.setProperty('--x', Math.cos(a) * v + 'px'); c.style.setProperty('--y', (Math.sin(a) * v + 260) + 'px'); c.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg'); c.style.setProperty('--d', (1.2 + Math.random() * .8) + 's');
        $walker.appendChild(c); setTimeout(() => c.remove(), 2200);
      }
    }

    // ---- ประกายระยิบระยับรอบตัว: ?sparkle=off|soft|lots ----
    const SPARK = P('sparkle', 'soft'), TW_COLORS = ['#ffffff', '#fff3b0', '#ffd1ec', '#d9c9ff', '#c9f2ff'];
    function twinkle(n = 1, spread = 1) {
      for (let i = 0; i < n; i++) setTimeout(() => {
        const t = document.createElement('div'); t.className = 'tw' + (Math.random() < .25 ? ' dot' : '');
        const a = Math.random() * Math.PI * 2, r = (120 + Math.random() * 90) * spread;
        t.style.left = (210 + Math.cos(a) * r * 0.8 - 8) + 'px'; t.style.bottom = (210 + Math.sin(a) * r - 8) + 'px';
        t.style.setProperty('--z', (16 + Math.random() * 22) + 'px'); t.style.setProperty('--c', TW_COLORS[(Math.random() * TW_COLORS.length) | 0]);
        t.style.setProperty('--d', (1 + Math.random() * 0.9) + 's');
        $walker.appendChild(t); setTimeout(() => t.remove(), 2000);
      }, i * 70);
    }
    if (SPARK !== 'off') setInterval(() => { if (!document.hidden) twinkle(SPARK === 'lots' ? 3 : 2); }, SPARK === 'lots' ? 240 : 520);

    // ---- ท่าทางเวลาว่าง: กะพริบตา · ผมปลิว · ทำท่าเล่นเองเป็นระยะ (ไม่ยืนนิ่ง) ----
    let busy = false;
    (function blink() {
      setTimeout(async () => { if (!busy) { pose(2); await wait(130); if (!busy) pose(1); } blink(); }, 2200 + Math.random() * 2400);
    })();
    // เดินไปด้านข้างแล้วเดินกลับ (สลับท่าก้าวซ้าย-ขวา)
    async function walk(dist) {
      const dir = POS === 'br' ? -1 : POS === 'bl' ? 1 : (Math.random() < .5 ? -1 : 1), dx = dir * (dist || 150);
      $walker.style.transition = 'transform 2.2s cubic-bezier(.4,.1,.4,1)';
      $walker.style.transform = `translateX(${dx}px)`;
      $char.classList.add('walking');
      for (let i = 0; i < 8; i++) { pose(i % 2 ? 13 : 12); await wait(270); }
      $char.classList.remove('walking'); pose(1); await wait(500); pose(8); hop(); particles(['💗'], 3, 1.4); await wait(800);
      $walker.style.transform = '';
      $char.classList.add('walking');
      for (let i = 0; i < 8; i++) { pose(i % 2 ? 13 : 12); await wait(270); }
      $char.classList.remove('walking');
      $walker.style.transition = '';
    }
    // หมุนตัวแบบคน: หันหลัง (ท่ามองจากด้านหลัง) แล้วหันกลับมาดีใจ — ไม่พลิกรูปแบน ๆ
    async function spin() { pose(16); await wait(480); pose(7); hop(); particles(['✨', '⭐', '💫'], 8, 1.6); if (SPARK !== 'off') twinkle(12, 1); await wait(700); }
    async function bigJump() { pose(1); $char.classList.remove('bigjump'); void $char.offsetWidth; $char.classList.add('bigjump'); await wait(230); pose(7); particles(['🎉', '✨'], 8, 1.6); await wait(560); pose(1); await wait(200); $char.classList.remove('bigjump'); }
    const IDLE = [
      () => walk(),
      async () => { for (let i = 0; i < 6; i++) { pose(i % 2 ? 5 : 4); await wait(230); } },                   // สะบัดผม
      async () => { pose(8); hop(); particles(['💗', '💕'], 4, 1.6); await wait(1100); },                      // ส่งหัวใจเล่น ๆ
      async () => { pose(3); await wait(1200); },                                                              // ยิ้มเฉย ๆ (ไม่โยกตัว)
      async () => { $char.classList.add('dance'); for (const n of [9, 10, 9, 10]) { pose(n); await wait(330); } $char.classList.remove('dance'); }, // เต้นสั้น ๆ
      async () => { pose(7); hop(); particles(['✨', '⭐'], 4, 1.4); await wait(900); },                        // ดีใจเบา ๆ
    ];
    (function idleAct() {
      setTimeout(async () => { if (!busy && !running) { busy = true; try { if (VIDEO.on) { if (Math.random() < 0.3 && VIDEO.clips.dance) await clip('dance', 3600); } else await IDLE[Math.floor(Math.random() * IDLE.length)](); } catch (e) { /* ignore */ } pose(1); busy = false; } idleAct(); }, 6000 + Math.random() * 6000);
    })();

    // ---- คิวท่าทาง (ทีละอย่าง ไม่ทับกัน) ----
    const queue = []; let running = false;
    function enqueue(fn) { if (queue.length > 6) queue.shift(); queue.push(fn); if (!running) run(); }
    async function run() { running = true; while (queue.length) { busy = true; try { await queue.shift()(); } catch (e) { /* ignore */ } pose(1); $char.classList.remove('dance'); busy = false; await wait(250); } running = false; }

    async function receive(e) {
      const img = e.giftImage || (window.VJLCollect ? VJLCollect.imgFor(e.giftName) : '');
      if (VIDEO.on && VIDEO.clips.thanks) playClip('thanks'); else { pose(6); hop(); }
      if (img) { $gift.src = img; $gift.classList.remove('on'); void $gift.offsetWidth; $gift.classList.add('on'); }
      if (THANKS) say(fillText(THANK_TEXT, e), 3000);
      particles(['✨', '💖', '⭐'], 6);
      if (SPARK !== 'off') twinkle(SPARK === 'lots' ? 14 : 8, 0.8);
      await wait(2600); $gift.classList.remove('on');
    }
    async function joy(e) {
      if (VIDEO.on && VIDEO.clips.joy) { confetti(); particles(['🎉', '✨', '💖'], 10); if (SPARK !== 'off') twinkle(20, 1.1); if (e && THANKS) say(fillText(THANK_TEXT, e), 3800); await clip('joy', 4200); return; }
      pose(7); hop(); confetti(); particles(['🎉', '✨', '💖'], 10); if (SPARK !== 'off') twinkle(20, 1.1);
      if (e && THANKS) say(fillText(THANK_TEXT, e), 3800);
      await wait(1600);
    }
    async function dance(times = 3) {
      if (await clip('dance', times <= 2 ? 3600 : 5200)) return;
      $char.classList.add('dance');
      for (let i = 0; i < times; i++) for (const n of [9, 10, 11]) { pose(n); await wait(380); }
      $char.classList.remove('dance');
    }
    async function heart(e) {
      if (VIDEO.on && VIDEO.clips.heart) { particles(['💗', '💕', '💖', '🩷'], 12, 2); if (e) say(fillText(FOLLOW_TEXT, e), 3000); await clip('heart', 4200); return; }
      if (VIDEO.on) { particles(['💗', '💕', '💖', '🩷'], 12, 2); if (e) say(fillText(FOLLOW_TEXT, e), 3000); playClip('joy'); await wait(2200); return; }
      pose(8); hop(); particles(['💗', '💕', '💖', '🩷'], 12, 2);
      if (e) say(fillText(FOLLOW_TEXT, e), 3000);
      await wait(2200);
    }
    async function kiss(e) {
      // เดินเข้ามาใกล้จอ → ส่งจุ๊บ → หันหลังเดินกลับ
      const toward = POS === 'br' ? 'translateX(-120px)' : POS === 'bl' ? 'translateX(120px)' : 'translateX(0)';
      $walker.style.transform = `${toward} scale(1.35)`;
      $char.classList.add('walking');
      for (let i = 0; i < 6; i++) { pose(i % 2 ? 13 : 12); await wait(270); }
      $char.classList.remove('walking');
      pose(14); await wait(650);
      pose(15); particles(['💋', '💗', '💕'], 14, 2.2);
      if (e) say(fillText('จุ๊บ ๆ ให้ {user} 💋', e), 2600);
      await wait(1300);
      $walker.style.transform = '';
      $char.classList.add('walking');
      for (let i = 0; i < 6; i++) { pose(i % 2 ? 17 : 16); await wait(270); }
      $char.classList.remove('walking');
    }

    let lastPing = 0;
    const ping = async (n, parts) => { // ท่าสั้น ๆ ตอบแชท/ไลก์ (เว้นอย่างน้อย 2.5 วิ)
      if (busy || running || Date.now() - lastPing < 2500) return; lastPing = Date.now(); busy = true;
      if (VIDEO.on) { if (parts) particles(parts, 3, 1.4); await wait(650); busy = false; return; }
      pose(n); hop(); if (parts) particles(parts, 3, 1.4); await wait(650); pose(1); busy = false;
    };
    Overlay.on('event', (e) => {
      if (e.type === 'chat') void ping(3);
      else if (e.type === 'like') void ping(8, ['💗', '💖']);
      if (e.type === 'gift' && !e.streaking) {
        const value = e.totalValue || (e.diamondCount || 0) * (e.repeatCount || 1);
        if (value >= BIG) enqueue(async () => { await receive(e); await joy(null); await dance(2); });
        else enqueue(() => receive(e));
      } else if (e.type === 'follow' && FOLLOW) enqueue(() => heart(e));
    });
    // Action "มาสคอต" จากกฎ (หน้า Actions)
    Overlay.on('action', (f) => {
      const a = f.action || {}; if (a.type !== 'mascot') return;
      const ev = f.event || {}, m = a.move || 'dance';
      enqueue(async () => {
        if (a.text) say(fillText(a.text, ev), 3200);
        if (m === 'spin') await spin(); else if (m === 'jump') await bigJump(); else if (m === 'walk') await walk(220); else if (m === 'kiss') await kiss(a.text ? null : ev); else if (m === 'joy') await joy(null); else if (m === 'heart') await heart(a.text ? null : ev); else await dance(3);
      });
    });

    // ---- พรีวิว (ไม่มีลิงก์จริง) ----
    if (!Overlay.connected) {
      const demo = window.VJLCollect ? () => VJLCollect.demoGift() : () => ({ type: 'gift', user: { nickname: 'mimi' }, giftName: 'Rose', diamondCount: 1 });
      const seq = [() => enqueue(() => receive(demo())), () => enqueue(() => heart({ user: { nickname: 'บิ๊ก' } })), () => enqueue(() => receive(demo())),
        () => enqueue(async () => { await joy(null); await dance(2); }), () => enqueue(() => kiss({ user: { nickname: 'lisa' } }))];
      let i = 0; setTimeout(function loop() { seq[i++ % seq.length](); setTimeout(loop, 6500); }, 900);
    }
  })();
  </script>
</body>
