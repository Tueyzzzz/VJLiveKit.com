<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FX Overlay</title>
<link rel="icon" href="favicon.svg" />
<link rel="stylesheet" href="css/sign-styles.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@600&family=Mali:wght@700&display=swap');
  html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Itim',sans-serif; }
  #fx { position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; }
  .media { max-width:70vw; max-height:70vh; border-radius:20px; box-shadow:0 20px 50px rgba(0,0,0,.4);
    animation:pop .4s cubic-bezier(.2,1.4,.4,1); }
  .text { font-size:48px; color:#fff; text-align:center; padding:20px 40px; border-radius:24px;
    background:linear-gradient(135deg,#ff93c0,#9d86e8); box-shadow:0 16px 40px rgba(120,80,150,.45);
    animation:pop .4s cubic-bezier(.2,1.4,.4,1); max-width:80vw; }
  @keyframes pop { from{transform:scale(.5);opacity:0;} to{transform:scale(1);opacity:1;} }
  @keyframes fade { to{opacity:0;transform:scale(.96);} }
  #armBtn { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); pointer-events:auto;
    font-family:'Itim',sans-serif; font-size:15px; border:none; cursor:pointer; padding:9px 18px; border-radius:999px;
    color:#fff; background:linear-gradient(135deg,#b9a6f2,#9d86e8); box-shadow:0 6px 14px rgba(150,120,180,.3); }
  /* ---- ไพ่ทาโร่ ---- */
  .tarot { position:fixed; left:0; right:0; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:center; text-align:center; color:#fff;
    animation:tIn .7s cubic-bezier(.2,1.3,.4,1) both; perspective:1200px; }
  .tarot .who { font-size:24px; margin-bottom:10px; text-shadow:0 2px 6px rgba(0,0,0,.7); }
  .tspread { display:flex; flex-direction:column; gap:calc(22px * var(--s,1)); align-items:center; }
  .trow { display:flex; gap:calc(18px * var(--s,1)); justify-content:center; align-items:flex-start; }
  .tslot { width:calc(260px * var(--s,1)); perspective:1200px; }
  .tslot .lbl { font-size:calc(22px * var(--s,1) + 4px); margin-bottom:8px; color:#ffe7b0; text-shadow:0 2px 6px rgba(0,0,0,.7); animation:tPop .4s both; white-space:nowrap; }
  .tcard { position:relative; width:260px; height:390px; transform-origin:0 0; transform-style:preserve-3d; animation:tFlip 1.1s cubic-bezier(.5,0,.2,1) both; }
  .tbox { width:calc(260px * var(--s,1)); height:calc(390px * var(--s,1)); }
  .tbox > .tcard { transform:scale(var(--s,1)); transform-origin:0 0; animation:none; }
  .tbox > .tcard > .tin { position:absolute; inset:0; transform-style:preserve-3d; animation:tFlip 1.1s cubic-bezier(.5,0,.2,1) both; animation-delay:inherit; }
  /* รูปไพ่วาดขอบทองมาในตัวแล้ว — แถบม่วงด้านล่าง (~84–96%) เว้นไว้ใส่ชื่อไพ่ */
  .tface { position:absolute; inset:0; border-radius:12px; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden;
    background:#1c1036 center/cover no-repeat; box-shadow:0 20px 50px rgba(20,8,45,.6); }
  .tback { background-image:url(tarot/back.webp); }
  .tfront { transform:rotateY(180deg); }
  .tfront .tname { position:absolute; left:8%; right:8%; top:84%; bottom:4.5%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .tfront .th { font-size:25px; font-weight:bold; color:#ffe7b0; text-shadow:0 0 10px rgba(255,200,120,.55), 0 2px 3px rgba(0,0,0,.6); line-height:1.15; white-space:nowrap; }
  .tfront .en { font-size:12px; color:#d7c3ff; letter-spacing:1px; margin-top:2px; white-space:nowrap; }
  /* ไพ่ลักษมีที่ยังไม่มีรูป: หน้าไพ่ไล่สีชมพูทอง + ดอกบัว ชื่อไพ่อยู่กลางใบ */
  .tfront.lkfb { background:radial-gradient(circle at 50% 36%, rgba(255,246,214,.9), rgba(255,246,214,0) 40%), linear-gradient(160deg,#ffb3cf 0%,#f472a8 48%,#e9b44c 100%);
    box-shadow:inset 0 0 0 6px rgba(255,226,150,.95), inset 0 0 0 10px rgba(180,60,110,.5), 0 20px 50px rgba(20,8,45,.6); }
  .tfront.lkfb::before { content:'🪷'; position:absolute; left:0; right:0; top:20%; text-align:center; font-size:96px; filter:drop-shadow(0 4px 10px rgba(150,40,90,.45)); }
  .tfront.lkfb .tname { top:60%; bottom:10%; }
  .tfront.lkfb .th { font-size:24px !important; white-space:normal; color:#fff; text-shadow:0 0 10px rgba(255,180,90,.8), 0 2px 4px rgba(120,20,70,.8); }
  .tfront.lkfb .en { color:#fff3d6; text-shadow:0 1px 3px rgba(120,20,70,.8); }
  .tslot .mean { width:calc(260px * var(--s,1)); margin-top:calc(10px * var(--s,1)); font-size:calc(17px * var(--s,1) + 3px); line-height:1.35; color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.8); animation:tPop .5s both; }
  .tarot .extra { font-size:22px; margin-top:12px; text-shadow:0 2px 6px rgba(0,0,0,.7); animation:tPop .5s 1.7s both; }
  .tglow { position:absolute; left:50%; top:50%; width:520px; height:520px; transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,226,150,.55), rgba(255,226,150,0) 65%); animation:tGlow 1.6s 1.3s ease-out both; z-index:-1; }
  @keyframes tIn { from { transform:translateY(40vh) scale(.6) rotate(-12deg); opacity:0; } to { transform:translateY(-50%) scale(1) rotate(0); opacity:1; } }
  @keyframes tFlip { 0% { transform:rotateY(0) } 100% { transform:rotateY(180deg) } }
  @keyframes tGlow { from { opacity:0; transform:translate(-50%,-50%) scale(.3) } 40% { opacity:1 } to { opacity:0; transform:translate(-50%,-50%) scale(1.3) } }
  @keyframes tPop { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
  /* ---- ผีเสื้อเทพนิยาย: บินด้วย JS (ทางโค้งสุ่ม) ปีกกระพือด้วย CSS ---- */
  .bfly { position:fixed; left:0; top:0; pointer-events:none; will-change:transform; filter:drop-shadow(0 0 10px var(--g)) drop-shadow(0 0 22px var(--g)); }
  .bfly .wl, .bfly .wr { transform-box:fill-box; animation:flapL var(--fs,.32s) ease-in-out infinite alternate; }
  .bfly .wl { transform-origin:100% 50%; } .bfly .wr { transform-origin:0% 50%; animation-name:flapR; }
  @keyframes flapL { from { transform:scaleX(1) } to { transform:scaleX(.18) skewY(6deg) } }
  @keyframes flapR { from { transform:scaleX(1) } to { transform:scaleX(.18) skewY(-6deg) } }
  /* ผีเสื้อคริสตัลจากรูป AI: ปีกซ้าย/ขวา/ลำตัวแยกชั้น — ปีกพับเข้าหาลำตัว (กึ่งกลางรูป) */
  .bfly.img { filter:drop-shadow(0 0 6px var(--g)); }
  .bfi { position:relative; width:150px; height:101px; }
  .bfi img { position:absolute; inset:0; width:100%; height:100%; }
  .bfi .il { transform-origin:50% 50%; animation:iflap var(--fs,.3s) ease-in-out infinite alternate; }
  .bfi .ir { transform-origin:50% 50%; animation:iflap var(--fs,.3s) ease-in-out infinite alternate; }
  @keyframes iflap { from { transform:scaleX(1) } to { transform:scaleX(.22) scaleY(.96) } }
  .dust { position:fixed; left:0; top:0; width:6px; height:6px; border-radius:50%; pointer-events:none; background:radial-gradient(circle,#fff 0,var(--c) 45%,transparent 70%);
    animation:dust 1.4s ease-out forwards; }
  @keyframes dust { from { opacity:1; transform:translate(var(--x),var(--y)) scale(1) } to { opacity:0; transform:translate(var(--x),calc(var(--y) + 40px)) scale(.2) } }
  /* 🥊 ส่งนวม */
  .glv { position:fixed; top:50%; width:min(34vw,420px); pointer-events:none; filter:drop-shadow(0 14px 22px rgba(120,40,90,.35)); z-index:5; }
  .glv.r { right:0; animation:glvR .9s cubic-bezier(.3,1.5,.5,1) both; } .glv.l { left:0; animation:glvL .9s cubic-bezier(.3,1.5,.5,1) both; }
  .glv.out.r { animation:glvOutR .5s ease-in forwards; } .glv.out.l { animation:glvOutL .5s ease-in forwards; }
  @keyframes glvR { 0% { transform:translate(110%,-50%) rotate(25deg) } 35% { transform:translate(70%,-60%) rotate(35deg) scale(.9) } 70% { transform:translate(-62%,-50%) rotate(-8deg) scale(1.15) } 100% { transform:translate(-48%,-50%) rotate(0) scale(1) } }
  @keyframes glvL { 0% { transform:translate(-110%,-50%) scaleX(-1) rotate(25deg) } 35% { transform:translate(-70%,-60%) scaleX(-1) rotate(35deg) scale(.9) } 70% { transform:translate(62%,-50%) scaleX(-1) rotate(-8deg) scale(1.15) } 100% { transform:translate(48%,-50%) scaleX(-1) rotate(0) scale(1) } }
  @keyframes glvOutR { to { transform:translate(120%,-30%) rotate(30deg); opacity:0 } } @keyframes glvOutL { to { transform:translate(-120%,-30%) scaleX(-1) rotate(30deg); opacity:0 } }
  .pow { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:6; font:900 clamp(48px,9vw,120px)/1 'Mali','Itim',sans-serif; color:#fff;
    -webkit-text-stroke:5px #ff4f9a; paint-order:stroke; text-shadow:0 6px 0 #a23b7a, 0 0 30px rgba(255,200,240,.9); animation:pow .7s cubic-bezier(.2,1.8,.4,1) both, fade .4s .9s forwards; }
  @keyframes pow { from { transform:translate(-50%,-50%) scale(.2) rotate(-20deg) } to { transform:translate(-50%,-50%) scale(1) rotate(-8deg) } }
  .burst { position:fixed; left:50%; top:50%; width:10px; height:10px; pointer-events:none; z-index:4; }
  .burst i { position:absolute; left:0; top:0; font-size:34px; animation:burst .9s ease-out forwards; }
  @keyframes burst { from { transform:translate(-50%,-50%) scale(.3); opacity:1 } to { transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1) rotate(var(--r)); opacity:0 } }
  .shake { animation:shake .35s linear; } @keyframes shake { 20% { transform:translate(-10px,6px) } 40% { transform:translate(9px,-7px) } 60% { transform:translate(-7px,-4px) } 80% { transform:translate(5px,5px) } }
  .pfx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  .ftitle { position:fixed; left:0; right:0; top:12%; text-align:center; font-size:44px; color:#fff; pointer-events:none;
    text-shadow:0 0 12px rgba(255,180,240,.9), 0 2px 6px rgba(80,20,90,.7); animation:tPop .6s both, fade .8s var(--out,5s) forwards; }
  /* ป้ายไฟ (Action) — แบบเดียวกับวิดเจ็ตป้ายไฟ แต่โผล่ชั่วคราว */
  .sgn { position:fixed; left:50%; width:min(86vw,1400px); transform:translateX(-50%); pointer-events:none; --c:#ff4fa3;
    animation:sgnIn .5s cubic-bezier(.2,1.4,.4,1) both, fade .6s var(--out,5s) forwards; }
  .sgn.top { top:5vh } .sgn.center { top:42vh } .sgn.bottom { bottom:7vh }
  @keyframes sgnIn { from { opacity:0; transform:translateX(-50%) scale(.7) } to { opacity:1; transform:translateX(-50%) scale(1) } }
  .sgn .bd { position:relative; overflow:hidden; border-radius:18px; padding:14px 0; background:rgba(8,6,16,.88); box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .sgn .tr { white-space:nowrap; display:flex; justify-content:center; }
  .sgn .tx { display:inline-block; font:600 64px/1.15 'Kanit',sans-serif; color:var(--c); padding:0 .3em; }
  .sgn.scroll .tr { justify-content:flex-start; } .sgn.scroll .tx { padding-left:100%; animation:marq var(--dur,8s) linear infinite; }
  @keyframes marq { from { transform:translateX(0) } to { transform:translateX(-100%) } }
  .sgn.blink .tx { animation:sblink 1s steps(1) infinite; } @keyframes sblink { 50% { opacity:.15 } }
  .sgn.pulse .tx { animation:spulse 1.4s ease-in-out infinite; } @keyframes spulse { 50% { transform:scale(1.06) } }
  .sgn.led .tx { text-shadow:0 0 6px var(--c), 0 0 18px var(--c); letter-spacing:.06em; }
  .sgn.led .bd::after { content:''; position:absolute; inset:0; background:radial-gradient(circle, transparent 0 1.4px, rgba(8,6,16,.92) 2.2px) 0 0/5px 5px; }
  .sgn.neon .bd { background:rgba(10,4,20,.6); border:2px solid var(--c); box-shadow:0 0 18px var(--c), inset 0 0 18px var(--c); }
  .sgn.neon .tx { color:#fff; text-shadow:0 0 4px #fff, 0 0 10px var(--c), 0 0 22px var(--c), 0 0 42px var(--c); }
  .sgn.bulb .bd { background:linear-gradient(180deg,rgba(120,20,60,.92),rgba(60,10,40,.92)); border:6px solid #ffcf5c; }
  .sgn.bulb .tx { color:#fff6d6; text-shadow:0 2px 0 #b8541f, 0 0 14px #ffcf5c; }
  .sgn .bl { position:absolute; inset:4px; } .sgn .bl i { position:absolute; width:10px; height:10px; margin:-5px; border-radius:50%; background:#fff3b0; box-shadow:0 0 8px #ffd34d, 0 0 16px #ffb400; animation:sbulb 1s steps(1) infinite; }
  .sgn .bl i:nth-child(odd) { animation-delay:.5s } @keyframes sbulb { 50% { background:#8a6a2a; box-shadow:none } }
  .sgn.cute .bd { background:linear-gradient(135deg,rgba(255,111,170,.94),rgba(150,110,240,.94)); border:3px solid #fff; border-radius:999px; }
  .sgn.cute .tx { color:#fff; text-shadow:0 3px 0 rgba(120,40,120,.45); font-family:'Mali','Itim',sans-serif; }
</style>
</head>
<body>
  <div id="fx"></div>
  <button id="armBtn">🔊 เปิดเสียง FX (คลิกครั้งเดียว)</button>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/chestfx.js"></script>
  <script src="js/pkbanner.js"></script>
  <script src="js/prank.js"></script>
  <script>
  (function(){
    const fx=document.getElementById('fx'), armBtn=document.getElementById('armBtn');
    let audioArmed=false;
    armBtn.style.display='none';
    armBtn.addEventListener('click',()=>{ audioArmed=true; try{ window.VJLSfx&&VJLSfx.play('pop',0); }catch(e){} /* มือถือ/เบราว์เซอร์: ต้องแตะ 1 ครั้งถึงจะมีเสียง */ armBtn.textContent='✅ พร้อมเล่น FX'; armBtn.disabled=true; setTimeout(()=>armBtn.style.display='none',1200); });

    function clearLater(el,ms){ setTimeout(()=>{ el.style.animation='fade .4s forwards'; setTimeout(()=>el.remove(),400); }, ms||4000); }

    // แทน {user} ด้วยชื่อคนที่ทำให้เกิดเหตุการณ์
    // PK: {mvp} {mvpScore} {mvp2} {mvp3} = ผู้ช่วยฝั่งเราอันดับ 1–3 · {themMvp} = อันดับ 1 คู่แข่ง · {us} {them} = คะแนน PK
    // กล่องสมบัติ/ถุงม่วง: {diamonds} = เพชรในกล่อง · {people} = จำนวนคนที่ได้
    function fill(text,ev){ const u=ev&&ev.user?(ev.user.nickname||ev.user.uniqueId):''; const pk=(ev&&ev.pk)||{}, m=pk.mvp||[], n=(v)=>v==null?'':Number(v).toLocaleString('en-US'), c=(ev&&ev.chest)||{};
      const t=String(text||'').replace(/\{user\}/g,u).replace(/\{diamonds\}/g,n(c.diamonds||0)).replace(/\{people\}/g,n(c.people||0)); if(!ev||!ev.pk) return t;
      return t.replace(/\{mvpScore\}/g,m[0]?n(m[0].score):'').replace(/\{mvp\}/g,m[0]?m[0].name:(u||'ทุกคน')).replace(/\{mvp2\}/g,m[1]?m[1].name:'').replace(/\{mvp3\}/g,m[2]?m[2].name:'')
        .replace(/\{themMvp\}/g,pk.themMvp?pk.themMvp.name:'').replace(/\{us\}/g,n(pk.us)).replace(/\{them\}/g,n(pk.them)); }
    function showText(text,dur){ const t=document.createElement('div'); t.className='text'; t.textContent=text; fx.appendChild(t); clearLater(t,dur); }

    // ---- ไพ่ทาโร่ครบสำรับ 78 ใบ (รูปใน /overlay/tarot/) — [ไฟล์, เลข, ชื่อไทย, English, คำทำนาย] ----
    const TAROT=[
      ['m00','0','คนโง่','The Fool','การเริ่มต้นใหม่ กล้าลองสิ่งใหม่ โอกาสดีกำลังมา'],
      ['m01','I','นักมายากล','The Magician','พลังสร้างสรรค์เต็มเปี่ยม ลงมือทำอะไรก็สำเร็จ'],
      ['m02','II','นักบวชหญิง','The High Priestess','สัญชาตญาณแม่นยำ ฟังเสียงหัวใจตัวเอง'],
      ['m03','III','จักรพรรดินี','The Empress','ความอุดมสมบูรณ์ ความรักและโชคลาภงอกงาม'],
      ['m04','IV','จักรพรรดิ','The Emperor','มั่นคง เป็นผู้นำ คุมเกมได้ทุกสถานการณ์'],
      ['m05','V','พระสังฆราช','The Hierophant','จะได้คำแนะนำดี ๆ จากคนที่หวังดี'],
      ['m06','VI','คู่รัก','The Lovers','ความรักหวานซึ้ง การเลือกที่ใช่สำหรับคุณ'],
      ['m07','VII','รถศึก','The Chariot','ชัยชนะอยู่ไม่ไกล มุ่งหน้าต่อไปอย่าหยุด'],
      ['m08','VIII','พลัง','Strength','เข้มแข็งจากข้างใน ใจเย็นแต่หนักแน่น'],
      ['m09','IX','ฤๅษี','The Hermit','ช่วงเวลาทบทวน คำตอบอยู่ในตัวคุณเอง'],
      ['m10','X','กงล้อแห่งโชคชะตา','Wheel of Fortune','โชคหมุนมาหา จังหวะชีวิตกำลังดีขึ้น'],
      ['m11','XI','ความยุติธรรม','Justice','สิ่งดีที่ทำไว้ กำลังจะได้รับผลตอบแทน'],
      ['m12','XII','คนแขวน','The Hanged Man','ลองมองมุมใหม่ แล้วจะเห็นทางออก'],
      ['m13','XIII','การเปลี่ยนแปลง','Death','ปิดฉากเก่า เปิดบทใหม่ที่ดีกว่าเดิม'],
      ['m14','XIV','ความพอดี','Temperance','ชีวิตสมดุล ทุกอย่างลงตัวพอดี'],
      ['m15','XV','ปีศาจ','The Devil','ระวังสิ่งล่อใจ แล้วคุณจะเป็นอิสระ'],
      ['m16','XVI','หอคอย','The Tower','เรื่องเซอร์ไพรส์ เปิดทางสู่สิ่งใหม่'],
      ['m17','XVII','ดวงดาว','The Star','ความหวังเป็นจริง สิ่งที่ขอกำลังจะสมหวัง'],
      ['m18','XVIII','ดวงจันทร์','The Moon','ฝันดี จินตนาการพาไปไกล ใช้ใจนำทาง'],
      ['m19','XIX','ดวงอาทิตย์','The Sun','ความสุข ความสำเร็จ พลังบวกเต็มร้อย'],
      ['m20','XX','การพิพากษา','Judgement','การตื่นรู้ และโอกาสครั้งใหม่'],
      ['m21','XXI','โลก','The World','สำเร็จสมบูรณ์ ครบทุกด้าน'],
      ['w-01','','เอซไม้เท้า','Ace of Wands','ไฟแห่งแรงบันดาลใจ เริ่มโปรเจกต์ใหม่ได้เลย'],
      ['w-02','','2 ไม้เท้า','Two of Wands','วางแผนไกล โอกาสใหม่รออยู่ข้างหน้า'],
      ['w-03','','3 ไม้เท้า','Three of Wands','สิ่งที่ลงมือทำกำลังเริ่มเห็นผล'],
      ['w-04','','4 ไม้เท้า','Four of Wands','ฉลองความสำเร็จ บ้านอบอุ่นมีความสุข'],

    function nextTarot(){

      if(a.topic==='daily'){ // ไพ่ประจำวัน: คนเดิม วันเดิม (เวลาไทย) = ไพ่ชุดเดิม
        const day=new Date(Date.now()+7*3600e3).toISOString().slice(0,10), who0=ev&&ev.user?(ev.user.uniqueId||ev.user.nickname||''):'';
        let h=2166136261; for(const ch of who0+'|'+day){ h^=ch.codePointAt(0); h=Math.imul(h,16777619)>>>0; }
        const rnd=()=>{ h=(Math.imul(h^(h>>>15),2246822507)+0x6D2B79F5)>>>0; return h/4294967296; };
        const all=deckOf(deckName).slice(); for(let i=all.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
        deck=all.slice(0,n);
      } else deck=deckOf(deckName).slice().sort(()=>Math.random()-0.5).slice(0,n); // ไม่ซ้ำกันในชุดเดียว
      const u=ev&&ev.user?(ev.user.nickname||ev.user.uniqueId):'';

      // โหลดรูปไพ่ที่สุ่มได้ให้เสร็จก่อนค่อยโชว์ (กันไพ่พลิกแล้วเจอกรอบว่าง) — รอไม่เกิน 2.5 วิ

    // ---- ผีเสื้อเทพนิยาย ----
    const WINGS=[['#ffd1f0','#ff7ac8','#b06bff','rgba(255,140,220,.8)'],['#d6f3ff','#6fc3ff','#7a6bff','rgba(120,190,255,.8)'],['#fff1c4','#ffc14d','#ff7aa8','rgba(255,200,110,.8)'],['#e6dcff','#b39bff','#ff8ad8','rgba(190,160,255,.8)'],['#d8ffef','#5fe0b6','#6bb6ff','rgba(110,230,190,.8)']];
    let bfId=0;

    function butterflies(a,ev){

          const TINT={pink:0,blue:190,purple:280,mint:120,gold:330}; const hue=a.tint==='rainbow'?[0,190,280,120,330][i%5]:(TINT[a.tint]||0); if(hue) el.querySelector('.bfi').style.filter=`hue-rotate(${hue}deg) saturate(1.15)`; }

    // ---- เอฟเฟกต์อนุภาคเต็มจอ 10 แบบ (ซากุระ หัวใจ เหรียญ ดาว หิมะ ฟองสบู่ ลูกโป่ง กลีบกุหลาบ หิ่งห้อย คอนเฟตติ) ----
    // ใช้ canvas เดียวร่วมกันทุกเอฟเฟกต์ · รูปอนุภาควาดล่วงหน้าเป็น sprite ครั้งเดียว → แต่ละเฟรมแค่ drawImage (GPU เร็ว ลื่นใน OBS)

    const PAL={ pink:['#ffe0ef','#ff9fcd','#ff6fb1','#e84d97'], blue:['#e0f2ff','#9fd4ff','#62b1ff','#3d8bf0'], purple:['#efe4ff','#c9adff','#a283ff','#7d5ce6'],

    const AIS={}, AI_SIZE={petal:44,heart:68,coin:58,star:64,flake:58,bubble:92,balloon:150,rose:50}, HUE={pink:330,purple:275,blue:210,mint:160,gold:45};

    // เอฟเฟกต์วิดีโอเต็มจอ (WebP เคลื่อนไหวพื้นใส แนวนอน 16:9) — fx/v-<ชื่อ>.webp

    // ป้ายไฟชั่วคราว: LED / นีออน / ไฟหลอด / พาสเทล · วิ่ง / อยู่กับที่ / กะพริบ / เต้น

      const dur=Math.max(2000,a.durationMs||6000), st=['led','neon','bulb','cute','pixel','y2k','glass','surreal','boho','victorian','graffiti','future','mwhite','mblack','mline','mpill'].includes(a.signStyle)?a.signStyle:'led';
      const md=['scroll','static','blink','pulse'].includes(a.signMode)?a.signMode:'scroll', pos=['top','center','bottom'].includes(a.signPos)?a.signPos:'top';

      if(/^#[0-9a-f]{3,8}$/i.test(a.color||'')) el.style.setProperty('--c',a.color);
      el.style.setProperty('--out',(dur/1000-.6)+'s');
      el.innerHTML='<div class="bd sb"><div class="bl"></div><div class="tr"><span class="tx stx"></span></div></div>';
      const tx=el.querySelector('.tx'); tx.textContent=fill(a.text||'✨ ขอบคุณ {user} ✨',ev);
      document.body.appendChild(el);
      if(md==='scroll') requestAnimationFrame(()=>{ el.style.setProperty('--dur',Math.max(3,Math.min(dur/1000,tx.scrollWidth/260)).toFixed(1)+'s'); });
      // ป้ายไม่วิ่ง (นิ่ง/กะพริบ/เต้น): ข้อความยาวล้นจอ → ย่อตัวอักษรลงจนพอดี 94% ของจอ (เดิมโดนตัดหัวท้าย)
      if(md!=='scroll') requestAnimationFrame(()=>{ const tr=el.querySelector('.tr'); const over=()=>tx.scrollWidth>tr.clientWidth+2||el.getBoundingClientRect().width>innerWidth*.96;
        let fs=parseFloat(getComputedStyle(tx).fontSize)||40; const f0=fs;

      if(st==='bulb') requestAnimationFrame(()=>{ const bl=el.querySelector('.bl'), r=bl.getBoundingClientRect(), nx=Math.max(2,Math.floor(r.width/26)), ny=Math.max(1,Math.floor(r.height/26));

        for(let k=0;k<=nx;k++){ add(k*r.width/nx,0); add(k*r.width/nx,r.height); } for(let k=1;k<ny;k++){ add(0,k*r.height/ny); add(r.width,k*r.height/ny); } });
      setTimeout(()=>el.remove(),dur+100);
    }

      else if(a.type==='image' && a.url){ const img=document.createElement('img'); img.src=a.url; img.className='media'; fx.appendChild(img); clearLater(img,dur); }
      else if(a.type==='video' && a.url){ const v=document.createElement('video'); v.src=a.url; v.autoplay=true; v.playsInline=true; v.className='media'; fx.appendChild(v);
        v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); if(!audioArmed) armBtn.style.display='block'; }); v.onended=()=>v.remove(); clearLater(v,dur); }
      if(text) showText(text,dur);
    }

    // PK: วิดีโอการ์ด (WebP เคลื่อนไหวพื้นใส) เล่นกลางจอ — ใช้กับกฎ PK อัตโนมัติ ไม่ต้องตั้งเพิ่ม
    const PK_VIDEO={ glove:4600, critical:4800, extra:4800, smoke:5000, effect:5000, wave:5000, top2:4800, top3:4800, start:5000, win:5000, lose:5000, draw:5000 };
    const PK_SQUARE={ top2:1, top3:1 }, PK_CAP={ top2:'🥈 เก้าอี้ที่ 2 X2', top3:'🥉 เก้าอี้ที่ 3 X2' };
    const pkStyle=document.createElement('style'); pkStyle.textContent=".pkfx{position:fixed;left:50%;top:50%;height:min(92vh,92vw*1.78);transform:translate(-50%,-50%);pointer-events:none;z-index:50}.pkcap{position:fixed;left:50%;top:calc(50% + min(27vh,27vw));transform:translateX(-50%);font:900 min(9vh,9vw)/1 Kanit,sans-serif;color:#fff;-webkit-text-stroke:min(1.2vh,1.2vw) #c0397a;paint-order:stroke fill;white-space:nowrap;z-index:51;pointer-events:none}"; document.head.appendChild(pkStyle);
    const pkOk={}; // ไฟล์วิดีโอไหนยังไม่มี (เช่น แพ้) → ใช้ action ของกฎตามปกติ
    for(const k in PK_VIDEO){ const im=new Image(); im.onerror=()=>{ pkOk[k]=false; }; im.src='pk/'+k+'.webp'+(window.VJL_VERSION?'?v='+window.VJL_VERSION:''); } // โหลดล่วงหน้า
    let pkLast=0;
    function playPk(card){
      if(!PK_VIDEO[card] || Date.now()-pkLast<1500) return; pkLast=Date.now(); // หลายกฎเรื่องเดียวกัน → เล่นครั้งเดียว
      const el=document.createElement('img'); el.className='pkfx'; el.alt=''; el.src='pk/'+card+'.webp?t='+Date.now();
      if(PK_SQUARE[card]) el.style.height='min(58vh,58vw)';
      document.body.appendChild(el); setTimeout(()=>el.remove(), PK_VIDEO[card]);
      if(PK_CAP[card]){ const c=document.createElement('div'); c.className='pkcap'; c.textContent=PK_CAP[card]; document.body.appendChild(c); setTimeout(()=>c.remove(), PK_VIDEO[card]-300); }
    }
    if(Overlay.param('pktest','')) setInterval(()=>playPk(Overlay.param('pktest','')), 5500); // ?pktest=glove

    // ลิงก์แยกหมวด: ?only=tarot (ลิงก์เฉพาะหมวด) · ลิงก์หลักข้ามหมวดที่วีเจตั้ง "แยกจอ" ไว้ (ตั้งค่า fx: split=fx,tarot)
    // หมวดตามชนิด action: เอฟเฟกต์เต็มจอ=fx · ไพ่=tarot · ป้ายไฟ/ข้อความ=thanks · นวม/สัตว์น่ารัก=fun · เสียง/รูป/วิดีโอ=ลิงก์หลักเสมอ
    const CAT=(a)=>{ const t=a&&a.type; return t==='effect'?((a.effect==='animal'||a.effect==='prank')?'fun':'fx'):t==='tarot'?'tarot':(t==='sign'||t==='text')?'thanks':t==='glove'?'fun':'main'; }; // สัตว์น่ารัก/แกล้งวีเจ = หมวดสนุก ๆ
    const ONLY=(new URLSearchParams(location.search).get('only')||'').split(',').filter(Boolean);
    const SPLIT=ONLY.length?[]:String(Overlay.param('split','')).split(',').filter(Boolean);
    const mine=(a)=>{ const c=CAT(a); return ONLY.length?ONLY.includes(c):!SPLIT.includes(c); };
    // รับ action จากเซิร์ฟเวอร์ (Actions & Events engine)
    Overlay.on('action',(fire)=>{
      const pk=fire.event&&fire.event.type==='pk'&&fire.event.pk;
      // ลิงก์แยก PK (?only=pk): ทุกอย่างของ PK (วิดีโอ + กฎ PK) เล่นที่ลิงก์นั้น · ลิงก์หลักข้าม PK ถ้าตั้ง split=pk
      if(pk){ const pkMine=ONLY.length?ONLY.includes('pk'):!SPLIT.includes('pk'); if(!pkMine) return; }
      else if(!mine(fire.action)) return; // หมวดนี้เล่นที่ลิงก์อื่น
      // เริ่ม PK / จบ (ชนะ แพ้ เสมอ) → วิดีโอประจำเหตุการณ์ (ใช้กติกาเดียวกับการ์ด: วิดีโออย่างเดียว เสียงยังเล่นได้)
      const pkVid=pk&&(pk.kind==='start'?'start':pk.kind==='end'?pk.result:'');
      // เริ่ม/จบ PK: วิดีโอประจำเหตุการณ์ก่อน (เล่นครั้งเดียวแม้มีหลายกฎ) แล้วตามด้วยเทมเพลตที่วีเจเลือก (ป้ายไฟ MVP / คอนเฟตติ / ฝนดาว ...) ตอนวิดีโอจบ
      //   เดิม return ทิ้ง → ทุกเทมเพลตชนะ/แพ้/จบ ออกจอเป็นวิดีโอเดียวกันหมด
      let pkDelay=0;
      const ownBanner=fire.action.type==='effect'&&fire.action.effect==='pkbanner'; // ป้าย GPT = ภาพหลักของเหตุการณ์นี้แล้ว → ไม่เล่นวิดีโอ PK ซ้อน
      if(!ownBanner&&pkVid&&PK_VIDEO[pkVid]&&pkOk[pkVid]!==false){ playPk(pkVid); if(fire.action.type!=='sound') pkDelay=Math.max(0,PK_VIDEO[pkVid]-700); }
      if(!ownBanner&&pk&&pk.kind==='card'&&pk.card&&PK_VIDEO[pk.card]){ // การ์ด PK ที่มีวิดีโอ → เล่นวิดีโออย่างเดียว
        playPk(pk.card);
        // ไม่เอาป้ายไฟ/ข้อความ/นวมพุ่งของกฎมาซ้อนวิดีโอ · กฎที่เป็นเสียงยังเล่นได้ (ไม่บังจอ)
        if(fire.action.type!=='sound') return;
      }
      // เสียงเล่นที่แดชบอร์ด (ลำโพง) แล้ว → จอนี้โชว์แค่ข้อความ ไม่เล่นเสียงซ้ำ
      if(fire.elsewhere && fire.action.type==='sound'){ const t=fill(fire.action.text,fire.event); if(t) showText(t,fire.action.durationMs||5000); return; }
      // ส่งคอมโบ (เช่น กุหลาบ 10 ดอก) → เล่นซ้ำตามจำนวน ไม่เกินที่วีเจตั้ง (ไพ่ทาโร่ = 1 เสมอ)
      const a=fire.action, n=a.type==='tarot'?1:Math.max(1,Math.min(20,fire.times||1));
      const gap=a.type==='sound'?700:a.type==='effect'?1400:(a.durationMs||5000)+300;
      for(let i=0;i<n;i++) setTimeout(()=>play(a,fire.event), pkDelay+i*gap);
    });
    if(Overlay.param('debug','0')==='1') window.__play=play;

    // demo fallback — จำลองกฎ "ได้ Galaxy -> โชว์ข้อความ"
    if(!Overlay.connected){
      const samples=[{type:'text',text:'🎉 ขอบคุณสำหรับ Galaxy!'},{type:'tarot',cards:3},{type:'effect',effect:'butterflies',text:'🦋 {user} เสกผีเสื้อ!'},{type:'effect',effect:'sakura',text:'🌸 {user} โปรยซากุระ'},{type:'effect',effect:'confetti',text:'🎊 ขอบคุณ {user}!'},{type:'sign',signStyle:'neon',signMode:'pulse',text:'💗 ขอบคุณ {user} ที่ติดตาม',durationMs:4000},{type:'glove',count:2,text:'🥊 {user} ส่งนวม!'}];
      const ok=samples.filter(mine); if(ok.length) setInterval(()=>play(ok[Math.floor(Math.random()*ok.length)],{user:{nickname:'mimi'}}), 5000);
    }
  })();
  </script>
