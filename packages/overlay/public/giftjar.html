<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gift Jar Overlay</title>
  <link rel="icon" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Prompt:wght@400;600&family=Mitr:wght@400;600&family=Sriracha&family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    html,body{margin:0;height:100%;background:transparent;overflow:hidden}
    body{font-family:var(--font,'Kanit'),sans-serif;color:#fff}
    #fx{position:fixed;inset:0}
    .shadow{text-shadow:0 2px 4px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.8)}
    #alert{position:fixed;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;
      background:rgba(20,10,30,.55);backdrop-filter:blur(4px);opacity:0;transform:translate(-50%,10px) scale(.7);transition:opacity .3s,transform .45s cubic-bezier(.2,1.6,.4,1);white-space:nowrap;pointer-events:none}
    #alert.show{opacity:1;transform:translate(-50%,0) scale(1)}
    #total.bump,#board.bump{animation:punch .4s cubic-bezier(.2,1.6,.4,1)}
    @keyframes punch{30%{scale:1.18}}
    #alert img.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#b9a6f2}
    #alert img.gift{width:36px;height:36px;object-fit:contain}
    #alert .nm{font-weight:600;font-size:calc(var(--fs) * .36px)}
    #alert .sub{font-size:calc(var(--fs) * .3px);opacity:.9}
    #board{position:fixed;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
    #board .row{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:rgba(20,10,30,.45);font-size:calc(var(--fs) * .3px);white-space:nowrap}
    #board .rk{width:22px;text-align:center;font-weight:600}
    #board img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#b9a6f2}
    #board.solo .row{font-size:calc(var(--fs) * .42px);padding:6px 18px 6px 6px;gap:10px;border:1.5px solid rgba(255,215,106,.7)}
    #board.solo img{width:44px;height:44px}
    #board .c{margin-left:auto;padding-left:10px;color:#ffd76a;font-weight:600}
    #full{position:fixed;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity .4s,transform .4s;font-weight:600;font-size:calc(var(--fs) * .9px);color:#fff;pointer-events:none;white-space:nowrap}
    #full.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    #total{position:fixed;transform:translateX(-50%);font-weight:600;font-size:calc(var(--fs) * .5px);color:#ffd76a;pointer-events:none}
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="alert" class="shadow"><img class="ava" alt="" /><div><div class="nm"></div><div class="sub"></div></div><img class="gift" alt="" /></div>
  <div id="board" class="shadow"></div>
  <div id="total" class="shadow"></div>
  <div id="full" class="shadow"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script src="js/juice.js"></script>
  <script>
  /*
   * โหลแก้ว (Gift Jar) — ของขวัญจริงจาก TikTok ตกลงโหลแก้วและกองซ้อนกันด้วยฟิสิกส์
   * พารามิเตอร์ URL:
   *   scale=1 giftScale=1 x=0 y=0          ขนาด/ตำแหน่งโหล (x,y = เลื่อนเป็น px จากกึ่งกลางล่าง)
   *   alert=1 alertSec=5                    แจ้งเตือนชื่อผู้ส่ง
   *   board=1 top=1 boardFormat=full|name   ผู้ให้สูงสุดใต้โหล (top = จำนวนคน, board=0 ซ่อน; full = รูป+ชื่อ+เหรียญ)
   *   total=0                               แสดงยอดเหรียญรวมเหนือโหล
   *   minCoins=0                            รับเฉพาะของขวัญมูลค่า >= นี้
   *   shape=jar|bowl|mason|car|globe cloth=#e0452b body=#bfe9e6   ทรง: jar = คอแคบ, bowl = กลมปากกว้าง, mason = ฝาผ้า (สีผ้า), car = รถพาสเทล (สีรถ)
   *   full=spill|fade|reset fullText=...    โหลเต็มแล้ว: spill = ล้นออกกองรอบโหล (ไม่หาย, ค่าเริ่มต้น)
   *                                         fade = ชิ้นเก่าสุดจางออก, reset = ฉลองแล้วเทโหลเริ่มใหม่
   *   font=Kanit fontSize=50                ฟอนต์ (Kanit/Prompt/Mitr/Sriracha/Chakra Petch) และขนาด
   *   reset=1                               ล้างโหลที่จำไว้
   */
  (function () {
    const P = (k, d) => Overlay.param(k, d);
    const num = (k, d) => { const v = parseFloat(P(k, d)); return Number.isFinite(v) ? v : d; };
    const SCALE = num('scale', 1), GIFT_SCALE = num('giftScale', 1), OX = num('x', 0), OY = num('y', 0);
    const SHOW_ALERT = P('alert', '1') !== '0', ALERT_MS = num('alertSec', 5) * 1000;
    const SHOW_BOARD = P('board', '1') !== '0', TOP = Math.max(1, Math.min(10, num('top', 1))), BOARD_FULL = P('boardFormat', 'full') !== 'name';
    const SHOW_TOTAL = P('total', '0') === '1', MIN_COINS = num('minCoins', 0);
    let FULL_MODE = P('full', 'spill'); const FULL_TEXT = P('fullText', 'โหลเต็มแล้ว! 🎉');
    document.documentElement.style.setProperty('--font', `'${P('font', 'Kanit')}'`);
    document.documentElement.style.setProperty('--fs', String(num('fontSize', 50)));

    const canvas = document.getElementById('fx'), ctx = canvas.getContext('2d');
    let W = 0, H = 0; const DPR = Math.min(2, devicePixelRatio || 1);
    function resize() { W = innerWidth; H = innerHeight; canvas.width = W * DPR; canvas.height = H * DPR; canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; layoutUi(); }

    // ---- ทรงโหล (หน่วย local, จุด 0,0 = กึ่งกลางก้นโหล, y ติดลบ = ขึ้นด้านบน) ----
    // hw(y) = ครึ่งความกว้างด้านในที่ความสูง y · openY = ระดับปากโหล · fullY = ถึงระดับนี้ถือว่าเต็ม
    const SHAPES = {
      jar: { // โหลแก้วคอแคบ (ค่าเริ่มต้น)
        hw: (y) => y > -40 ? 90 + Math.sqrt(Math.max(0, 1600 - (y + 40) ** 2)) : y > -260 ? 130 : y > -300 ? 92 + 38 * (0.5 + 0.5 * Math.cos(Math.PI * (-260 - y) / 40)) : 92,
        openY: -338, openHW: 92, rimHW: 102, topY: -362, fullY: -290, maxHW: 130,
      },
      bowl: { // โหลทรงกลมป่อง ปากกว้าง (โหลปลา)
        hw: (y) => 170 * Math.sqrt(Math.max(0, 1 - ((y + 140) / 150) ** 2)),
        openY: -262, openHW: 101, rimHW: 116, topY: -278, fullY: -235, maxHW: 170,
      },
      mason: { // โหลฝาผ้าผูกเชือก
        hw: (y) => y > -30 ? 95 + Math.sqrt(Math.max(0, 900 - (y + 30) ** 2)) : y > -250 ? 125 : y > -280 ? 105 + 20 * (0.5 + 0.5 * Math.cos(Math.PI * (-250 - y) / 30)) : 105,
        openY: -292, openHW: 105, rimHW: 138, topY: -342, fullY: -252, maxHW: 125, closed: true, cloth: P('cloth', '#e0452b'),
      },
      globe: { // ลูกแก้วหิมะ: ทรงกลมบนฐาน (ปิดสนิท — เต็มแล้วชิ้นเก่าจางออก)
        hw: (y) => Math.sqrt(Math.max(0, 170 * 170 - (y + 250) ** 2)),
        openY: -392, openHW: 90, rimHW: 120, topY: -420, fullY: -330, maxHW: 170, closed: true, floor: -112, globe: true, fullMode: 'fade',
      },
      car: { // รถพาสเทล (มุมหลัง) — ของขวัญกองบนหลังคาแล้วไหลลงข้างรถ (ตัวรถทึบ ไม่มีของข้างใน)
        hw: () => 152, openY: -282, openHW: 100, rimHW: 112, topY: -300, fullY: -300, maxHW: 152, solid: true,
        // ตัวรถเป็นกล่องสี่เหลี่ยมมุมมน 2 ชั้น + ราวหลังคา (กันของตก)
        rects: [[-152, 152, -172, 0], [-112, 112, -268, -172], [-112, -104, -284, -268], [104, 112, -284, -268]],
        body: P('body', '#bfe9e6'),
      },
    };
    const SH = SHAPES[P('shape', 'jar')] || SHAPES.jar;
    if (SH.fullMode) FULL_MODE = SH.fullMode;
    // เว้นที่ใต้โหลไว้ให้ป้ายผู้ให้สูงสุด
    const BOARD_SPACE = SHOW_BOARD ? (TOP === 1 ? 70 : TOP * 46 + 14) : 0;
    const origin = () => ({ x: W / 2 + OX, y: H - 24 * SCALE - BOARD_SPACE + OY });
    const S = () => SCALE * Math.min(1.6, Math.max(0.5, H / 720));

    function jarPath() { // เส้นขอบโหลจากโปรไฟล์ (ปากซ้าย → ก้น → ปากขวา)
      ctx.beginPath();
      const N = 48, yAt = (i) => SH.openY + (-SH.openY) * i / N;
      for (let i = 0; i <= N; i++) ctx.lineTo(-SH.hw(Math.min(-0.5, yAt(i))), yAt(i));
      for (let i = N; i >= 0; i--) ctx.lineTo(SH.hw(Math.min(-0.5, yAt(i))), yAt(i));
    }
    function drawJarBack() {
      if (SH.solid) return drawCar();
      if (SH.globe) return drawGlobeBack();
      jarPath(); ctx.closePath();
      const g = ctx.createLinearGradient(-SH.maxHW, 0, SH.maxHW, 0);
      g.addColorStop(0, 'rgba(210,235,255,.22)'); g.addColorStop(.5, 'rgba(255,255,255,.06)'); g.addColorStop(1, 'rgba(210,235,255,.2)');
      ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, -6, SH.hw(-6) - 14, 10, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fill();
    }
    function drawJarFront() {
      if (SH.solid) return;
      if (SH.globe) return drawGlobeFront();
      jarPath();
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(150,190,230,.6)'; ctx.stroke();
      // ไฮไลต์กระจก (ตามความโค้งของโหล)
      ctx.lineCap = 'round';
      const hl = (side, off, y0, y1, w, a) => {
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) { const y = y0 + (y1 - y0) * i / 12; ctx.lineTo(side * (SH.hw(y) - off), y); }
        ctx.lineWidth = w; ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.stroke();
      };
      hl(-1, 20, SH.fullY + 40, -60, 10, .35);
      hl(-1, 40, SH.fullY + 50, SH.fullY + 120, 5, .25);
      hl(1, 18, SH.fullY + 60, -90, 4, .2);
      if (SH.cloth) return drawCloth();
      if (SH === SHAPES.bowl) { // ขอบปากม้วน
        ctx.beginPath(); ctx.ellipse(0, SH.openY - 4, SH.rimHW, 13, 0, 0, Math.PI * 2);
        ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke();
        ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(150,190,230,.7)'; ctx.stroke();
        return;
      }
      // ขอบปากโหล (เกลียว)
      ctx.beginPath(); ctx.roundRect(-SH.rimHW, SH.topY, SH.rimHW * 2, SH.openY - SH.topY + 4, 8);
      const lg = ctx.createLinearGradient(0, SH.topY, 0, SH.openY);
      lg.addColorStop(0, 'rgba(255,255,255,.55)'); lg.addColorStop(1, 'rgba(200,225,250,.3)');
      ctx.fillStyle = lg; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
      for (let i = 1; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(-SH.rimHW + 4, SH.topY + i * 8); ctx.lineTo(SH.rimHW - 4, SH.topY + i * 8); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.stroke(); }
    }
    // ---- ลูกแก้วหิมะ ----
    const GC = { x: 0, y: -250, r: 170 };
    const flakes = Array.from({ length: 70 }, () => ({ x: (Math.random() - .5) * 300, y: -400 + Math.random() * 290, r: 1.5 + Math.random() * 2.5, sp: .2 + Math.random() * .5, ph: Math.random() * 6.28 }));
    function drawGlobeBack() {
      const { x, y, r } = GC, rr = (a, b, w, h, k) => { ctx.beginPath(); ctx.roundRect(a, b, w, h, k); };
      // เงา + ฐาน (ครีมลายนูน)
      ctx.beginPath(); ctx.ellipse(0, -2, 175, 14, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(90,70,140,.25)'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(-150, -8); ctx.bezierCurveTo(-170, -50, -150, -96, -128, -112); ctx.lineTo(128, -112); ctx.bezierCurveTo(150, -96, 170, -50, 150, -8); ctx.closePath();
      let g = ctx.createLinearGradient(-160, 0, 160, 0); g.addColorStop(0, '#d9c7a4'); g.addColorStop(.35, '#fff8ea'); g.addColorStop(.6, '#f3e6cc'); g.addColorStop(1, '#bfa67c');
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(120,95,60,.35)'; ctx.stroke();
      rr(-70, -88, 140, 46, 18); ctx.fillStyle = '#fffaf0'; ctx.fill(); ctx.strokeStyle = 'rgba(180,150,100,.6)'; ctx.stroke();
      ctx.font = '600 22px Kanit, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#c89a5a'; ctx.fillText('VJLiveKit', 0, -64);
      ctx.font = '22px serif'; ctx.fillText('🎀', -105, -60); ctx.fillText('🎀', 105, -60);
      // ข้างในลูกแก้ว: ฟ้าอุ่น + พื้นหิมะ + บ้าน + ต้นสน
      ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
      g = ctx.createRadialGradient(0, y - 40, 20, 0, y, r); g.addColorStop(0, 'rgba(255,233,190,.55)'); g.addColorStop(1, 'rgba(160,120,90,.35)');
      ctx.fillStyle = g; ctx.fillRect(-r, y - r, r * 2, r * 2);
      ctx.beginPath(); ctx.ellipse(0, -112, 160, 22, 0, 0, Math.PI * 2); ctx.fillStyle = '#fbfaff'; ctx.fill();
      // ต้นสน
      for (const [tx, ty, s] of [[-80, -118, 1], [-50, -114, .7]]) {
        for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(tx, ty - (90 - k * 22) * s); ctx.lineTo(tx - (34 + k * 8) * s, ty - (40 - k * 22) * s); ctx.lineTo(tx + (34 + k * 8) * s, ty - (40 - k * 22) * s); ctx.closePath(); ctx.fillStyle = k % 2 ? '#7cc9a6' : '#5fb48f'; ctx.fill(); }
        for (const [dx, dy, c] of [[-10, -55, '#ffb5c8'], [12, -40, '#ffd76a'], [-4, -75, '#a9d8ff']]) { ctx.beginPath(); ctx.arc(tx + dx * s, ty + dy * s, 4 * s, 0, 6.29); ctx.fillStyle = c; ctx.fill(); }
      }
      // บ้าน
      rr(10, -190, 90, 74, 6); ctx.fillStyle = '#fff3e0'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, -186); ctx.lineTo(55, -232); ctx.lineTo(110, -186); ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.strokeStyle = 'rgba(150,130,180,.4)'; ctx.stroke();
      rr(44, -150, 22, 34, 10); ctx.fillStyle = '#c8a27a'; ctx.fill();
      for (const wx of [20, 76]) { rr(wx, -176, 16, 18, 4); ctx.fillStyle = '#ffd76a'; ctx.fill(); }
      ctx.restore();
    }
    function drawGlobeFront() {
      const { x, y, r } = GC, now = performance.now() / 1000;
      ctx.save(); ctx.beginPath(); ctx.arc(x, y, r - 2, 0, Math.PI * 2); ctx.clip();
      for (const f of flakes) { // หิมะลอย
        f.y += f.sp; if (f.y > -110) { f.y = -410; f.x = (Math.random() - .5) * 300; }
        ctx.beginPath(); ctx.arc(f.x + Math.sin(now + f.ph) * 6, f.y, f.r, 0, 6.29); ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
      }
      ctx.restore();
      // กระจก: Fresnel ขอบ + ไฮไลต์
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(x, y, r * .7, x, y, r); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(230,240,255,.45)');
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x, y, r - 22, Math.PI * 1.08, Math.PI * 1.42); ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, r - 22, Math.PI * 1.5, Math.PI * 1.56); ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, r - 14, Math.PI * .1, Math.PI * .3); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.stroke();
    }
    function drawCar() { // รถพาสเทลมุมหลัง (แสงซ้ายบน · เงาอมม่วง)
      const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
      ctx.beginPath(); ctx.ellipse(0, -2, 190, 14, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(90,70,140,.25)'; ctx.fill(); // เงาพื้น
      ctx.fillStyle = '#3b3550'; rr(-142, -46, 44, 46, 12); ctx.fill(); rr(98, -46, 44, 46, 12); ctx.fill(); // ล้อ
      // ห้องโดยสาร
      rr(-116, -274, 232, 112, 38);
      let g = ctx.createLinearGradient(0, -274, 0, -162); g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#f6e7d0');
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(120,95,150,.35)'; ctx.stroke();
      rr(-82, -252, 164, 62, 20); // กระจกหลัง
      g = ctx.createLinearGradient(-82, -252, 82, -190); g.addColorStop(0, '#6f86b8'); g.addColorStop(1, '#3e4f80');
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-60, -244); ctx.lineTo(-30, -198); ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.stroke();
      // ตัวรถ
      rr(-156, -182, 312, 150, 44);
      g = ctx.createLinearGradient(0, -182, 0, -32); g.addColorStop(0, '#ffffff'); g.addColorStop(.25, SH.body); g.addColorStop(1, '#8fc9cf');
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(90,110,150,.35)'; ctx.stroke();
      rr(-156, -128, 312, 14, 7); ctx.fillStyle = '#ffb5c8'; ctx.fill(); // แถบชมพู
      for (const sx of [-1, 1]) { // ไฟท้าย
        ctx.beginPath(); ctx.arc(sx * 122, -96, 17, 0, Math.PI * 2);
        const lg = ctx.createRadialGradient(sx * 122 - 5, -101, 2, sx * 122, -96, 17); lg.addColorStop(0, '#ffe3ea'); lg.addColorStop(.5, '#ff7a9c'); lg.addColorStop(1, '#d94f78');
        ctx.fillStyle = lg; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      }
      rr(-62, -102, 124, 36, 9); ctx.fillStyle = '#fffaf0'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#c9b8ff'; ctx.stroke(); // ป้ายทะเบียน
      ctx.font = '600 20px Kanit, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ff6aa8'; ctx.fillText('VJLiveKit', 0, -84);
      rr(-164, -50, 328, 24, 12); // กันชน
      g = ctx.createLinearGradient(0, -50, 0, -26); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c9c3dc'); ctx.fillStyle = g; ctx.fill();
      // ราวหลังคา
      ctx.fillStyle = '#c9b6f5'; rr(-112, -286, 8, 16, 3); ctx.fill(); rr(104, -286, 8, 16, 3); ctx.fill(); rr(-112, -290, 224, 6, 3); ctx.fill();
      // ธง
      ctx.beginPath(); ctx.moveTo(126, -270); ctx.lineTo(126, -350); ctx.lineWidth = 4; ctx.strokeStyle = '#b0a7c8'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(128, -350); ctx.lineTo(176, -336); ctx.lineTo(128, -322); ctx.closePath(); ctx.fillStyle = '#ffd76a'; ctx.fill();
      ctx.font = '16px serif'; ctx.fillText('💗', 146, -336);
    }
    function drawCloth() { // ฝาผ้า + เชือกผูกโบว์
      const top = SH.topY, hem = -262, R = SH.rimHW;
      ctx.beginPath();
      ctx.moveTo(-108, top + 22);
      ctx.quadraticCurveTo(0, top - 16, 108, top + 22);
      ctx.quadraticCurveTo(128, top + 50, R, hem - 6);
      for (let i = 0; i < 10; i++) { // ชายผ้าเป็นคลื่น
        const x1 = R - (2 * R) * (i + 1) / 10, xm = R - (2 * R) * (i + 0.5) / 10;
        ctx.quadraticCurveTo(xm, hem + (i % 2 ? -6 : 16), x1, hem + 4);
      }
      ctx.quadraticCurveTo(-128, top + 50, -108, top + 22);
      ctx.closePath();
      const g = ctx.createLinearGradient(0, top - 10, 0, hem + 10);
      g.addColorStop(0, '#ff8a6b'); g.addColorStop(.35, SH.cloth); g.addColorStop(1, '#a8301c');
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(80,20,10,.35)'; ctx.stroke();
      ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 4;
      for (const x of [-80, -40, 0, 40, 80]) { ctx.beginPath(); ctx.moveTo(x * 0.9, top + 28); ctx.lineTo(x * 1.15, hem - 2); ctx.stroke(); } // รอยจีบ
      // เชือกผูกโบว์
      const ty = SH.openY - 8;
      ctx.strokeStyle = '#b08a5a';
      ctx.beginPath(); ctx.moveTo(-SH.openHW - 10, ty); ctx.quadraticCurveTo(0, ty + 8, SH.openHW + 10, ty); ctx.lineWidth = 5; ctx.stroke();
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(10, ty + 2); ctx.bezierCurveTo(-40, ty - 50, -90, ty - 10, 10, ty + 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10, ty + 2); ctx.bezierCurveTo(60, ty - 50, 110, ty - 10, 10, ty + 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10, ty + 2); ctx.quadraticCurveTo(-10, ty + 40, -30, ty + 80); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10, ty + 2); ctx.quadraticCurveTo(30, ty + 45, 22, ty + 86); ctx.stroke();
      ctx.beginPath(); ctx.arc(10, ty + 2, 6, 0, 6.2832); ctx.fillStyle = '#9a7548'; ctx.fill();
    }

    // ---- ฟิสิกส์ (position-based) ----
    const bodies = [], MAX = 600, G = 0.6; // MAX กันเครื่องช้าเท่านั้น
    const imgCache = {};
    function giftImg(url) { if (!url || !/^https:\/\//.test(url)) return null; let im = imgCache[url]; if (!im) { im = new Image(); im.src = url; imgCache[url] = im; } return im; }
    const radiusFor = (diamonds) => 14.4 * GIFT_SCALE * (1 + Math.min(1, Math.log10((diamonds || 1) + 1) / 4) * 0.9);

    function addBody(g, dropFromTop = true) {
      const r = radiusFor(g.d);
      // โหลเต็ม (โหมด spill) → ชิ้นใหม่ทะลักออกปากโหลไปกองข้าง ๆ
      const out = SH.solid || g.o === 1 || (dropFromTop && spilling);
      const side = Math.random() < .5 ? -1 : 1;
      // โหลปิดฝา (mason) → ของขวัญใหม่โผล่ใต้ฝา · ล้น → ออกเหนือฝาแล้วไหลลงข้าง
      const dropY = out || !SH.closed ? SH.topY - 40 - Math.random() * 60 : SH.openY + r + 4;
      const b = { x: (Math.random() - .5) * (SH.openHW - r) * 1.4, y: dropFromTop ? dropY : SH.fullY + 20 + Math.random() * (-SH.fullY - 40),
        r, rot: Math.random() * 6.28, img: giftImg(g.img), emoji: g.e || '🎁', d: g.d || 1, src: out && !SH.solid ? { ...g, o: 1 } : g, life: 1, out };
      if (out && !dropFromTop) { b.x = side * (SH.maxHW + 20 + Math.random() * 260); b.y = -r - Math.random() * 120; }
      b.px = b.x + (Math.random() - .5) * 2; b.py = b.y - 2;
      if (out && dropFromTop && !SH.solid) b.px = b.x - side * (1.5 + Math.random() * 2.5); // พุ่งออกด้านข้าง
      if (SH.solid && dropFromTop) { b.x = (Math.random() - .5) * 170; b.px = b.x; }
      if (SH.solid && !dropFromTop && !g.o) { b.x = (Math.random() - .5) * 180; b.y = SH.topY - 20 - Math.random() * 200; b.px = b.x; b.py = b.y; }
      bodies.push(b);
      if (dropFromTop) fx.sparkle(b.x, b.y, 5, b.d >= 1000 ? '#ffe08a' : '#fff6e8');
      const alive = bodies.filter((k) => !k.dying);
      if (alive.length > MAX) alive[0].dying = true;
    }

    function constrainOutside(b) {
      if (b.y + b.r > -3) { b.y = -3 - b.r; b.px = b.x - (b.x - b.px) * 0.5; } // พื้น (ระดับก้นโหล) + แรงเสียดทาน → กองเป็นภูเขาข้างโหล
      const s = S(), o = origin(), left = -o.x / s, right = (W - o.x) / s;
      if (b.x - b.r < left) b.x = left + b.r;
      if (b.x + b.r > right) b.x = right - b.r;
      if (SH.rects) { // ชนกับกล่องตัวรถ (จุดใกล้สุดบนสี่เหลี่ยม)
        for (const [x0, x1, y0, y1] of SH.rects) {
          const cx = Math.max(x0, Math.min(x1, b.x)), cy = Math.max(y0, Math.min(y1, b.y)), dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy);
          if (d >= b.r) continue;
          if (d > 0) { b.x = cx + dx / d * b.r; b.y = cy + dy / d * b.r; } else b.y = y0 - b.r;
          if (dy < 0 && -dy > Math.abs(dx)) b.px = b.x - (b.x - b.px) * 0.5; // วางบนหลังคา → เสียดทาน
        }
        return;
      }
      // ตัวโหลเป็นสิ่งกีดขวาง: ใต้ขอบบนสุดให้ไถลออกด้านข้างตามความโค้งของโหล
      if (b.y + b.r > SH.topY) {
        const hw = (b.y < SH.openY ? SH.rimHW : Math.max(SH.hw(Math.min(-0.5, b.y)), SH.hw(Math.min(-0.5, b.y + b.r * 0.75)))) + 6;
        if (Math.abs(b.x) < hw + b.r * 0.9) { b.x = Math.sign(b.x || 1) * (hw + b.r * 0.9); b.px = b.x - (b.x - b.px) * 0.3; } // ไม่ดีดกระเด็นจากผิวโหล
      }
    }
    function constrain(b) {
      if (b.out) return constrainOutside(b);
      const floorIn = SH.floor ?? -3;
      if (b.y + b.r > floorIn) b.y = floorIn - b.r;
      if (SH.closed && b.y - b.r < SH.openY) b.y = SH.openY + b.r; // ฝาผ้าปิดด้านบน
      // เหนือปากโหล = ช่องทางเข้า (กว้างเท่าปาก) · ในโหล = ตามโปรไฟล์ (เช็กส่วนล่างของลูกด้วย สำหรับก้นโค้ง)
      const hw = (b.y < SH.openY ? SH.openHW : Math.min(SH.hw(Math.min(-0.5, b.y)), SH.hw(Math.min(-0.5, b.y + b.r * 0.75)))) - 3;
      if (b.x - b.r < -hw) b.x = -hw + b.r;
      if (b.x + b.r > hw) b.x = hw - b.r;
    }
    // ---- juice: สปริงโหลสั่น + อนุภาค ----
    const fx = new Juice.Particles(), jarWobble = new Juice.Spring(140, 7);
    function step() {
      const VMAX = 14;
      for (const b of bodies) {
        const vx = Math.max(-VMAX, Math.min(VMAX, (b.x - b.px) * 0.985)), vy = Math.max(-VMAX, Math.min(VMAX, (b.y - b.py) * 0.985));
        b.px = b.x; b.py = b.y; b.x += vx; b.y += vy + G; b.vin = vy + G;
        b.rot += vx / b.r; b.age = (b.age || 0) + 1;
      }
      for (let it = 0; it < 4; it++) {
        for (let i = 0; i < bodies.length; i++) {
          const a = bodies[i];
          for (let j = i + 1; j < bodies.length; j++) {
            const c = bodies[j], dx = c.x - a.x, dy = c.y - a.y, min = a.r + c.r;
            if (Math.abs(dx) > min || Math.abs(dy) > min) continue;
            const d2 = dx * dx + dy * dy;
            if (d2 >= min * min || d2 === 0) continue;
            const d = Math.sqrt(d2), push = (min - d) / d * 0.5;
            a.x -= dx * push; a.y -= dy * push; c.x += dx * push; c.y += dy * push;
            if (a.out && c.out && dy * dy > dx * dx * 0.5) { a.px += (a.x - a.px) * 0.08; c.px += (c.x - c.px) * 0.08; } // ทับกันนอกโหล → กองนิ่ง
          }
        }
        for (const b of bodies) constrain(b); // เหนือปากโหลก็มีผนัง (ช่องทางเข้า) กันกระเด็นออกนอกโหล
      }
      // ตกกระทบ = ความเร็วลงหายไปมากในเฟรมเดียว → ยุบตัว + ฝุ่น (+ โหลสั่นถ้าของใหญ่)
      for (const b of bodies) {
        const vout = b.y - b.py;
        if (b.vin > 4 && vout < b.vin * 0.35 && b.age > 3) {
          (b.sq ||= new Juice.Spring(260, 13)).kick(-Math.min(b.vin, 14) * 0.9);
          if (b.vin > 7) fx.dust(b.x, b.y + b.r * 0.8, 3);
          if (b.d >= 1000) jarWobble.kick(Math.min(b.vin, 14) * 0.012 * (Math.random() < 0.5 ? -1 : 1));
        }
        if (b.sq) b.sq.step(1 / 60);
      }
      fx.step(); jarWobble.step(1 / 60);
      for (let i = bodies.length - 1; i >= 0; i--) {
        const b = bodies[i];
        if (b.dying) { b.life -= 0.04; if (b.life <= 0) { bodies.splice(i, 1); save(); } }
      }
      checkFull();
    }

    // ---- โหลเต็ม ----
    // เต็ม = มีชิ้นที่นิ่งแล้วกองสูงถึงไหล่โหล
    let fadeCooldown = 0, resetting = false, spilling = false;
    const conf = [];
    function checkFull() {
      if (resetting || SH.solid) return;
      // ชิ้นในโหลที่ไม่ได้กำลังตก (อายุ > 2 วิ) กองสูงถึงไหล่โหล = เต็ม
      const full = bodies.some((b) => !b.out && !b.dying && b.age > 120 && b.y - b.r < SH.fullY);
      spilling = full && FULL_MODE === 'spill';
      if (FULL_MODE === 'spill') {
        // ชิ้นที่ค้างเหนือปากโหล (เช่น ของเก่าที่โหลดกลับมาตอนรีเฟรช) → ทะลักออกข้าง
        for (const b of bodies) {
          if (b.out || b.dying || b.age < 60 || b.y > SH.openY) continue;
          const side = b.x < 0 ? -1 : 1;
          b.out = true; b.src = { ...b.src, o: 1 }; b.px = b.x - side * (3 + Math.random() * 3);
          save();
        }
        return;
      }
      if (!full) return;
      if (FULL_MODE === 'reset') return resetJar();
      if (fadeCooldown-- > 0) return;
      fadeCooldown = 8;
      const old = bodies.find((b) => !b.dying && b.age > 90); // ชิ้นเก่าสุด (มักอยู่ก้นโหล) → กองยุบลงเอง
      if (old) old.dying = true;
    }
    function resetJar() {
      resetting = true;
      const cols = ['#ff6aa8', '#ffcf5c', '#8fe3cf', '#b9a6f2', '#ffffff'];
      for (let i = 0; i < 140; i++) conf.push({ x: (Math.random() - .5) * 120, y: SH.topY, vx: (Math.random() - .5) * 14, vy: -(4 + Math.random() * 12),
        rot: Math.random() * 6.28, vr: (Math.random() - .5) * .6, w: 8 + Math.random() * 6, h: 12 + Math.random() * 8, c: cols[i % cols.length], life: 1 });
      $full.textContent = FULL_TEXT; $full.classList.add('show');
      setTimeout(() => bodies.forEach((b, i) => setTimeout(() => { b.dying = true; }, i * 12)), 1500);
      setTimeout(() => { $full.classList.remove('show'); resetting = false; }, 4500);
    }
    function drawConfetti() {
      for (let i = conf.length - 1; i >= 0; i--) {
        const p = conf[i]; p.vy += .35; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .01;
        if (p.life <= 0) { conf.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = p.life; ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
    }
    function drawBody(b) {
      if (b.life > 0.5) Juice.aura(ctx, b.x, b.y, b.r, b.d, nowT);
      const q = b.sq ? Math.max(-0.35, Math.min(0.35, b.sq.x)) : 0;
      ctx.save(); ctx.globalAlpha = b.life; ctx.translate(b.x, b.y + b.r * -q * 0.5); ctx.scale(1 - q, 1 + q); ctx.rotate(b.rot);
      if (b.img && b.img.complete && b.img.naturalWidth) { const s = b.r * 2.2; ctx.drawImage(b.img, -s / 2, -s / 2, s, s); }
      else {
        const r = b.r, g = ctx.createRadialGradient(-r * .3, -r * .3, r * .2, 0, 0, r);
        g.addColorStop(0, '#fff6cf'); g.addColorStop(.55, '#ffcf5c'); g.addColorStop(1, '#f5a623');
        ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fillStyle = g; ctx.fill();
        ctx.font = Math.round(r * 1.2) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.emoji, 0, 1);
      }
      ctx.restore();
    }
    // ฟิสิกส์เดินตามเวลาจริง (ชดเชยเฟรมที่หาย เช่น OBS ซ่อน source / แท็บถูกพัก)
    let lastT = performance.now(), acc = 0, nowT = 0;
    function tick() {
      const now = performance.now(); acc += Math.min(4000, now - lastT); lastT = now;
      let n = 0; while (acc >= 16.7 && n < 240) { step(); acc -= 16.7; n++; }
      if (n === 240) acc = 0;
    }
    setInterval(() => { if (document.hidden) tick(); }, 250);
    function frame() {
      tick();
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
      const o = origin(), s = S();
      nowT = performance.now() / 1000;
      ctx.translate(o.x, o.y); ctx.scale(s, s);
      ctx.rotate(jarWobble.x); ctx.scale(1, Juice.breathe(nowT, 0.005)); // โหลสั่น + หายใจ (หมุนรอบก้นโหล)
      drawJarBack();
      for (const b of bodies) drawBody(b);
      drawJarFront();
      fx.draw(ctx);
      drawConfetti();
      requestAnimationFrame(frame);
    }

    // ---- UI: แจ้งเตือน / อันดับ / ยอดรวม ----
    const $alert = document.getElementById('alert'), $board = document.getElementById('board'), $total = document.getElementById('total'), $full = document.getElementById('full');
    function layoutUi() {
      const o = origin(), s = S();
      $alert.style.left = o.x + 'px'; $alert.style.top = Math.max(4, o.y + (SH.topY - 130) * s) + 'px';
      $board.style.left = o.x + 'px'; $board.style.top = (o.y + 10) + 'px';
      $full.style.left = o.x + 'px'; $full.style.top = (o.y + (SH.fullY + 140) * s) + 'px';
      $total.style.left = o.x + 'px'; $total.style.top = Math.max(4, o.y + (SH.topY - 60) * s) + 'px';
    }
    let alertTimer = null;
    function showAlert(e, count) {
      if (!SHOW_ALERT) return;
      const ava = $alert.querySelector('.ava'), gi = $alert.querySelector('.gift');
      ava.src = e.user && e.user.avatar ? e.user.avatar : ''; ava.style.visibility = ava.src ? 'visible' : 'hidden';
      $alert.querySelector('.nm').textContent = (e.user && (e.user.nickname || e.user.uniqueId)) || 'ผู้ชม';
      $alert.querySelector('.sub').textContent = `ส่ง ${e.giftName || 'ของขวัญ'} ×${count}`;
      const gimg = /^https:\/\//.test(e.giftImage || '') ? e.giftImage : '';
      gi.src = gimg; gi.style.display = gimg ? 'block' : 'none';
      $alert.classList.add('show'); clearTimeout(alertTimer); alertTimer = setTimeout(() => $alert.classList.remove('show'), ALERT_MS);
    }
    let ranking = {}, totalCoins = 0;
    function renderBoard() {
      if (SHOW_TOTAL) $total.textContent = '💎 ' + Overlay.fmt(totalCoins); else $total.textContent = '';
      if (!SHOW_BOARD) { $board.innerHTML = ''; return; }
      const top = Object.values(ranking).sort((a, b) => b.c - a.c).slice(0, TOP);
      $board.innerHTML = top.map((u, i) => {
        const ava = BOARD_FULL && /^https:\/\//.test(u.a || '') ? `<img src="${u.a.replace(/"/g, '%22')}" alt="">` : '';
        const coins = BOARD_FULL ? `<span class="c">💎 ${Overlay.fmt(u.c)}</span>` : '';
        return `<div class="row"><span class="rk">${TOP === 1 ? '👑' : (['🥇', '🥈', '🥉'][i] || i + 1)}</span>${ava}<span>${Overlay.esc(u.n)}</span>${coins}</div>`;
      }).join('');
    }

    // ---- จำโหลไว้ (รีเฟรช OBS แล้วไม่หาย) ----
    const KEY = 'vjl-giftjar:' + (P('t', '') || P('username', 'demo')).slice(-24);
    let saveTimer = null;
    function save() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try { localStorage.setItem(KEY, JSON.stringify({ g: bodies.filter((b) => !b.dying).map((b) => b.src), r: ranking, t: totalCoins })); } catch { /* storage ปิดอยู่ */ }
      }, 500);
    }
    function restore() {
      if (P('reset', '0') === '1') { try { localStorage.removeItem(KEY); } catch { /* ignore */ } return; }
      try {
        const s = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (!s) return;
        ranking = s.r || {}; totalCoins = s.t || 0;
        (s.g || []).slice(-MAX).forEach((g, i) => setTimeout(() => addBody(g, false), i * 8));
      } catch { /* ignore */ }
    }

    const EMOJI = { Rose: '🌹', 'Finger Heart': '🫰', Perfume: '🧴', Galaxy: '🌌', Lion: '🦁', Universe: '🪐', Heart: '❤️', TikTok: '🎵' };
    function onGift(e) {
      const count = e.repeatCount || 1, unit = e.diamondCount || 0, value = e.totalValue || unit * count;
      if (unit < MIN_COINS) return;
      const g = { img: e.giftImage || '', e: EMOJI[e.giftName] || '🎁', d: unit };
      const n = Math.min(count, 30);
      for (let i = 0; i < n; i++) setTimeout(() => { addBody(g); save(); }, i * 110);
      const u = e.user || {}, id = u.uniqueId || u.nickname || '?';
      const row = ranking[id] || { n: u.nickname || id, a: u.avatar || '', c: 0 };
      row.c += value; row.n = u.nickname || row.n; row.a = u.avatar || row.a; ranking[id] = row;
      totalCoins += value;
      renderBoard(); showAlert(e, count); save();
      // ของแพง: พลุ + โหลสะเทือน · ตัวเลข/ป้ายเด้ง
      if (unit >= 1000) { fx.confetti(0, SH.topY - 20, 50); jarWobble.kick(0.06); }
      for (const el of [$total, $board]) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    }

    Overlay.on('event', (e) => { if (e.type === 'gift' && !e.streaking) onGift(e); });

    if (TOP === 1) $board.classList.add('solo');
    addEventListener('resize', resize); resize();
    restore(); renderBoard();
    requestAnimationFrame(frame);

    // ---- เดโม (เปิดไฟล์ตรง ๆ / ?demo=1) ----
    if (!Overlay.connected) {
      const names = ['somchai', 'mimi', 'บิ๊ก', 'lisa', 'ต้นน้ำ'];
      const gifts = [['Rose', 1], ['Finger Heart', 5], ['Perfume', 20], ['TikTok', 1], ['Galaxy', 1000], ['Lion', 2999]];
      setInterval(() => {
        const g = gifts[Math.floor(Math.random() * gifts.length)], nm = names[Math.floor(Math.random() * names.length)];
        onGift({ type: 'gift', user: { uniqueId: nm, nickname: nm, avatar: '' }, giftName: g[0], diamondCount: g[1], repeatCount: g[1] >= 1000 ? 1 : 1 + Math.floor(Math.random() * 3) });
      }, 1300);
    }
  })();
  </script>
</body>
