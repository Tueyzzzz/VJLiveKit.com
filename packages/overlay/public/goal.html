<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Goal Overlay</title>
<link rel="icon" href="favicon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@500;700&display=swap');
  html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Mali','Itim',sans-serif; }
  #goal { position:fixed; top:24px; left:50%; transform:translateX(-50%); width:min(480px,86vw);
    background:rgba(25,12,35,var(--bg,.35)); border:1.5px solid rgba(255,255,255,.35); border-radius:22px; padding:14px 18px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #goal.clear { border-color:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; }
  .hd { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:10px; }
  .tt { font-family:'Itim',sans-serif; font-size:21px; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nm { font-family:'Itim',sans-serif; font-size:18px; color:#ffd76a; text-shadow:0 1px 3px rgba(0,0,0,.7); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .track { position:relative; height:26px; border-radius:14px; background:rgba(255,255,255,.18); overflow:hidden; border:1px solid rgba(255,255,255,.3); }
  .fill { position:relative; height:100%; width:0%; border-radius:14px; transition:width .6s cubic-bezier(.3,.8,.4,1); overflow:hidden; }
  .fill::after { content:''; position:absolute; inset:0; background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%); animation:shine 2.2s linear infinite; }
  @keyframes shine { from{transform:translateX(-100%)} to{transform:translateX(100%)} }
  .pct { position:absolute; inset:0; display:grid; place-items:center; font-size:14px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  #goal.done { animation:glow 1.2s ease-in-out infinite alternate; }
  @keyframes glow { to { box-shadow:0 0 28px rgba(255,215,106,.8); } }
  #goal.done .tt::after { content:' 🎉'; }
  /* ---- แบบหัวใจแก้ว: น้ำค่อย ๆ เติมขึ้นตามยอด ---- */
  #heart { position:fixed; left:50%; top:16px; transform:translateX(-50%); display:none; flex-direction:column; align-items:center; width:calc(260px * var(--hs,1)); }
  #heart.on { display:flex; }
  #heart .ht { font-family:'Itim',sans-serif; font-size:calc(22px * var(--hs,1)); color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.7); margin-bottom:4px; white-space:nowrap; }
  #heart svg { width:100%; overflow:visible; filter:drop-shadow(0 10px 18px rgba(60,10,50,.35)); animation:hBeat 2.4s ease-in-out infinite; }
  #heart .hn { margin-top:2px; font-family:'Itim',sans-serif; font-size:calc(20px * var(--hs,1)); color:#ffe9a8; text-shadow:0 2px 4px rgba(0,0,0,.75); font-variant-numeric:tabular-nums; }
  #heart .hp { font-family:'Itim',sans-serif; font-size:calc(34px * var(--hs,1)); fill:#fff; paint-order:stroke; stroke:rgba(80,20,60,.55); stroke-width:5px; }
  .lvl { transition:transform 1.1s cubic-bezier(.3,.8,.35,1); }
  .wv1 { animation:wave 3.2s linear infinite; } .wv2 { animation:wave 4.6s linear infinite reverse; opacity:.55; }
  @keyframes wave { from { transform:translateX(0) } to { transform:translateX(-200px) } }
  .bub { animation:bub 3s ease-in infinite; opacity:0; }
  @keyframes bub { 0% { transform:translateY(0); opacity:0 } 15% { opacity:.8 } 100% { transform:translateY(-120px); opacity:0 } }
  /* หัวใจรูปภาพ (กระปุก/ขวด/โหล): ลอยขึ้นลงเบา ๆ แทนเต้นตุบ (เดิมเหมือนโดนบีบ) */
  @keyframes hSoft { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-4px) } }
  body.nobeat #heart svg, body.nobeat #iheart .box { animation:none !important; }
  @keyframes hBeat { 0%,100% { transform:scale(1) } 8% { transform:scale(1.04) } 16% { transform:scale(.99) } 24% { transform:scale(1.025) } 34% { transform:scale(1) } }
  #heart.done svg { animation:hBeat 1s ease-in-out infinite; filter:drop-shadow(0 0 22px rgba(255,200,120,.9)); }
  .hspk { position:absolute; pointer-events:none; color:#fff6c2; text-shadow:0 0 8px #ffd76a; animation:hspk 1.6s ease-out forwards; }
  @keyframes hspk { from { opacity:1; transform:translate(0,0) scale(.6) } to { opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.2) } }
  /* ---- หัวใจแก้วจากรูป AI: น้ำ (โค้ด) อยู่หลังรูปแก้ว ตัดตามรูปด้านในแก้ว (mask) ---- */
  #iheart { position:fixed; left:50%; top:10px; transform:translateX(-50%); display:none; flex-direction:column; align-items:center; width:calc(280px * var(--hs,1)); }
  #iheart.on { display:flex; }
  #iheart .ht { font-family:'Itim',sans-serif; font-size:calc(22px * var(--hs,1)); color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.7); white-space:nowrap; margin-bottom:-6%; position:relative; z-index:2; }
  #iheart .box { position:relative; width:calc(280px * var(--hs,1)); height:calc(280px * var(--hs,1)); flex:none; animation:hSoft 4s ease-in-out infinite; filter:drop-shadow(0 10px 16px rgba(60,10,50,.3)); }
  #iheart .liq { position:absolute; inset:0; }
  #iheart .liq svg { width:100%; height:100%; display:block; }
  #iheart .glass { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #iheart .ip { position:absolute; left:0; right:0; text-align:center; font-family:'Itim',sans-serif; font-size:calc(30px * var(--hs,1)); color:#fff; text-shadow:0 2px 4px rgba(80,20,60,.8), 0 0 10px rgba(255,255,255,.4); }
  #iheart .hn { margin-top:-8%; font-family:'Itim',sans-serif; font-size:calc(20px * var(--hs,1)); color:#ffe9a8; text-shadow:0 2px 4px rgba(0,0,0,.75); font-variant-numeric:tabular-nums; position:relative; }
  #iheart.done .box { animation:hSoft 1.6s ease-in-out infinite; filter:drop-shadow(0 0 22px rgba(255,200,120,.9)); }
</style>
</head>
<body>
  <div id="goal">
    <div class="hd"><span class="tt" id="title">เป้าหมาย</span><span class="nm"><span id="cur">0</span> / <span id="target">0</span></span></div>
    <div class="track"><div class="fill" id="fill"></div><div class="pct" id="pct">0%</div></div>
  </div>
  <div id="heart">
    <div class="ht" id="htitle"></div>
    <svg viewBox="-6 -6 212 202" aria-hidden="true">
      <defs>
        <path id="hp" d="M100 186 C 42 140, 0 104, 0 60 C 0 26, 26 0, 56 0 C 77 0, 92 12, 100 30 C 108 12, 123 0, 144 0 C 174 0, 200 26, 200 60 C 200 104, 158 140, 100 186 Z"/>
        <clipPath id="hc"><use href="#hp"/></clipPath>
        <linearGradient id="liq" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="150"><stop offset="0" id="lq1"/><stop offset="1" id="lq2"/></linearGradient>
        <radialGradient id="glass" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".6" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".16"/></radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity=".8"/></linearGradient>
      </defs>
      <use href="#hp" fill="rgba(40,15,45,.28)"/>
      <g clip-path="url(#hc)">
        <g class="lvl" id="lvl">
          <path class="wv2" fill="url(#liq)" d="M0 8 Q25 0 50 8 T100 8 T150 8 T200 8 T250 8 T300 8 T350 8 T400 8 T450 8 V420 H0 Z"/>
          <path class="wv1" fill="url(#liq)" d="M0 8 Q25 16 50 8 T100 8 T150 8 T200 8 T250 8 T300 8 T350 8 T400 8 T450 8 V420 H0 Z"/>
          <g id="bubs"></g>
        </g>
      </g>
      <use href="#hp" fill="url(#glass)" stroke="url(#rim)" stroke-width="4"/>
      <path d="M34 34 C 46 18, 66 14, 80 20" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="7" stroke-linecap="round"/>
      <path d="M24 56 C 24 50, 26 46, 28 43" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
      <circle cx="160" cy="34" r="5" fill="#fff" fill-opacity=".6"/>
      <text class="hp" id="hpct" x="100" y="104" text-anchor="middle" dominant-baseline="middle">0%</text>
    </svg>
    <div class="hn"><span id="hcur">0</span> / <span id="htarget">0</span></div>
  </div>
  <div id="iheart">
    <div class="ht" id="ititle"></div>
    <div class="box">
      <div class="liq"><svg viewBox="0 0 200 200" preserveAspectRatio="none">
        <defs><linearGradient id="iliq" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="90"><stop offset="0" id="iq1"/><stop offset="1" id="iq2"/></linearGradient></defs>
        <g class="lvl" id="ilvl">
          <path class="wv2" fill="url(#iliq)" d="M0 6 Q25 0 50 6 T100 6 T150 6 T200 6 T250 6 T300 6 T350 6 T400 6 T450 6 V420 H0 Z"/>
          <path class="wv1" fill="url(#iliq)" d="M0 6 Q25 12 50 6 T100 6 T150 6 T200 6 T250 6 T300 6 T350 6 T400 6 T450 6 V420 H0 Z"/>
          <g id="ibubs"></g>
        </g>
      </svg></div>
      <img class="glass" id="iglass" alt="" />
      <div class="ip" id="ipct">0%</div>
    </div>
    <div class="hn"><span id="icur">0</span> / <span id="itarget">0</span></div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script>
  (function(){
    // ?type=like|follow|share|diamond|gift  ?target=10000  ?label=...
    // ?next=0  ถึงเป้าแล้วขยับเป้าถัดไปเพิ่มอีกเท่านี้ (0 = ไม่ขยับ)   ?bg=35 ความทึบพื้นหลัง (0 = ใส)
    const type=Overlay.param('type','like');
    let target=Math.max(1,parseInt(Overlay.param('target','10000'),10)||10000);
    const NEXT=Math.max(0,parseInt(Overlay.param('next','0'),10)||0);
    const BG=Math.max(0,Math.min(100,parseFloat(Overlay.param('bg','35'))||0))/100;
    document.getElementById('goal').style.setProperty('--bg',String(BG)); if(BG===0) document.getElementById('goal').classList.add('clear');
    const labels={like:'❤️ เป้าหมายไลค์',follow:'➕ เป้าหมายผู้ติดตาม',share:'🔁 เป้าหมายแชร์',diamond:'💎 เป้าหมายเพชร',gift:'🎁 เป้าหมายกิฟต์'};
    const colors={like:['#ff93c0','#ff6aa8'],follow:['#8fe3cf','#5fc9b0'],share:['#ffcf5c','#f5a623'],diamond:['#ffd56b','#f5a623'],gift:['#b9a6f2','#9d86e8']};
    document.getElementById('title').textContent=Overlay.param('label',labels[type]||'เป้าหมาย');
    document.getElementById('target').textContent=Overlay.fmt(target);
    const c=colors[type]||colors.like; document.getElementById('fill').style.background=`linear-gradient(90deg,${c[0]},${c[1]})`;
    const key={like:'likeCount',follow:'followCount',share:'shareCount',diamond:'diamondCount',gift:'giftCount'}[type];

    // แบบแสดงผล: bar = แถบ (เดิม) · heart = หัวใจแก้วเติมน้ำ
    const STYLE=Overlay.param('style','bar'), H=document.getElementById('heart');
    if(Overlay.param('beat','1')==='0') document.body.classList.add('nobeat'); // ปิดการขยับของหัวใจ
    let liquid={like:['#ff9cc6','#ff4f93'],follow:['#9ff0dc','#3fbf9d'],share:['#ffe08a','#f5a623'],diamond:['#ffe9a0','#f2a81c'],gift:['#d3c4ff','#8f72e8']}[type]||['#ff9cc6','#ff4f93'];
    // สีน้ำ: auto = ตามสิ่งที่นับ · เลือกเองได้ · rainbow = ไล่สีรุ้งวนไปเรื่อย ๆ
    const LIQ={pink:['#ffb3d4','#ff4f93'],red:['#ff9a9a','#e8243c'],purple:['#d9c8ff','#8a5cf0'],blue:['#a8dcff','#2f8cf0'],mint:['#b6f5e4','#2fbf98'],gold:['#ffeaa0','#f0a01c'],peach:['#ffd3b6','#ff8a5c'],rainbow:['#ffb3d4','#ff4f93']};
    const LQ=Overlay.param('liq','auto'); if(LIQ[LQ]) liquid.splice(0,2,...LIQ[LQ]);
    if(LQ==='rainbow'){ const st=document.createElement('style'); st.textContent='#lvl,#ilvl{animation:rbw 6s linear infinite}@keyframes rbw{to{filter:hue-rotate(360deg)}}'; document.head.appendChild(st); }
    let lastPct=0;
    if(STYLE==='heart'){
      document.getElementById('goal').style.display='none'; H.classList.add('on');
      H.style.setProperty('--hs', String(Math.max(.4,Math.min(3,parseFloat(Overlay.param('size','1'))||1))));
      document.getElementById('htitle').textContent=Overlay.param('label',labels[type]||'เป้าหมาย');
      document.getElementById('lq1').setAttribute('stop-color',liquid[0]); document.getElementById('lq2').setAttribute('stop-color',liquid[1]);
      const bubs=document.getElementById('bubs');
      for(let i=0;i<9;i++){ const b=document.createElementNS('http://www.w3.org/2000/svg','circle');
        b.setAttribute('cx',String(20+Math.random()*160)); b.setAttribute('cy',String(40+Math.random()*140)); b.setAttribute('r',String(1.5+Math.random()*3.5));
        b.setAttribute('fill','rgba(255,255,255,.75)'); b.setAttribute('class','bub'); b.style.animationDelay=(-Math.random()*3)+'s'; b.style.animationDuration=(2.4+Math.random()*2)+'s'; bubs.appendChild(b); }
    }
    // หัวใจก้นแคบ: แปลง % เป็นความสูงน้ำตาม "ปริมาตร" จริง (50% = น้ำครึ่งหัวใจ ไม่ใช่แค่ก้น)
    const AREA=(()=>{ const P=new Path2D(document.getElementById('hp').getAttribute('d')), c=document.createElement('canvas').getContext('2d');
      const rows=[]; let tot=0; for(let y=186;y>=0;y-=2){ let w=0; for(let x=0;x<=200;x+=2) if(c.isPointInPath(P,x,y)) w++; tot+=w; rows.push([y,tot]); }
      return rows.map(([y,a])=>[y,a/tot]); })();
    function levelFor(pct){ const f=Math.min(1,pct/100); if(f<=0) return 190; if(f>=1) return -6;
      for(const [y,a] of AREA) if(a>=f) return y-4; return -6; }
    function renderHeart(v,pct){
      // ระดับน้ำ: 0% = ก้นหัวใจ (y≈186) · 100% = ล้นถึงขอบบน (y≈-4)
      document.getElementById('lvl').style.transform=`translateY(${levelFor(pct).toFixed(1)}px)`;
      document.getElementById('hpct').textContent=Math.floor(pct)+'%';
      document.getElementById('hcur').textContent=Overlay.fmt(v); document.getElementById('htarget').textContent=Overlay.fmt(target);
      const done=pct>=100; H.classList.toggle('done',done);
      if(done && lastPct<100){ for(let i=0;i<14;i++){ const sp=document.createElement('span'); sp.className='hspk'; sp.textContent=i%3?'✦':'💖';
        const a=Math.random()*Math.PI*2, d=60+Math.random()*90; sp.style.left='50%'; sp.style.top='45%'; sp.style.setProperty('--dx',Math.cos(a)*d+'px'); sp.style.setProperty('--dy',Math.sin(a)*d+'px');
        sp.style.fontSize=(12+Math.random()*12)+'px'; H.appendChild(sp); setTimeout(()=>sp.remove(),1700); } }
      lastPct=pct;
    }
    // แบบหัวใจแก้วจากรูป: lv = ระดับน้ำ (สัดส่วนความสูงรูป) ที่ 0%,5%,…,100% ของปริมาตรด้านในแก้ว (วัดจากรูปจริง)
    const IH={"angel":{"lv":[0.8083,0.7292,0.6917,0.6604,0.6354,0.6104,0.5875,0.5667,0.5458,0.5271,0.5083,0.4896,0.4708,0.4521,0.4333,0.4146,0.3958,0.3771,0.3563,0.3354,0.3104],"mid":0.559},"potion":{"lv":[0.8104,0.7583,0.7292,0.7042,0.6813,0.6625,0.6458,0.6292,0.6125,0.5958,0.5792,0.5646,0.5479,0.5333,0.5167,0.5021,0.4854,0.4688,0.45,0.4292,0.4083],"mid":0.609},"bowjar":{"lv":[0.8063,0.7562,0.725,0.6979,0.6771,0.6562,0.6375,0.6208,0.6042,0.5875,0.5708,0.5563,0.5396,0.525,0.5083,0.4917,0.475,0.4583,0.4417,0.4229,0.4021],"mid":0.604},"cyber":{"lv":[0.8021,0.7292,0.6917,0.6625,0.6375,0.6146,0.5938,0.5729,0.5521,0.5333,0.5146,0.4958,0.4771,0.4583,0.4396,0.4208,0.4021,0.3833,0.3604,0.3396,0.3167],"mid":0.559},"piggy":{"lv":[0.7292,0.6771,0.6438,0.6146,0.5896,0.5646,0.5396,0.5167,0.4958,0.475,0.4562,0.4354,0.4146,0.3958,0.375,0.3563,0.3333,0.3104,0.2854,0.2583,0.225],"mid":0.477},"melody":{"lv":[0.8979,0.8042,0.7625,0.725,0.6687,0.6438,0.6208,0.5896,0.5583,0.5354,0.5125,0.4917,0.4729,0.4562,0.4375,0.4167,0.3979,0.3771,0.3542,0.3333,0.3083],"mid":0.603}};
    const ISTY=STYLE.startsWith('h-')?IH[STYLE.slice(2)]:null, IHE=document.getElementById('iheart');
    let ilast=0;
    if(ISTY){
      const nm=STYLE.slice(2);
      document.getElementById('goal').style.display='none'; IHE.classList.add('on');
      IHE.style.setProperty('--hs', String(Math.max(.4,Math.min(3,parseFloat(Overlay.param('size','1'))||1))));
      { const L=IHE.querySelector('.liq').style, u=`url("hearts/${nm}-mask.png?v=3")`; L.webkitMaskImage=u; L.maskImage=u; L.webkitMaskSize=L.maskSize='100% 100%'; L.webkitMaskRepeat=L.maskRepeat='no-repeat'; }
      document.getElementById('iglass').src=`hearts/${nm}.webp`;
      document.getElementById('ititle').textContent=Overlay.param('label',labels[type]||'เป้าหมาย');
      document.getElementById('iq1').setAttribute('stop-color',liquid[0]); document.getElementById('iq2').setAttribute('stop-color',liquid[1]);
      document.getElementById('ipct').style.top=`calc(${(ISTY.mid*100).toFixed(1)}% - .6em)`;
      const bubs=document.getElementById('ibubs');
      for(let i=0;i<10;i++){ const b=document.createElementNS('http://www.w3.org/2000/svg','circle');
        b.setAttribute('cx',String(30+Math.random()*140)); b.setAttribute('cy',String(20+Math.random()*120)); b.setAttribute('r',String(1.2+Math.random()*2.8));
        b.setAttribute('fill','rgba(255,255,255,.8)'); b.setAttribute('class','bub'); b.style.animationDelay=(-Math.random()*3)+'s'; b.style.animationDuration=(2.4+Math.random()*2)+'s'; bubs.appendChild(b); }
    }
    function renderImg(v,pct){
      const f=Math.min(1,Math.max(0,pct/100)), k=f*20, i=Math.floor(k), lv=ISTY.lv;
      let y=i>=20?lv[20]-0.02:lv[i]+(lv[Math.min(20,i+1)]-lv[i])*(k-i); if(f<=0) y=lv[0]+0.03;
      document.getElementById('ilvl').style.transform=`translateY(${(y*200-6).toFixed(1)}px)`;
      document.getElementById('ipct').textContent=Math.floor(pct)+'%';
      document.getElementById('icur').textContent=Overlay.fmt(v); document.getElementById('itarget').textContent=Overlay.fmt(target);
      const done=pct>=100; IHE.classList.toggle('done',done);
      if(done && ilast<100){ for(let j=0;j<14;j++){ const sp=document.createElement('span'); sp.className='hspk'; sp.textContent=j%3?'✦':'💖';
        const a=Math.random()*Math.PI*2, d=60+Math.random()*90; sp.style.left='50%'; sp.style.top='45%'; sp.style.setProperty('--dx',Math.cos(a)*d+'px'); sp.style.setProperty('--dy',Math.sin(a)*d+'px');
        sp.style.fontSize=(12+Math.random()*12)+'px'; IHE.appendChild(sp); setTimeout(()=>sp.remove(),1700); } }
      ilast=pct;
    }
    function render(v){ if(NEXT>0) while(v>=target) target+=NEXT; document.getElementById('target').textContent=Overlay.fmt(target);
      const pct=Math.min(100,v/target*100); document.getElementById('cur').textContent=Overlay.fmt(v);
      document.getElementById('fill').style.width=pct+'%'; document.getElementById('pct').textContent=pct.toFixed(1)+'%';
      document.getElementById('goal').classList.toggle('done',pct>=100);
      if(STYLE==='heart') renderHeart(v,pct);
      if(ISTY) renderImg(v,pct); }

    Overlay.on('stats',(s)=>render(s[key]||0));
    Overlay.on('state',(s)=>render((s.stats&&s.stats[key])||0));

    const TEST=parseFloat(Overlay.param('test','')); // ?test=50 = ค้างที่ 50% (ใช้ตรวจหน้าตา)
    if(!Overlay.connected && TEST>=0){ render(target*TEST/100); }
    else if(!Overlay.connected){ let v=0; const step={like:120,follow:1,share:1,diamond:260,gift:2}[type];
      setInterval(()=>{ v+=Math.ceil(Math.random()*step); render(v); if(v>target) v=0; }, 900); }
    if(!(TEST>=0)) render(0);
  })();
  </script>
