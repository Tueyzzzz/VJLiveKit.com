<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gift Menu Overlay</title>
<link rel="icon" href="favicon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@500;700&display=swap');
  html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Mali','Itim',sans-serif; }
  /* zoom (ไม่ใช่ transform:scale) → เบราว์เซอร์วาดตัวหนังสือ/รูปใหม่ที่ขนาดจริง คมชัดแม้จอ 4K */
  #box { position:fixed; zoom:var(--s,1); width:340px; -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision; }
  /* รูปของขวัญย่อจากไฟล์ใหญ่ → ให้เบราว์เซอร์ย่อแบบนุ่ม (auto) ไม่แตกเป็นหยัก */
  .ico img { image-rendering:auto; }
  /* พรีวิวในแดชบอร์ด (?demo=1): วางกลางจอให้ตัวซูมอัตโนมัติจับกรอบได้สวย ไม่จมมุม (ลิงก์จริงยังใช้มุมที่ตั้ง) */
  #box.demo { left:50% !important; top:50% !important; right:auto !important; bottom:auto !important; transform:translate(-50%,-50%); }
  #box { --acc:#fff2a8; } #box.th-candy, #box.th-bubble { --acc:#e0468e; } #box.th-white { --acc:#ff4fa3; } #box.th-neon { --acc:#00e5ff; } #box.th-gold { --acc:#ffd76a; }
  #box.tl { left:16px; top:16px; --o:0 0 } #box.tr { right:16px; top:16px; --o:100% 0 }
  #box.bl { left:16px; bottom:16px; --o:0 100% } #box.br { right:16px; bottom:16px; --o:100% 100% }
  .panel { border-radius:22px; padding:12px 12px 10px; color:#fff; background:rgba(40,20,60,var(--bg,.45)); backdrop-filter:blur(8px);
    border:1.5px solid rgba(255,255,255,.35); box-shadow:0 10px 26px rgba(60,20,80,.3); }
  .title { font-family:'Itim',sans-serif; font-size:21px; text-align:center; margin:0 0 8px; text-shadow:0 2px 4px rgba(60,10,60,.5); }
  .row { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:16px; margin-top:6px;
    background:linear-gradient(90deg,rgba(255,111,170,.35),rgba(150,110,240,.25)); animation:in .5s ease both; }
  .row.hot { animation:in .5s ease both, hot 1s ease-in-out 2; }
  .ico { width:48px; height:48px; flex:none; display:grid; place-items:center; border-radius:14px; background:rgba(255,255,255,.18); font-size:28px; }
  .ico img { width:44px; height:44px; object-fit:contain; filter:drop-shadow(0 2px 3px rgba(0,0,0,.3)); animation:bob 2.4s ease-in-out infinite; }
  .txt { min-width:0; flex:1; }
  .what { font-size:17px; font-weight:700; line-height:1.25; text-shadow:0 1px 3px rgba(60,10,60,.6); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .how { font-size:13px; opacity:.92; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .how b { color:#fff2a8; }
  .empty { font-size:14px; text-align:center; opacity:.85; padding:10px; }
  /* แบบหมุนทีละรายการ */
  #box.rotate .row { margin-top:0; }
  @keyframes in { from { opacity:0; transform:translateX(-14px) } to { opacity:1; transform:none } }
  @keyframes bob { 50% { transform:translateY(-3px) rotate(-4deg) } }

  /* ===== เทมเพลตหน้าตา (theme) ===== */
  .th-candy .panel { background:linear-gradient(160deg,rgba(255,214,235,var(--bgx,.95)),rgba(225,210,255,var(--bgx,.95))); border:2px solid #fff; color:#5a2b55; box-shadow:0 10px 24px rgba(200,90,160,.25); }
  .th-candy .title { color:#e0468e; text-shadow:0 2px 0 #fff; } .th-candy .row { background:rgba(255,255,255,.75); } .th-candy .ico { background:#ffe3f1; }
  .th-candy .what { text-shadow:none; color:#4a2347; } .th-candy .how b { color:#e0468e; }
  .th-white .panel { background:rgba(255,255,255,var(--bgx,.96)); border:1px solid rgba(0,0,0,.06); color:#23202b; border-radius:16px; box-shadow:0 8px 22px rgba(0,0,0,.12); }
  .th-white .title { color:#23202b; text-shadow:none; font-family:'Kanit',sans-serif; } .th-white .row { background:#f6f4f9; border-radius:12px; } .th-white .ico { background:#fff; }
  .th-white .what { text-shadow:none; } .th-white .how b { color:#ff4fa3; }
  .th-neon .panel { background:rgba(8,6,20,var(--bgx,.85)); border:2px solid #ff4fd8; box-shadow:0 0 16px #ff4fd8, inset 0 0 14px rgba(255,79,216,.4); }
  .th-neon .title { color:#fff; text-shadow:0 0 6px #fff, 0 0 14px #ff4fd8, 0 0 28px #ff4fd8; } .th-neon .row { background:rgba(255,79,216,.08); border:1px solid rgba(0,229,255,.5); box-shadow:0 0 8px rgba(0,229,255,.35); }
  .th-neon .what { text-shadow:0 0 8px #00e5ff; } .th-neon .how b { color:#00e5ff; }
  .th-gold .panel { background:linear-gradient(180deg,rgba(60,10,25,var(--bgx,.92)),rgba(30,5,15,var(--bgx,.92))); border:2px solid #d4af37; box-shadow:0 0 0 3px rgba(212,175,55,.25), 0 12px 28px rgba(0,0,0,.45); }
  .th-gold .title { color:#ffe08a; text-shadow:0 2px 0 #7a5410; font-family:'Kanit',sans-serif; } .th-gold .row { background:linear-gradient(90deg,rgba(212,175,55,.22),rgba(212,175,55,.06)); border:1px solid rgba(212,175,55,.45); }
  .th-gold .what { color:#fff4d0; } .th-gold .how b { color:#ffd76a; }
  .th-bubble .panel { background:transparent; border:0; box-shadow:none; backdrop-filter:none; padding:0; }
  .th-bubble .title { background:linear-gradient(90deg,#ff7ab8,#b28bff); border-radius:999px; padding:6px 14px; display:inline-block; }
  .th-bubble #box .panel, .th-bubble .panel { text-align:center; }
  .th-bubble .row { background:rgba(255,255,255,.9); color:#4a2347; border-radius:999px; box-shadow:0 4px 12px rgba(0,0,0,.18); } .th-bubble .what { text-shadow:none; } .th-bubble .how b { color:#e0468e; } .th-bubble .ico { background:#ffe3f1; border-radius:50%; }
  /* แนวนอน: การ์ดเรียงเป็นแถว รูปอยู่บน ข้อความอยู่ล่าง */
  #box.horiz { width:auto; max-width:96vw; } #box.horiz #list { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  #box.horiz .row { flex-direction:column; width:118px; text-align:center; margin-top:0; padding:8px 6px; }
  #box.horiz .ico { width:58px; height:58px; } #box.horiz .ico img { width:54px; height:54px; }
  #box.horiz .what { white-space:normal; font-size:15px; line-height:1.2; } #box.horiz .how { font-size:12px; }
  /* ของขวัญขยับ */
  /* แบบไอคอน (ค่าเริ่มต้น): รูปของขวัญไม่มีพื้นหลัง คำอธิบายอยู่ใต้รูป ไม่ต้องบอก "ส่ง กุหลาบ x เหรียญ" (เห็นรูปก็รู้) */
  .it-tile .row { flex-direction:column; text-align:center; gap:2px; padding:6px 4px; background:none !important; border:0 !important; box-shadow:none !important; }
  .it-tile .ico { background:none !important; width:64px; height:64px; font-size:46px; } .it-tile .ico img { width:62px; height:62px; }
  .it-tile .what { white-space:normal; font-size:16px; max-width:150px; }
  .it-tile .row.gift .how { display:none; }
  .it-tile.horiz .row { width:120px; }
  .mv-bounce .ico img { animation:mvBounce 1.1s cubic-bezier(.3,1.6,.5,1) infinite; }
  .mv-spin .ico img { animation:mvSpin 3.2s linear infinite; }
  .mv-pulse .ico img { animation:mvPulse 1.3s ease-in-out infinite; }
  .mv-wiggle .ico img { animation:mvWiggle .9s ease-in-out infinite; }
  .mv-none .ico img { animation:none; }
  /* ขยับบางส่วน (?moveWho=some): ของขวัญนิ่ง ยกเว้นอันที่ถึงคิว (วนทีละ 1–2 อัน) — ไม่ตาลาย แต่ยังดูมีชีวิต */
  .mvsome .row:not(.act) .ico img { animation:none !important; }
  .mvsome .row:not(.act) .tw { animation-play-state:paused; opacity:0; }
  .mvsome .row.act .gl { filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 14px rgba(255,210,110,.85)); }
  .row:nth-child(2n) .ico img { animation-delay:-.4s } .row:nth-child(3n) .ico img { animation-delay:-.8s }
  @keyframes mvBounce { 0%,100% { transform:translateY(0) scale(1) } 30% { transform:translateY(-9px) scale(1.06,.96) } 55% { transform:translateY(0) scale(1.08,.92) } 70% { transform:translateY(-3px) } }
  @keyframes mvSpin { to { transform:rotateY(360deg) } }
  @keyframes mvPulse { 50% { transform:scale(1.18); filter:drop-shadow(0 0 8px rgba(255,220,240,.9)) } }
  @keyframes mvWiggle { 0%,100% { transform:rotate(0) } 25% { transform:rotate(-12deg) } 75% { transform:rotate(12deg) } }
  /* วงแหวนวิ่งรอบของขวัญ (?ring=01..20|mix|off · ?ringSpeed=วินาทีต่อรอบ) — วางทับกลางไอคอน ใหญ่กว่า ~1.45 เท่า หมุนด้วย transform (GPU) ไม่ดันเลย์เอาต์ */
  .has-ring .ico { position:relative; overflow:visible; margin:11px; } .has-ring.it-tile .ico { margin:14px 14px 10px; }
  .has-ring .ico > *:not(.ring) { position:relative; z-index:1; } /* รูปของขวัญอยู่บนวงแหวน และตั้งตรงเสมอ */
  .ring { position:absolute; left:50%; top:50%; width:145%; height:145%; margin:-72.5% 0 0 -72.5%; pointer-events:none; z-index:0;
    background:center/contain no-repeat; will-change:transform; backface-visibility:hidden;
    filter:drop-shadow(0 0 4px rgba(255,255,255,.55)) drop-shadow(0 0 9px var(--rg,rgba(255,200,240,.55)));
    animation:ringSpin var(--rs,6s) linear infinite; }
  .row:nth-child(2n) .ring { animation-direction:reverse; } /* สลับทิศ ดูมีชีวิต */
  @keyframes ringSpin { from { transform:rotate(0deg) } to { transform:rotate(360deg) } }
  /* กรอบรูปทรง (หัวใจ ดาว หกเหลี่ยม หูแมว มงกุฎ โบว์) หมุนแล้วดูแปลก → เต้นตุบ ๆ เบา ๆ แทน */
  .ring.still { animation:ringPulse 1.8s ease-in-out infinite; } @keyframes ringPulse { 0%,100% { transform:scale(1) } 50% { transform:scale(1.05) } }
  /* วงแหวนเส้นบาง (?ring=t1..t10) — วาดด้วย CSS ไม่ใช้รูป: เส้นบาง ~2px ไล่สีเป็นหางดาวหาง มีจุดสว่างวิ่งนำ */
  .ring.thin { width:128%; height:128%; margin:-64% 0 0 -64%; border-radius:50%; background:var(--tg);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - var(--tw,2.5px)), #000 calc(100% - var(--tw,2.5px) + .5px));
            mask:radial-gradient(farthest-side, transparent calc(100% - var(--tw,2.5px)), #000 calc(100% - var(--tw,2.5px) + .5px));
    filter:drop-shadow(0 0 3px var(--rg,#fff)); }
  .ring.thin::after { content:''; position:absolute; left:50%; top:-1px; width:7px; height:7px; margin-left:-3.5px; border-radius:50%; background:#fff; box-shadow:0 0 6px 2px var(--rg,#fff); display:var(--dot,block); }
  .ring.thin.dbl { box-shadow:none; } .ring.thin.dbl::before { content:''; position:absolute; inset:5px; border-radius:50%; border:1.5px solid var(--rg); opacity:.55; }
  /* ไฟวิ่งรอบของขวัญ (?ring=b1..b10) — หลอดไฟกลม ๆ เรียงเป็นวง ไล่ติดทีละดวงแบบป้ายโรงละคร (วงไม่หมุน ไฟวิ่งเอง) */
  .ring.bulbs { width:134%; height:134%; margin:-67% 0 0 -67%; background:none; animation:none; filter:none; }
  .ring.bulbs i { position:absolute; width:var(--bs,8px); height:var(--bs,8px); margin:calc(var(--bs,8px) / -2) 0 0 calc(var(--bs,8px) / -2); border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #fff 0 22%, var(--bc) 55%, color-mix(in srgb, var(--bc) 70%, #000) 100%);
    box-shadow:0 0 0 1px rgba(0,0,0,.25); opacity:.35; animation:var(--ba,bulbChase) var(--bp,1.6s) linear infinite; }
  @keyframes bulbChase { 0%,100% { opacity:1; box-shadow:0 0 6px 2px var(--bc), 0 0 12px 3px var(--bc) } 18% { opacity:.85; box-shadow:0 0 4px 1px var(--bc) } 35%,99% { opacity:.3; box-shadow:0 0 0 1px rgba(0,0,0,.25) } }
  @keyframes bulbAlt { 0%,49% { opacity:1; box-shadow:0 0 6px 2px var(--bc), 0 0 12px 3px var(--bc) } 50%,100% { opacity:.3; box-shadow:0 0 0 1px rgba(0,0,0,.25) } }
  @keyframes bulbTw { 0%,100% { opacity:.35; box-shadow:none } 50% { opacity:1; box-shadow:0 0 7px 2px var(--bc), 0 0 14px 4px var(--bc) } }
  @keyframes bulbOn { 0%,100% { opacity:1; box-shadow:0 0 5px 2px var(--bc) } 50% { opacity:.8; box-shadow:0 0 9px 3px var(--bc), 0 0 16px 4px var(--bc) } }
  /* ไฟเย็นวิ่ง (?ring=s1..s5) — หัวไฟเย็นวิ่งรอบของขวัญ สะเก็ดไฟกระเด็นออก (canvas วาดตามความละเอียดจอ) */
  .ring.spark { width:175%; height:175%; margin:-87.5% 0 0 -87.5%; background:none; animation:none; filter:none; }
  .ring.spark canvas { position:absolute; inset:0; width:100%; height:100%; }
  /* อยู่ในฟองสบู่ (?ring=bu1..bu3) — ฟองสบู่ (ภาพ GPT พื้นใส) ครอบทับของขวัญ ตรงกลางใส เห็นของขวัญลอยอยู่ข้างใน */
  .ring.bub { z-index:2 !important; width:150%; height:150%; margin:-75% 0 0 -75%; background:url(rings/bubble.webp) center/contain no-repeat;
    animation:bubWob 3.2s ease-in-out infinite; filter:drop-shadow(0 0 6px rgba(255,255,255,.35)) var(--bf,); }
  .ico:has(.ring.bub) { background:none !important; box-shadow:none !important; }
  .ring.bub ~ img { animation:bubFloat 3.2s ease-in-out infinite !important; }
  @keyframes bubWob { 0%,100% { transform:scale(1,1) translateY(0) } 25% { transform:scale(1.035,.97) translateY(-2px) } 50% { transform:scale(.98,1.025) translateY(-4px) } 75% { transform:scale(1.02,.985) translateY(-2px) } }
  @keyframes bubFloat { 0%,100% { transform:translateY(0) rotate(-4deg) } 50% { transform:translateY(-5px) rotate(4deg) } }
  /* ✨ แวววาว (?shine=sparkle|soft|off): ของขวัญเรืองแสงเป็นจังหวะ + แฟลชสว่างวิ้ง + ประกายดาวกะพริบรอบ ๆ (ตามรูปทรงจริงของรูป ไม่เป็นกล่อง) */
  .gl { position:relative; display:inline-grid; place-items:center; z-index:1; }
  .fx-glow .gl { animation:glGlow 2.6s ease-in-out infinite; }
  @keyframes glGlow { 0%,100% { filter:drop-shadow(0 0 2px rgba(255,255,255,.7)) drop-shadow(0 0 5px rgba(255,214,120,.35)) } 50% { filter:drop-shadow(0 0 4px rgba(255,255,255,.95)) drop-shadow(0 0 12px rgba(255,200,90,.75)) } }
  .tw { position:absolute; width:12px; height:12px; pointer-events:none; z-index:3; opacity:0; animation:twk 2.2s ease-in-out infinite;
    background:radial-gradient(circle, #fff 0 14%, rgba(255,255,255,0) 15%), conic-gradient(from 0deg, transparent 0 40deg, #fff 45deg, transparent 50deg 130deg, #fff 135deg, transparent 140deg 220deg, #fff 225deg, transparent 230deg 310deg, #fff 315deg, transparent 320deg);
    filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px #ffe08a); border-radius:50%; }
  @keyframes twk { 0%,100% { opacity:0; transform:scale(.2) rotate(0deg) } 45% { opacity:1; transform:scale(1) rotate(45deg) } 60% { opacity:.9; transform:scale(.85) rotate(60deg) } }
  /* แฟลชสว่างวิ้งบนตัวรูป (brightness — ใช้ได้กับรูปทุกแหล่ง ไม่ติด CORS) */
  .gb { display:inline-grid; place-items:center; }
  .fx-sweep .gb { animation:glBright 3.4s ease-in-out infinite; }
  /* แสงวิ้งวิ่งผ่าน: แถบแสงเฉียงวิ่งผ่าน "ตามรูปทรงของขวัญ" (mask = รูปเดียวกัน) */
  .sw { position:absolute; inset:0; pointer-events:none; -webkit-mask:var(--im) center/contain no-repeat; mask:var(--im) center/contain no-repeat;
    background:linear-gradient(115deg, transparent 0 38%, rgba(255,255,255,.95) 48%, rgba(255,250,215,.6) 53%, transparent 62% 100%) no-repeat; background-size:250% 100%;
    animation:swp 3.4s ease-in-out infinite; mix-blend-mode:screen; }
  @keyframes swp { 0% { background-position:130% 0 } 55%,100% { background-position:-130% 0 } }
  .mvsome .row:not(.act) .sw { animation-play-state:paused; opacity:0; }
  @keyframes glBright { 0%,80%,100% { filter:brightness(1) saturate(1) } 86% { filter:brightness(1.45) saturate(1.25) } 92% { filter:brightness(1.05) } }
  /* ===== แบบแถว (ค่าเริ่มต้น): [รูปของขวัญ] ชื่อ + 💎ราคา ➜ สิ่งที่เกิดบนจอ ===== */
  #box.it-row { width:450px; }
  .it-row .row { gap:10px; padding:8px 12px 8px 8px; margin-top:8px; border-radius:18px; position:relative; }
  .it-row .ico { width:64px; height:64px; border-radius:16px; font-size:36px; } .it-row .ico img { width:60px; height:60px; }
  .it-row .src { flex:0 0 100px; min-width:0; text-align:center; line-height:1.2; }
  .it-row .gn { font-size:15px; font-weight:700; overflow-wrap:break-word; }
  .it-row .gp { display:inline-block; margin-top:3px; font-size:13px; font-weight:700; color:var(--acc); background:rgba(255,255,255,.22); border-radius:999px; padding:1px 8px; white-space:nowrap; }
  .th-candy.it-row .gp, .th-white.it-row .gp, .th-bubble.it-row .gp { background:#fff0f7; }
  .it-row .arr { flex:none; font-size:20px; font-weight:700; color:var(--acc); }
  .it-row .what { flex:1; font-size:19px; line-height:1.25; white-space:normal; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  .th-candy.it-row .row { background:rgba(255,255,255,.82); box-shadow:0 3px 10px rgba(224,70,142,.12); }
  .it-row.horiz .row { width:150px; padding:8px 6px; } .it-row.horiz .src { flex:none; } .it-row.horiz .arr { transform:rotate(90deg); line-height:1; }
  .it-row.horiz .what { font-size:16px; text-align:center; }
  /* แถวตัวอย่าง (พรีวิวเท่านั้น — เติมให้ดูหน้าตาเมื่อเมนูจริงยังมีไม่ถึง 4 ข้อ) */
  .row.sample { opacity:.8; outline:2px dashed rgba(224,70,142,.45); outline-offset:-2px; position:relative; }
  .row.sample::after { content:'ตัวอย่าง'; position:absolute; top:-7px; right:10px; font:700 11px 'Mali',sans-serif; color:#fff; background:#e0468e; border-radius:999px; padding:1px 7px; }
  .it-tile .row.hot .ico img { filter:drop-shadow(0 0 10px #ffd76a) drop-shadow(0 0 4px #fff); }
  @keyframes hot { 50% { box-shadow:0 0 0 3px #ffe17a, 0 0 22px #ffcf5c; transform:scale(1.04) } }
</style>
</head>
<body>
  <div id="box"><div class="panel"><div class="title" id="title"></div><div id="list"></div></div></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script>
  (function () {
    // เมนูของขวัญ: บอกผู้ชมว่าส่งอะไร → เกิดอะไรบนจอ (ดึงจากกฎ Actions ที่เปิดอยู่ อัปเดตเองเมื่อแก้กฎ)
    // ?title= · ?pos=tl|tr|bl|br · ?layout=list|rotate · ?every=5 (วินาที, แบบหมุน) · ?max=6 · ?scale=1 · ?bg=45 · ?other=true (รวมแชท/ติดตาม/แชร์)

      clearInterval(timer); list.innerHTML = '';
      // รายการที่วีเจเพิ่มเองในหน้าตั้งค่า (ไม่ต้องมีกฎ) — ต่อท้ายตามราคา
      const custom = (SEL.custom || []).filter((c) => c && c.label).map((c) => ({ id: c.id, event: 'gift', gift: c.gift, th: c.th, image: /^https:\/\//.test(c.image || '') ? c.image : undefined, diamonds: c.diamonds, label: c.label }));
      let show = items.concat(custom).sort((a, b) => (a.event === 'gift' ? (a.diamonds || a.minDiamonds || 0) : 1e9) - (b.event === 'gift' ? (b.diamonds || b.minDiamonds || 0) : 1e9)).filter((m) => (OTHER || m.event === 'gift') && !HIDE.has(m.id)).map((m) => (/^https:\/\//.test(ICONS[m.id] || '') ? { ...m, image: ICONS[m.id] } : m));
      // พรีวิว: ยังไม่ได้เมนูจริง → ตัวอย่างล้วน · เมนูจริงมีไม่ถึง 4 ข้อ → ของจริงก่อน แล้วเติมแถว "ตัวอย่าง" ให้ดูหน้าตาออก (ลิงก์จริงไม่เติมเด็ดขาด)
      if (DEMO) {
        const okS = SAMPLES.filter((m) => OTHER || m.event === 'gift');
        if (!realLoaded && !show.length) show = okS.slice();
        else if (show.length < 4) { const have = new Set(show.map((m) => m.gift).filter(Boolean)); show = show.concat(okS.filter((m) => !m.gift || !have.has(m.gift)).slice(0, 4 - show.length).map((m) => ({ ...m, sample: true }))); }
      }
      if (!show.length) { list.innerHTML = '<div class="empty">ยังไม่มีกฎ — ตั้งที่เมนู Actions &amp; Events</div>'; return; }
      if (LAYOUT === 'rotate') {
        const PER = Math.max(1, Math.min(10, parseInt(P('per', '1'), 10) || 1)); // หมุนทีละกี่รายการ
        const step = () => { list.innerHTML = ''; for (let k = 0; k < Math.min(PER, show.length); k++) { const j = idx++ % show.length; list.appendChild(rowEl(show[j], j)); } };
        step(); if (show.length > PER) timer = setInterval(step, EVERY);
      } else show.slice(0, MAX).forEach((m, i) => { const r = rowEl(m, i); r.style.animationDelay = i * 0.08 + 's'; list.appendChild(r); });
    }
    // ขยับบางส่วน: วนไฮไลต์ทีละ 1 อัน (เมนูยาวเกิน 5 ข้อ = ทีละ 2 อัน) ทุก ~1.8 วิ
    if (MOVE_SOME) { let k = 0; setInterval(() => { const rows = [...list.querySelectorAll('.row')]; if (!rows.length) return; const n = rows.length > 5 ? 2 : 1; rows.forEach((r) => r.classList.remove('act')); for (let j = 0; j < n; j++) rows[(k + j * Math.ceil(rows.length / n)) % rows.length].classList.add('act'); k++; }, 1800); }
    if (Overlay.socket) Overlay.socket.on('menu', (m) => { items = Array.isArray(m) ? m : []; render(); });

    // มีคนส่งกิฟต์ที่อยู่ในเมนู → ไฮไลต์แถวนั้น ให้คนอื่นเห็นว่าใช้ได้จริง
    Overlay.on('action', (f) => {
      if (LAYOUT !== 'list' || !f || !f.name) return;
      [...list.children].forEach((r) => { if ((r.dataset.rule === f.ruleId || r.querySelector('.what')?.textContent === f.name)) { r.classList.remove('hot'); void r.offsetWidth; r.classList.add('hot'); } });
    });

    // ตัวอย่างในแดชบอร์ด (ไม่มีลิงก์จริง): ล็อกอินอยู่ → ใช้กฎจริงของวีเจเป็นค่าเริ่มต้น · ไม่มี/ยังไม่มีกฎ → ตัวอย่างสมมติ
    let session = null; try { session = localStorage.getItem('vjl_token') || sessionStorage.getItem('vjl_token'); } catch (e) { /* ignore */ }
    if (!Overlay.connected && session) {
      fetch('/api/actions/menu', { headers: { Authorization: 'Bearer ' + session } }).then((r) => (r.ok ? r.json() : null))
        .then((j) => { if (j && Array.isArray(j.items)) { items = j.items; realLoaded = true; render(); } }).catch(() => {}); // เมนูว่าง [] ก็ใช้ได้ → ของที่เพิ่มเอง + แถวตัวอย่าง
    }
    if (DEMO) render(); // ตัวอย่างก่อน (แทนที่ด้วยของจริงเมื่อโหลดเสร็จ)
  })();
  </script>
</body>
</html>
