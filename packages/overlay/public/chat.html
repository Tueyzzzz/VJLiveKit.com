<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@500;700&display=swap');
  html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Mali','Itim',sans-serif; }
  #chat { position:fixed; bottom:20px; left:20px; width:min(440px,70vw); display:flex; flex-direction:column; gap:9px; }
  .bubble { display:flex; align-items:flex-start; gap:10px; animation:rise .3s ease; }
  @keyframes rise { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:none;} }
  .ava { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:#fff; font-family:'Itim',sans-serif; font-size:15px; flex:none; box-shadow:0 3px 7px rgba(150,120,180,.3); }
  .msg { background:rgba(255,250,252,.95); border:2px solid #fff; border-radius:16px; padding:9px 14px; font-size:17px; color:#5f4a66; box-shadow:0 5px 12px rgba(150,120,180,.2); word-break:break-word; }
  .msg .who { font-family:'Itim',sans-serif; color:#9d86e8; margin-right:6px; }
</style>
</head>
<body>
  <div id="chat"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script>
  (function(){
    const chat=document.getElementById('chat'); const MAX=parseInt(Overlay.param('max','8'),10);
    const cols=['#ff93c0','#b9a6f2','#8fe3cf','#ffcf5c','#ff6aa8','#9d86e8']; const colOf=(nm)=>cols[(nm||'?').charCodeAt(0)%cols.length];
    function add(nm,text){ const b=document.createElement('div'); b.className='bubble';
      b.innerHTML=`<div class="ava" style="background:${colOf(nm)}">${Overlay.esc((nm||'?')[0])}</div><div class="msg"><span class="who">${Overlay.esc(nm)}</span>${Overlay.esc(text)}</div>`;
      chat.appendChild(b); while(chat.children.length>MAX) chat.removeChild(chat.firstChild); }
    Overlay.on('event',(e)=>{ if(e.type==='chat') add(e.user?(e.user.nickname||e.user.uniqueId):'', e.comment||''); });
    if(!Overlay.connected){ const names=['mimi','บิ๊ก','lisa','ต้นน้ำ','somchai','เฟิร์น']; const msgs=['สวัสดีครับ','เก่งมาก!','สู้ๆ','กดไลค์ให้แล้ว','555','ปังมาก','น่ารักอะ','รักเลย 💕'];
      setInterval(()=>add(names[Math.floor(Math.random()*names.length)], msgs[Math.floor(Math.random()*msgs.length)]), 1600); }
  })();
  </script>
</body>
</html>
