<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Donate Overlay</title>
<link rel="icon" href="favicon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@500;700&display=swap');
  html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Mali','Itim',sans-serif; }
  #wrap { position:fixed; left:50%; transform:translateX(-50%); display:flex; justify-content:center; width:min(1000px,96vw); }
  #wrap.top { top:6vh } #wrap.center { top:50%; transform:translate(-50%,-50%) } #wrap.bottom { bottom:7vh }
  .card { position:relative; width:100%; padding:18px 22px 20px; border-radius:26px; text-align:center; color:#fff; box-sizing:border-box;
    background:linear-gradient(135deg,rgba(255,111,170,.92),rgba(150,110,240,.92)); border:2px solid rgba(255,255,255,.7);
    box-shadow:0 18px 40px rgba(80,20,90,.45), 0 0 0 6px rgba(255,255,255,.12); transform:scale(var(--s,1)); transform-origin:50% 0;
    animation:pop .7s cubic-bezier(.2,1.5,.4,1) both; }
  .card.out { animation:out .5s ease-in forwards; }
  .who { font-family:'Itim',sans-serif; font-size:26px; text-shadow:0 2px 4px rgba(60,10,60,.5); }
  .amt { font-family:'Itim',sans-serif; font-size:64px; line-height:1.05; margin:4px 0 2px; color:#fff6c2;
    text-shadow:0 0 14px rgba(255,220,120,.9), 0 3px 0 rgba(170,80,20,.5); animation:amt 1.2s ease-in-out .6s 2; }
  .msg { font-size:22px; line-height:1.4; margin-top:6px; padding:8px 14px; border-radius:16px; background:rgba(255,255,255,.18); word-break:break-word; }
  .badge { position:absolute; left:50%; top:-22px; transform:translateX(-50%); font-size:34px; animation:spin 1.6s ease-in-out infinite; }
  @keyframes pop { from { opacity:0; transform:translateY(-30px) scale(calc(var(--s,1)*.6)) } to { opacity:1; transform:scale(var(--s,1)) } }
  @keyframes out { to { opacity:0; transform:translateY(-20px) scale(calc(var(--s,1)*.9)) } }
  @keyframes amt { 50% { transform:scale(1.12) } }
  @keyframes spin { 50% { transform:translateX(-50%) rotate(-12deg) scale(1.15) } }
  .coin { position:fixed; font-size:28px; pointer-events:none; animation:fall var(--d,2.4s) cubic-bezier(.3,.1,.6,1) forwards; }
  @keyframes fall { from { transform:translate(0,-60px) rotate(0) } to { transform:translate(var(--x,0),110vh) rotate(var(--r,360deg)) } }
  /* กรอบรูป GPT (?frame=01..10 · ตำแหน่งช่องข้อความใน donate/frames.json) */
  .fcard { position:relative; width:min(760px,94vw); transform:scale(var(--s,1)); transform-origin:50% 0; animation:pop .7s cubic-bezier(.2,1.5,.4,1) both; filter:drop-shadow(0 14px 26px rgba(60,20,80,.45)); }
  .fcard.out { animation:out .5s ease-in forwards; }
  .fcard img.fr { display:block; width:100%; height:auto; }
  .fcard .pn { position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; overflow:hidden; color:var(--ink,#5a2a3a); }
  .fcard .who { text-shadow:none; color:var(--ink,#5a2a3a); font-size:calc(var(--ph) * .19); white-space:nowrap; max-width:96%; overflow:hidden; text-overflow:ellipsis; }
  .fcard .amt { font-size:calc(var(--ph) * .40); margin:0; color:var(--amt,#ff4f9a); text-shadow:0 2px 0 rgba(255,255,255,.7), 0 0 14px rgba(255,200,120,.55); }
  .fcard .msg { font-size:calc(var(--ph) * .15); margin-top:2px; padding:2px 10px; background:transparent; color:var(--ink,#5a2a3a); max-width:96%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .coin img { width:1em; height:1em; object-fit:contain; display:block; }
  /* ตัวแทนวีเจข้างแจ้งเตือน (?avatar=photo | รหัสมาสคอต เช่น G1) */
  .drow .card { flex:1 1 auto; max-width:620px; min-width:0; } .drow .fcard { width:min(720px,calc(96vw - 220px)); }
  .drow { display:flex; align-items:flex-end; justify-content:center; gap:min(14px,2vw); }
  .vjav { flex:0 0 auto; position:relative; animation:avIn .7s cubic-bezier(.2,1.6,.4,1) both; }
  .vjav.out { animation:out .5s ease-in forwards; }
  .vjav.photo { width:calc(150px * var(--s,1)); height:calc(150px * var(--s,1)); border-radius:24%; overflow:hidden; border:5px solid #fff; box-shadow:0 10px 26px rgba(80,20,90,.5), 0 0 0 4px rgba(255,111,170,.75); background:#ffd6ea; align-self:center; }
  .vjav.photo img { width:100%; height:100%; object-fit:cover; display:block; animation:bob 1.3s ease-in-out infinite; }
  .vjav.masc { width:calc(170px * var(--s,1)); height:calc(170px * var(--s,1)); border-radius:24%; overflow:hidden; border:5px solid #fff; align-self:center;
    background:radial-gradient(circle at 50% 35%,#fff6fb,#ffd3e8 60%,#d9c6ff); box-shadow:0 10px 26px rgba(80,20,90,.5), 0 0 0 4px rgba(255,111,170,.75); }
  .vjav.masc img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 0; opacity:0; transition:opacity .12s; }
  .vjav.masc img.on { opacity:1; }
  .vjav.masc.hop img.on { animation:hop .45s cubic-bezier(.3,1.6,.5,1); }
  .vjav .tag { position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); white-space:nowrap; font-family:'Itim',sans-serif; font-size:calc(17px * var(--s,1)); color:#fff; padding:2px 12px; border-radius:999px; background:linear-gradient(90deg,#ff6faa,#9b6ef0); box-shadow:0 4px 10px rgba(80,20,90,.4); }
  @keyframes avIn { from { opacity:0; transform:translateY(40px) scale(.5) } to { opacity:1; transform:none } }
  @keyframes bob { 50% { transform:translateY(-4px) scale(1.04) } }
  @keyframes hop { 40% { transform:translateY(-6%) scale(1.04) } }
</style>
</head>
<body>
  <div id="wrap"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script>
  (function () {
    // ?pos=top|center|bottom · ?scale=1 · ?dur=8 (วินาที) · ?sound=1 · ?coins=1 · ?label=ขอบคุณที่โดเนท
    const P = (k, d) => Overlay.param(k, d);
    const wrap = document.getElementById('wrap');
    wrap.className = ['top', 'center', 'bottom'].includes(P('pos', 'top')) ? P('pos', 'top') : 'top';
    const SCALE = Math.max(.4, Math.min(2.5, parseFloat(P('scale', '1')) || 1));
    const DUR = Math.max(3, Math.min(30, parseFloat(P('dur', '8')) || 8)) * 1000;
    // พรีวิว/เดโม (ไม่มีลิงก์จริง) วนโชว์ตลอด → ปิดเสียง ไม่งั้นกริ๊งไม่หยุดตอนเปิดหน้าแดชบอร์ด
    const SOUND = P('sound', 'true') !== 'false' && (Overlay.connected || new URLSearchParams(location.search).get('sound') === '1'), COINS = P('coins', 'true') !== 'false';
    const fmt = (n) => Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 });
    // กรอบรูป GPT 10 ธีม (?frame=01..10) · เหรียญ/แบงก์ 3D (donate/coin-*.webp) แทนอีโมจิ ถ้ามีไฟล์
    let FR = null; const FRAME = String(P('frame', '') || '');
    let frDone = !/^\d{2}$/.test(FRAME);
    if (!frDone) fetch('donate/frames.json').then((r) => r.json()).then((m) => { if (m[FRAME]) { FR = m[FRAME]; new Image().src = 'donate/frame-' + FR.id + '.webp'; } }).catch(() => {}).finally(() => { frDone = true; });
    // ตัวแทนวีเจ: รูปโปรไฟล์ TikTok (ชื่อมาจากเหตุการณ์โดเนท) หรือมาสคอต (ท่า 1 ยืน · 6 ขอบคุณ · 7 ดีใจ · 8 ส่งหัวใจ)
    const AV = String(P('avatar', 'photo') || ''), MASC = /^[A-Z][A-Za-z0-9]{1,8}$/.test(AV) ? AV : '';
    const MPOSE = [7, 8, 6, 7, 8], MSRC = {};
    // ตัดขอบใสรอบตัวมาสคอตทีละท่า → ตัวละครเต็มกล่อง ไม่จิ๋ว (ยืนชิดล่าง)
    if (MASC) [1, 6, 7, 8].forEach((n) => { const im = new Image(); im.onload = () => {
      const W0 = 200, k = W0 / im.naturalWidth, c = document.createElement('canvas'); c.width = W0; c.height = Math.round(im.naturalHeight * k); const x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
      const a = x.getImageData(0, 0, c.width, c.height).data; let x0 = 1e9, y0 = 1e9, x1 = 0, y1 = 0;
      for (let y = 0; y < c.height; y++) for (let xx = 0; xx < c.width; xx++) if (a[(y * c.width + xx) * 4 + 3] > 200) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 <= x0) return;
      // ครึ่งตัวบน (หัว→เอว ≈ 52% ของความสูงตัว) เป็นสี่เหลี่ยมจัตุรัส กึ่งกลางตามแนวตัว
      const fh = (y1 - y0 + 1) / k, side = Math.max(fh * 0.52, (x1 - x0 + 1) / k * 0.9), cx = (x0 + x1) / 2 / k, top = y0 / k - side * 0.04;
      const o = document.createElement('canvas'); o.width = o.height = 640; const g = o.getContext('2d'); g.imageSmoothingQuality = 'high';
      g.drawImage(im, cx - side / 2, top, side, side, 0, 0, 640, 640); MSRC[n] = o.toDataURL('image/webp', .92); }; im.src = 'mascot/' + MASC + '/' + n + '.webp'; });
    function makeAvatar(d) {
      if (!AV) return null;
      const el = document.createElement('div');
      if (MASC) {
        el.className = 'vjav masc'; el.innerHTML = [1, 6, 7, 8].map((n) => `<img data-n="${n}" src="${MSRC[n] || 'mascot/' + MASC + '/' + n + '.webp'}" alt="">`).join('');
        let k = 0; const show = (n) => { el.querySelectorAll('img').forEach((im) => { const m = MSRC[+im.dataset.n]; if (m && im.src !== m) im.src = m; im.classList.toggle('on', +im.dataset.n === n); }); el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop'); };
        show(7); el._t = setInterval(() => show(MPOSE[++k % MPOSE.length]), 1100); setTimeout(() => show(7), 300); // รูปครอปเสร็จทีหลัง → เปลี่ยนทันที
      } else {
        const src = d.vj ? '/api/tiktok/avatar/' + encodeURIComponent(String(d.vj).toLowerCase()) : (Overlay.connected ? '' : 'avatars/demo1.webp');
        if (!src) return null;
        el.className = 'vjav photo'; el.innerHTML = `<img src="${src}" alt="" onerror="this.parentNode.remove()">`;
      }
      return el;
    }
    const COIN_IMG = []; fetch('donate/coins.json').then((r) => r.json()).then((l) => l.forEach((n) => { const im = new Image(); im.src = 'donate/' + n; im.onload = () => COIN_IMG.push(im.src); })).catch(() => {});

    let ac = null;
    function chime() {
      if (!SOUND) return;
      try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        [880, 1175, 1568, 2093].forEach((f, i) => {
          const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * 0.11;
          o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .6);
          o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .65);
        });
      } catch { /* เสียงถูกบล็อก */ }
    }
    function rain(amount) {
      if (!COINS) return;
      const n = Math.min(40, 8 + Math.round(Math.log10(Math.max(1, amount)) * 10));
      for (let i = 0; i < n; i++) setTimeout(() => {
        const c = document.createElement('div'); c.className = 'coin';
        if (COIN_IMG.length) { const im = document.createElement('img'); im.src = COIN_IMG[i % COIN_IMG.length]; c.appendChild(im); } else c.textContent = i % 4 ? '🪙' : (i % 8 ? '💖' : '💸');
        c.style.left = Math.random() * 100 + 'vw'; c.style.setProperty('--x', (Math.random() - .5) * 120 + 'px'); c.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
        c.style.setProperty('--d', (2 + Math.random() * 1.6) + 's'); c.style.fontSize = (COIN_IMG.length ? 34 + Math.random() * 26 : 20 + Math.random() * 18) + 'px';
        document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
      }, i * 60);
    }

    // ต่อคิวทีละรายการ (โดเนทพร้อมกันหลายคนไม่ทับกัน)
    const q = []; let busy = false;
    function next() {
      if (!frDone) { busy = true; setTimeout(() => { busy = false; next(); }, 120); return; } // รอข้อมูลกรอบโหลดก่อน (แจ้งเตือนแรกไม่หลุดเป็นแบบเดิม)
      const d = q.shift(); if (!d) { busy = false; return; } busy = true;
      const card = document.createElement('div'); card.style.setProperty('--s', SCALE);
      const big = d.amount >= 500;
      if (FR) { // กรอบรูป: ข้อความอยู่ในช่องกลางกรอบ ขนาดตามความสูงช่อง
        card.className = 'fcard'; card.style.setProperty('--ink', FR.ink || '#5a2a3a'); card.style.setProperty('--amt', FR.amt || '#ff4f9a');
        const b = FR.panel;
        card.innerHTML = `<img class="fr" src="donate/frame-${FR.id}.webp" alt=""><div class="pn" style="left:${b[0] * 100}%;top:${b[1] * 100}%;width:${(b[2] - b[0]) * 100}%;height:${(b[3] - b[1]) * 100}%"><div class="who"></div><div class="amt"></div>${d.message ? '<div class="msg"></div>' : ''}</div>`;
        requestAnimationFrame(() => { const pn = card.querySelector('.pn'); pn.style.setProperty('--ph', pn.clientHeight * (d.message ? 1 : 1.12) + 'px'); });
      } else {
        card.className = 'card';
        card.innerHTML = `<div class="badge">${big ? '👑' : '💖'}</div><div class="who"></div><div class="amt"></div>${d.message ? '<div class="msg"></div>' : ''}`;
      }
      card.querySelector('.who').textContent = `${d.name} ${P('label', 'โดเนท')}`;
      card.querySelector('.amt').textContent = `฿${fmt(d.amount)}`;
      if (d.message) card.querySelector('.msg').textContent = d.message;
      const av = makeAvatar(d), row = document.createElement('div'); row.className = 'drow'; row.style.setProperty('--s', SCALE);
      if (av) row.appendChild(av); row.appendChild(card); wrap.appendChild(row); chime(); rain(d.amount);
      if (av) { const fit = () => { const h = Math.max(130, Math.min(260, card.offsetHeight * 0.92)); av.style.height = av.style.width = h + 'px'; }; fit(); if (window.ResizeObserver) new ResizeObserver(fit).observe(card); } // มาสคอตสูงตามป้าย (รอรูปกรอบโหลด)
      setTimeout(() => { card.classList.add('out'); if (av) av.classList.add('out'); setTimeout(() => { if (av && av._t) clearInterval(av._t); row.remove(); next(); }, 500); }, DUR);
    }
    Overlay.on('donation', (d) => { q.push(d); if (!busy) next(); });

    if (!Overlay.connected) {
      const demo = [{ name: 'mimi', amount: 100, message: 'สู้ ๆ นะคะ ร้องเพลงเพราะมาก 💕' }, { name: 'บิ๊ก', amount: 500, message: 'ขอเพลงรักหน่อยครับ' }, { name: 'lisa', amount: 20, message: '' }];
      let i = 0; const tick = () => { q.push(demo[i++ % demo.length]); if (!busy) next(); };
      tick(); setInterval(tick, DUR + 1500);
    }
  })();
  </script>
</body>
</html>
