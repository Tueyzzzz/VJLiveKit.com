name: Deploy

# ดีพลอยอัตโนมัติเมื่อ CI (รวม build image -> GHCR) ผ่านบน main
# หรือกด Run workflow เองที่แท็บ Actions
# ต้องมี: secret VULTR_HOST + (VULTR_SSH_KEY หรือ VULTR_PASSWORD) และ variable DEPLOY_ENABLED=true — ดู DEPLOY.md
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.DOMAIN || 'vjlivekit.com' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: img
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then tag="${{ github.event.workflow_run.head_sha }}"; else tag=latest; fi
          echo "ref=$repo:$tag" >> "$GITHUB_OUTPUT"

      - name: Upload deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER || 'root' }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          password: ${{ secrets.VULTR_PASSWORD }}
          source: "docker-compose.prod.yml,deploy/Caddyfile,deploy/bootstrap.sh"
          target: /opt/vjlivekit

      - name: Bootstrap & deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ steps.img.outputs.ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMAIN: ${{ vars.DOMAIN || 'vjlivekit.com' }}
          DEMO_MODE: ${{ vars.DEMO_MODE }}
          BILLING_PROVIDER: ${{ vars.BILLING_PROVIDER }}
          SIGN_API_KEY: ${{ secrets.SIGN_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PRO_MONTHLY: ${{ vars.STRIPE_PRICE_PRO_MONTHLY }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          EASYSLIP_API_KEY: ${{ secrets.EASYSLIP_API_KEY }}
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER || 'root' }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          password: ${{ secrets.VULTR_PASSWORD }}
          command_timeout: 20m
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,DOMAIN,DEMO_MODE,BILLING_PROVIDER,SIGN_API_KEY,GOOGLE_TTS_API_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_PRICE_PRO_MONTHLY,ADMIN_EMAILS,EASYSLIP_API_KEY
          script: |
            set -e
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -E"; fi
            $SUDO bash /opt/vjlivekit/deploy/bootstrap.sh

      # ตรวจหลัง deploy: เว็บจริงต้องรัน commit ใหม่ และหน้าหลักต้องเปิดได้ — ไม่ผ่าน = แจ้งล้ม (เคยเจอ deploy "สำเร็จ" แต่เครื่องยังรันตัวเก่า)
      - name: Verify production
        env:
          DOMAIN: ${{ vars.DOMAIN || 'vjlivekit.com' }}
          EXPECT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ok=""
          for i in $(seq 1 30); do
            got=$(curl -fs "https://$DOMAIN/api/version" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)
            echo "try $i: live commit=${got:-?} expect=$EXPECT"
            if [ "$got" = "$EXPECT" ]; then ok=1; break; fi
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::เว็บจริงยังไม่ใช่เวอร์ชันใหม่ ($EXPECT)"; exit 1; }
          for p in /healthz / /dashboard/ /dashboard/actions/ /dashboard/sounds/ /login/ /overlay/fx.html /overlay/sign.html /overlay/giftjar.html /api/version; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN$p")
            echo "$p -> $code"; [ "$code" = "200" ] || { echo "::error::$p ตอบ $code"; exit 1; }
          done
