<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coin Jar Overlay</title>
<link rel="icon" href="favicon.svg" />
<style>
  /* OBS overlay — พื้นหลังโปร่งใส */
  @import url('https://fonts.googleapis.com/css2?family=Itim&display=swap');
  html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Itim',sans-serif; }
  #fx { position:fixed; inset:0; }
  .counter { position:fixed; z-index:10; transform:translateX(-50%);
    background:rgba(255,250,252,.92); color:#f5a623; font-size:26px; padding:6px 20px; border-radius:999px;
    border:3px solid #fff; box-shadow:0 8px 20px rgba(150,120,180,.3); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .counter small { color:#9d86e8; font-size:15px; }
  .gifter { position:fixed; z-index:8; display:flex; flex-direction:column; align-items:center; gap:4px; opacity:0; transform:translate(-50%,8px); transition:opacity .4s, transform .4s; pointer-events:none; }
  .gifter.show { opacity:1; transform:translate(-50%,0); }
  .gifter .ava { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:23px; border:3px solid #fff; box-shadow:0 6px 14px rgba(150,120,180,.4); background-size:cover; background-position:center; }
  .gifter .nm { background:#fffafc; color:#ff6aa8; font-size:13px; padding:2px 12px; border-radius:999px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="counter" id="counter"><span id="dia">0</span> <small>💎</small></div>
  <div class="gifter" id="gifter"><div class="ava" id="gAva">?</div><div class="nm" id="gNm">—</div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script src="js/juice.js"></script>
  <script>
  /*
   * Coin Jar (เครื่องจักร + สายพาน) — ของขวัญจริงออกจากเครื่อง วิ่งบนสายพาน แล้วตกกองบนพื้นด้วยฟิสิกส์
   * พารามิเตอร์: goal=10000 scale=1 giftScale=1 x=0 y=0 counter=1 reset=1
   */
  (function () {
    const P = (k, d) => Overlay.param(k, d);
    const num = (k, d) => { const v = parseFloat(P(k, d)); return Number.isFinite(v) ? v : d; };
    const GOAL = Math.max(1, num('goal', 10000)), SCALE = num('scale', 1), GIFT_SCALE = num('giftScale', 1), OX = num('x', 0), OY = num('y', -80); // ค่าเริ่มต้นยกเครื่องขึ้นจากขอบล่าง (พ้นแถบ UI ของ TikTok)
    const SHOW_COUNTER = P('counter', '1') !== '0';
    document.getElementById('counter').style.display = 'none'; // ตัวเลขแสดงบนหน้าเครื่องแทน

    const canvas = document.getElementById('fx'), ctx = canvas.getContext('2d');
    const DPR = Math.min(2, devicePixelRatio || 1);
    let W = 0, H = 0, S = 1, TX = 0, TY = 0; // แปลงพิกัดออกแบบ (1280x720) -> จอ
    const DW = 1280, DH = 720, FLOOR = 700;

    // ---- เรขาคณิต (พิกัดออกแบบ) ----
    const M = { x0: 975, x1: 1195, y0: 420, y1: 640, depth: 30 };   // ตัวเครื่อง (หน้า) — สี่เหลี่ยมจัตุรัส 220×220
    const MOUTH = { x0: 985, x1: 1050, y0: 470, y1: 612 };          // ช่องปล่อยของขวัญ
    const SCREEN = { x0: 1068, x1: 1182, y0: 462, y1: 552 };
    const BELT_A = { x: 1012, y: 612 }, BELT_B = { x: 640, y: 652 }; // ผิวบนสายพาน (จากเครื่อง -> ปลาย)
    const BELT_T = 22, BELT_V = 1.9;
    let BELT_TH = BELT_T;

    // ---- สกินรูปภาพ (เรนเดอร์/AI) — ?skin=classic เพื่อใช้ตู้วาดด้วยโค้ดแบบเดิม ----
    // พิกัดจุดสำคัญวัดจากรูปต้นฉบับ (พิกเซล) แล้วแปลงเป็นพิกัดออกแบบ: ช่องอุโมงค์, ผิวสายพาน, จอ, แผงตัวเลข
    // ทุกสกิน: m = ตัวเครื่อง [x0, x1, y0], mouth = ช่องอุโมงค์ [x0, x1, y0, y1], screen = จอ, belt = ผิวบนสายพาน [ขอบหลังปลาย, ขอบหลังฝั่งเครื่อง, ขอบหน้าปลาย, ขอบหน้าฝั่งเครื่อง]
    const SKINS = {
      karaoke: { label: 'ตู้คาราโอเกะ', src: 'themes/machine-karaoke.webp', w: 1199, h: 1312, k: 0.31693, x0: 860.0, y0: 306.6, counter: { px: 612, py: 874 }, music: true,
        m: [260, 1116, 13], mouth: [270, 420, 840, 985], screen: [437, 721, 197, 481], belt: [[95, 1010], [420, 960], [100, 1040], [440, 1005]] },
      arcade: { label: 'ตู้เกมอาร์เคด', src: 'themes/machine-arcade.webp', w: 1199, h: 1312, k: 0.31693, x0: 860.0, y0: 292.7, counter: { px: 895, py: 665 },
        m: [280, 1090, 20], mouth: [290, 540, 820, 990], screen: [650, 760, 630, 700], belt: [[95, 1025], [450, 950], [100, 1060], [470, 1000]] },
      atm: { label: 'ตู้ ATM ทองคำ', src: 'themes/machine-atm.webp', w: 1312, h: 1199, k: 0.28963, x0: 860.0, y0: 365.0, counter: { px: 860, py: 430 },
        m: [330, 1250, 20], mouth: [330, 560, 720, 900], screen: [440, 770, 430, 690], belt: [[75, 945], [500, 850], [60, 995], [520, 945]] },
      reactor: { label: 'เตาปฏิกรณ์ไซไฟ', src: 'themes/machine-reactor.webp', w: 1312, h: 1199, k: 0.28963, x0: 860.0, y0: 362.9, counter: { px: 400, py: 575 },
        m: [220, 1300, 20], mouth: [220, 450, 700, 850], screen: [265, 415, 400, 495], belt: [[45, 930], [470, 835], [55, 975], [470, 885]] },
      image: { label: 'ตู้ชมพู', src: 'themes/machine-pink.webp', w: 1249, h: 1241, k: 380 / 1249, x0: 860, y0: 327.6, counter: { px: 915, py: 985 },
        m: [299, 1220, 370], mouth: [319, 559, 469, 771], screen: [789, 999, 521, 702], belt: [[60, 812], [545, 762], [72, 858], [545, 826]] },
      cupcake: { label: 'ตู้คัพเค้ก', src: 'themes/machine-cupcake.webp', w: 1312, h: 1199, k: 0.28963, x0: 860.0, y0: 374.2, counter: { px: 830, py: 922 },
        m: [330, 1240, 470], mouth: [345, 530, 665, 860], screen: [720, 1025, 665, 820], belt: [[70, 895], [525, 838], [70, 940], [525, 882]] },
      cat: { label: 'ตู้หัวแมว', src: 'themes/machine-cat.webp', w: 1312, h: 1199, k: 0.28963, x0: 860.0, y0: 377.1, counter: { px: 890, py: 895 },
        m: [280, 1270, 420], mouth: [280, 395, 600, 795], screen: [720, 960, 130, 230], belt: [[45, 810], [375, 775], [45, 855], [375, 818]] },
      house: { label: 'บ้านขนมปังขิง', src: 'themes/machine-house.webp', w: 1312, h: 1199, k: 0.28963, x0: 860.0, y0: 364.7, counter: { px: 1185, py: 665 },
        m: [325, 1285, 420], mouth: [340, 525, 605, 815], screen: [720, 1110, 560, 790], belt: [[60, 818], [515, 778], [60, 850], [515, 812]] },
      rocket: { label: 'ตู้จรวด', src: 'themes/machine-rocket.webp', w: 1312, h: 1199, k: 0.28963, x0: 860.0, y0: 379.2, counter: { px: 780, py: 845 },
        m: [330, 1250, 600], mouth: [350, 465, 655, 820], screen: [640, 900, 360, 620], belt: [[90, 880], [460, 790], [90, 935], [460, 845]] },
      gacha: { label: 'ตู้กาชาปอง', src: 'themes/machine-gacha.webp', w: 1312, h: 1199, k: 0.28963, x0: 860.0, y0: 365.3, counter: { px: 840, py: 1015 },
        m: [330, 1150, 640], mouth: [335, 465, 795, 930], screen: [690, 920, 710, 790], belt: [[180, 940], [455, 885], [180, 980], [455, 935]] },
      gift: { label: 'ตู้กล่องของขวัญ', src: 'themes/machine-gift.webp', w: 1312, h: 1199, k: 0.28963, x0: 860.0, y0: 365.5, counter: { px: 930, py: 818 },
        m: [270, 1265, 290], mouth: [285, 440, 645, 875], screen: [735, 1110, 520, 700], belt: [[70, 885], [425, 850], [70, 935], [425, 905]] },
      icecream: { label: 'ร้านไอศกรีม', src: 'themes/machine-icecream.webp', w: 1310, h: 1200, k: 0.29008, x0: 860.0, y0: 363.9, counter: { px: 1090, py: 640 },
        m: [310, 1255, 540], mouth: [330, 465, 645, 840], screen: [640, 940, 600, 770], belt: [[70, 872], [455, 812], [70, 915], [455, 862]] },
      bear: { label: 'หมีน้อยถือกล่อง', src: 'themes/machine-bear.webp', w: 1312, h: 1199, k: 0.28963, x0: 860.0, y0: 362.4, counter: { px: 980, py: 905 },
        m: [405, 1290, 660], mouth: [430, 550, 835, 960], screen: [730, 900, 555, 640], belt: [[60, 1000], [525, 945], [60, 1045], [525, 990]] },
    };
    const SKIN = Overlay.param('skin', 'image') === 'classic' ? null : SKINS[Overlay.param('skin', 'image')] || SKINS.image;
    // เปลี่ยนสีตู้: ?hue=-180..180 ?sat=1 ?bright=1
    const skinImg = SKIN ? Juice.skin(SKIN.src, num('hue', 0), num('sat', 1), num('bright', 1)) : null;
    const fromSkin = (px, py) => ({ x: SKIN.x0 + px * SKIN.k, y: SKIN.y0 + py * SKIN.k });
    if (SKIN) {
      const P0 = (px, py) => fromSkin(px, py);
      Object.assign(M, { x0: P0(SKIN.m[0], 0).x, x1: P0(SKIN.m[1], 0).x, y0: P0(0, SKIN.m[2]).y, y1: 700, depth: 0 });
      Object.assign(MOUTH, { x0: P0(SKIN.mouth[0], 0).x, x1: P0(SKIN.mouth[1], 0).x, y0: P0(0, SKIN.mouth[2]).y, y1: P0(0, SKIN.mouth[3]).y }); // เผื่อด้านบนอุโมงค์ ของขวัญที่เด้งจะไม่ถูกดันขึ้นหลังคา
      Object.assign(SCREEN, { x0: P0(SKIN.screen[0], 0).x, x1: P0(SKIN.screen[1], 0).x, y0: P0(0, SKIN.screen[2]).y, y1: P0(0, SKIN.screen[3]).y });
      const [bb0, bb1] = SKIN.belt;
      Object.assign(BELT_A, fromSkin(bb1[0] - 5, bb1[1] - 6)); Object.assign(BELT_B, fromSkin(bb0[0] - 10, bb0[1] - 2));
      BELT_TH = 40;
    }

    function resize() {
      W = innerWidth; H = innerHeight;
      canvas.width = W * DPR; canvas.height = H * DPR; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      S = Math.min(W / DW, H / DH) * SCALE;
      TX = W - DW * S + OX; TY = H - DH * S + OY; // ชิดขวาล่าง
    }
    const toScreen = (x, y) => ({ x: TX + x * S, y: TY + y * S });

    // ---- ฟิสิกส์ ----
    // จำนวนชิ้นสูงสุดตามขนาดของขวัญ: ชิ้นเล็กลงครึ่งหนึ่ง = ใส่ได้ 4 เท่า (1× = 1,000 · 0.7× ≈ 2,000 · 1.5× ≈ 450)
    const bodies = [], MAX = Math.round(Math.max(300, Math.min(2500, 1000 / (GIFT_SCALE * GIFT_SCALE)))), G = 0.55;
    const imgCache = {};
    function giftImg(url) { if (!url || !/^https:\/\//.test(url)) return null; let im = imgCache[url]; if (!im) { im = new Image(); im.src = url; imgCache[url] = im; } return im; }
    // ของแพงใหญ่ตามราคา · ไม่เกินความสูงช่องอุโมงค์ (ออกจากเครื่องได้เสมอ)
    const sizeFor = Juice.sizeFor || ((d, max = 4) => 1 + (max - 1) * Math.min(1, Math.log10(Math.max(1, d || 1)) / 4.5)); // กันไฟล์ juice.js เก่าในแคช
    // ขนาดเต็มตามราคา (สูงสุด 4×, เพดาน 70) · ตอนออกจากอุโมงค์จำกัดเท่าความสูงช่อง แล้วค่อยพองเต็มขนาดเมื่อพ้นเครื่อง
    const radiusFor = (d) => Math.min(19 * GIFT_SCALE * sizeFor(d, 4), 70);
    const tunnelR = () => (MOUTH.y1 - MOUTH.y0) * 0.46;

    function addBody(g, mode) {
      const rFull = radiusFor(g.d), r = mode === 'restore' ? rFull : Math.min(rFull, tunnelR());
      const b = { r, rFull, rot: Math.random() * 6.28, img: giftImg(g.u), e: g.e || '🎁', d: g.d || 1, src: g, life: 1, age: 0 };
      if (mode === 'restore') { b.x = BELT_B.x - 50 + Math.random() * 60; b.y = FLOOR - 150 - Math.random() * 500; }
      else if (SKIN) { b.x = MOUTH.x1 - 22 - Math.random() * 12; b.y = MOUTH.y0 + 45 + Math.random() * 12; }
      else { b.x = MOUTH.x0 + 18 + Math.random() * 20; b.y = MOUTH.y0 + 40 + Math.random() * 50; }
      b.px = b.x + (mode === 'restore' ? 0 : 1.5 + Math.random()); b.py = b.y;
      bodies.push(b);
      if (mode !== 'restore') fx.sparkle(b.x, b.y, 4, b.d >= 1000 ? '#ffe08a' : '#fff6e8');
      const alive = bodies.filter((k) => !k.dying);
      if (alive.length > MAX) alive[0].dying = true; // ชิ้นเก่าสุด · กันเครื่องช้าเท่านั้น
    }

    // ระยะจากจุดถึงเส้นตรง A-B
    function segInfo(px, py, A, B) {
      const vx = B.x - A.x, vy = B.y - A.y, len2 = vx * vx + vy * vy;
      let t = ((px - A.x) * vx + (py - A.y) * vy) / len2; t = Math.max(0, Math.min(1, t));
      const cx = A.x + vx * t, cy = A.y + vy * t, dx = px - cx, dy = py - cy;
      return { t, dx, dy, dist: Math.hypot(dx, dy) };
    }
    const beltCA = { x: BELT_A.x, y: BELT_A.y + BELT_TH / 2 }, beltCB = { x: BELT_B.x, y: BELT_B.y + BELT_TH / 2 };
    const beltLen = Math.hypot(BELT_B.x - BELT_A.x, BELT_B.y - BELT_A.y);
    const beltDir = { x: (BELT_B.x - BELT_A.x) / beltLen, y: (BELT_B.y - BELT_A.y) / beltLen };

    function constrain(b) {
      // สายพาน = แคปซูลหนา BELT_T
      const s = segInfo(b.x, b.y, beltCA, beltCB), lim = b.r + BELT_TH / 2;
      if (s.dist < lim && s.dist > 0) {
        const nx = s.dx / s.dist, ny = s.dy / s.dist, k = lim - s.dist;
        b.x += nx * k; b.y += ny * k;
        if (ny < -0.5) { // อยู่บนสายพาน → ถูกพาไปทางปลาย
          const vx = b.x - b.px, vy = b.y - b.py, along = vx * beltDir.x + vy * beltDir.y;
          const dv = (BELT_V - along) * 0.25;
          b.px -= beltDir.x * dv; b.py -= beltDir.y * dv;
        }
      }
      // ตัวเครื่อง (ยกเว้นช่องปล่อย)
      const inMouthZone = b.x < MOUTH.x1 && b.y > MOUTH.y0 && b.y < MOUTH.y1;
      if (!inMouthZone && b.x + b.r > M.x0 && b.x - b.r < M.x1 + M.depth && b.y + b.r > M.y0 - M.depth) {
        const pl = b.x + b.r - M.x0, pt = b.y + b.r - (M.y0 - M.depth);
        if (pl < pt) b.x -= pl; else b.y -= pt;
      }
      if (inMouthZone && b.x + b.r > MOUTH.x1) b.x = MOUTH.x1 - b.r;
      if (SKIN && inMouthZone && b.x > M.x0 && b.y - b.r < MOUTH.y0) { b.y = MOUTH.y0 + b.r; b.py = b.y; } // เพดานอุโมงค์
      // พื้น + ขอบจอ
      if (b.y + b.r > FLOOR) { b.y = FLOOR - b.r; b.px = b.x - (b.x - b.px) * 0.35; } // แรงเสียดทานพื้น → กองพูนเป็นภูเขา
      const left = -TX / S, right = (W - TX) / S;
      if (b.x - b.r < left) b.x = left + b.r;
      if (b.x + b.r > right) b.x = right - b.r;
    }

    const fx = new Juice.Particles(), machinePunch = new Juice.Spring(220, 11);
    if (SKIN && SKIN.music) setInterval(() => { if (!document.hidden && fx.notes) fx.notes((SCREEN.x0 + SCREEN.x1) / 2 + (Math.random() - .5) * 60, SCREEN.y0, 1); }, 1500);
    let nowT = 0;
    // เพดานกอง: ยอดกองสูงเกิน PILE_MAX ของความสูงจอ → ชิ้นเก่าสุดค่อย ๆ จางไป (ล้นได้ แต่ไม่ท่วมจอ)
    const PILE_MAX = Math.max(0.2, Math.min(0.9, num('pileMax', 55) / 100));
    let pileCheck = 0;
    function trimPile() {
      const limitY = FLOOR - DH * PILE_MAX;
      // นับเฉพาะชิ้นที่วางนิ่งแล้ว (ไม่นับชิ้นที่ยังตกอยู่กลางอากาศ)
      const over = bodies.filter((b) => !b.dying && b.age > 120 && Math.abs(b.y - b.py) < 0.6 && b.y - b.r < limitY).length;
      if (!over) return;
      const alive = bodies.filter((b) => !b.dying).sort((p, q) => q.age - p.age);
      for (let i = 0; i < Math.min(alive.length, Math.min(6, over)); i++) alive[i].dying = true;
    }
    function step() {
      if (++pileCheck % 30 === 0) trimPile();
      const VMAX = 14;
      for (const b of bodies) {
        if (b.r < b.rFull && b.x + b.r < MOUTH.x0 - 10) b.r = Math.min(b.rFull, b.r + 0.7); // พ้นเครื่องแล้ว → พองเต็มขนาดตามราคา
        const vx = Math.max(-VMAX, Math.min(VMAX, (b.x - b.px) * 0.985)), vy = Math.max(-VMAX, Math.min(VMAX, (b.y - b.py) * 0.985));
        b.px = b.x; b.py = b.y; b.x += vx; b.y += vy + G; b.vin = vy + G; b.rot += vx / b.r; b.age++;
      }
      for (let it = 0; it < 4; it++) {
        // เรียงตามแกน x แล้วเช็กเฉพาะชิ้นที่ช่วง x ซ้อนกัน (เร็วพอสำหรับ 1,000 ชิ้น)
        const ord = bodies.slice().sort((p, q) => p.x - q.x); // ลำดับเดิม (เก่า→ใหม่) ใช้เลือกชิ้นเก่าสุด/บันทึก
        let maxR = 0; for (const b of bodies) if (b.r > maxR) maxR = b.r;
        for (let i = 0; i < ord.length; i++) {
          const a = ord[i];
          for (let j = i + 1; j < ord.length; j++) {
            const c = ord[j], dx = c.x - a.x, dy = c.y - a.y, min = a.r + c.r;
            if (dx > a.r + maxR) break; // ไกลเกินรัศมีใหญ่สุดที่มีอยู่ → ชิ้นถัดไปไกลกว่านี้หมด
            if (Math.abs(dx) > min || Math.abs(dy) > min) continue;
            const d2 = dx * dx + dy * dy;
            if (d2 >= min * min || d2 === 0) continue;
            const d = Math.sqrt(d2), push = (min - d) / d * 0.5;
            a.x -= dx * push; a.y -= dy * push; c.x += dx * push; c.y += dy * push;
            if (dy * dy > dx * dx * 0.5) { const f = 0.14; a.px += (a.x - a.px) * f; c.px += (c.x - c.px) * f; } // ทับกัน → หน่วงให้กองนิ่ง
          }
        }
        for (const b of bodies) constrain(b);
      }
      // ตกกระทบ → ยุบตัว + ฝุ่น
      for (const b of bodies) {
        const vout = b.y - b.py;
        if (b.vin > 4 && vout < b.vin * 0.35 && b.age > 3) {
          (b.sq ||= new Juice.Spring(260, 13)).kick(-Math.min(b.vin, 14) * 0.9);
          if (b.vin > 7) fx.dust(b.x, b.y + b.r * 0.8, 3);
        }
        if (b.sq) b.sq.step(1 / 60);
      }
      fx.step(); machinePunch.step(1 / 60);
      for (let i = bodies.length - 1; i >= 0; i--) {
        const b = bodies[i];
        if (b.dying) { b.life -= 0.04; if (b.life <= 0) { bodies.splice(i, 1); save(); } }
      }
    }

    // ---- วาด ----
    let beltOffset = 0, shakeT = 0, screenImg = null, screenEmoji = '🎁';
    function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
    function drawBelt() {
      const a = BELT_A, b = BELT_B;
      // ขา
      ctx.lineCap = 'round';
      for (const t of [0.15, 0.55, 0.92]) {
        const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t + BELT_T;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, FLOOR - 6); ctx.lineWidth = 7; ctx.strokeStyle = '#f4a9c7'; ctx.stroke();
        rr(x - 9, FLOOR - 10, 18, 8, 4); ctx.fillStyle = '#8fe3cf'; ctx.fill();
      }
      // ตัวสายพาน
      ctx.beginPath(); ctx.moveTo(beltCA.x, beltCA.y); ctx.lineTo(beltCB.x, beltCB.y);
      ctx.lineWidth = BELT_T + 10; ctx.strokeStyle = '#f7bcd6'; ctx.stroke();
      ctx.lineWidth = BELT_T; ctx.strokeStyle = '#3b3550'; ctx.stroke();
      // ลายสายพานเลื่อน
      ctx.setLineDash([10, 12]); ctx.lineDashOffset = -beltOffset;
      ctx.lineWidth = BELT_T - 8; ctx.strokeStyle = '#4d4666'; ctx.stroke();
      ctx.setLineDash([]);
      // ลูกกลิ้ง
      for (let i = 0; i <= 4; i++) {
        const t = i / 4, x = beltCA.x + (beltCB.x - beltCA.x) * t, y = beltCA.y + (beltCB.y - beltCA.y) * t + BELT_T / 2 + 6;
        ctx.beginPath(); ctx.arc(x, y, 9, 0, 6.2832);
        const g = ctx.createRadialGradient(x - 3, y - 3, 1, x, y, 9); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#b99fe6');
        ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#8f7bc0'; ctx.stroke();
        ctx.save(); ctx.translate(x, y); ctx.rotate(-beltOffset / 9); ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.strokeStyle = '#8f7bc0'; ctx.stroke(); ctx.restore();
      }
    }
    function drawMachineImage() {
      let sx = 0, sy = 0;
      if (shakeT > 0) { sx = (Math.random() - .5) * 4; sy = (Math.random() - .5) * 3; }
      const W2 = SKIN.w * SKIN.k, H2 = SKIN.h * SKIN.k, bx = SKIN.x0 + W2 * 0.55;
      ctx.save(); ctx.translate(sx, sy);
      ctx.beginPath(); ctx.ellipse(bx, FLOOR - 2, W2 * 0.42, 12, 0, 0, 6.2832); ctx.fillStyle = 'rgba(120,90,160,.2)'; ctx.fill(); // เงาพื้น
      const sc = Juice.breathe(nowT, 0.01) + machinePunch.x;
      ctx.translate(bx, FLOOR); ctx.scale(1 - (sc - 1) * 0.5, sc); ctx.translate(-bx, -FLOOR);
      ctx.drawImage(skinImg.source, SKIN.x0, SKIN.y0, W2, H2);
      // สายพานเลื่อน: ตัดผิวสายพานจากรูปแล้วเลื่อนวนทีละช่วงแผ่น (~60px ในรูป) ให้แผ่นสายพานจริงขยับไปทางปลาย
      {
        const [b0, b1, f0, f1] = SKIN.belt.map(([px, py]) => fromSkin(px, py));
        const len = Math.hypot(b1.x - b0.x, b1.y - b0.y), dx = (b1.x - b0.x) / len, dy = (b1.y - b0.y) / len;
        const PERIOD = 60 * SKIN.k, o = ((beltOffset % PERIOD) + PERIOD) % PERIOD, cut = 1 - o / len;
        const lerp = (p, q, t) => ({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });
        const band = (t0, t1, shift) => { // วาดรูปเลื่อนไป shift ตามแนวสายพาน เฉพาะช่วง t0..t1 ของผิว
          const a = lerp(b0, b1, t0), b = lerp(b0, b1, t1), c = lerp(f0, f1, t1), d = lerp(f0, f1, t0);
          ctx.save(); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath(); ctx.clip();
          ctx.drawImage(skinImg.source, SKIN.x0 + dx * shift, SKIN.y0 + dy * shift, W2, H2); ctx.restore();
        };
        band(0, cut, -o);            // ผิวทั้งหมดเลื่อนไปทางปลาย (ซ้าย)
        band(cut, 1, PERIOD - o);    // ช่องว่างฝั่งเครื่อง เติมด้วยลายช่วงก่อนหน้า (วนต่อเนื่อง)
      }
      // จอ: รูปของขวัญล่าสุดเรืองแสง (ยังไม่มีของขวัญ = โชว์หัวใจพิกเซลในรูป)
      if (screenImg && screenImg.complete && screenImg.naturalWidth) {
        const cx = (SCREEN.x0 + SCREEN.x1) / 2, cy = (SCREEN.y0 + SCREEN.y1) / 2, sz = 44;
        rr(SCREEN.x0, SCREEN.y0, SCREEN.x1 - SCREEN.x0, SCREEN.y1 - SCREEN.y0, 6); ctx.fillStyle = 'rgba(40,30,70,.85)'; ctx.fill();
        Juice.aura(ctx, cx, cy, sz * 0.45, 1000, nowT);
        ctx.drawImage(screenImg, cx - sz / 2, cy - sz / 2, sz, sz);
      }
      // แผงหัวใจ: ยอดเพชร
      if (SHOW_COUNTER) {
        const c = fromSkin(SKIN.counter.px, SKIN.counter.py), label = '💎 ' + Overlay.fmt(diamonds);
        ctx.font = '20px Itim, sans-serif'; const tw = ctx.measureText(label).width;
        rr(c.x - tw / 2 - 12, c.y - 15, tw + 24, 30, 15); ctx.fillStyle = 'rgba(255,250,252,.95)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ff9ec7'; ctx.stroke();
        ctx.fillStyle = '#e8579b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, c.x, c.y + 1);
      }
      ctx.restore();
    }
    function drawMachine() {
      const { x0, x1, y0, y1, depth: d } = M, w = x1 - x0, h = y1 - y0;
      let sx = 0, sy = 0;
      if (shakeT > 0) { sx = (Math.random() - .5) * 4; sy = (Math.random() - .5) * 3; }
      ctx.save(); ctx.translate(sx, sy);
      // หายใจ + เด้งตอนปล่อยของ (ยืด/หดรอบฐานเครื่อง)
      const bx = (x0 + x1) / 2, sc = Juice.breathe(nowT, 0.01) + machinePunch.x;
      ctx.translate(bx, FLOOR); ctx.scale(1 - (sc - 1) * 0.5, sc); ctx.translate(-bx, -FLOOR);
      // เงา
      ctx.beginPath(); ctx.ellipse(x0 + w / 2 + d / 2, FLOOR - 2, w * .62, 12, 0, 0, 6.2832); ctx.fillStyle = 'rgba(120,90,160,.18)'; ctx.fill();
      // ขา
      // ขาหลัง 2 ขา (เยื้องตามความลึก) — วาดก่อนตัวตู้ สีเข้มกว่า
      for (const fx of [x0 + 22, x1 - 22]) { rr(fx - 13 + d * 0.8, y1 - d * 0.8, 26, FLOOR - y1 - 10, 8); ctx.fillStyle = '#a593e6'; ctx.fill(); }
      // ตัวตู้ 3 มิติ: ซ้อนชั้นมุมโค้งจากด้านหลังมาด้านหน้า (มุมโค้งเท่ากันทุกด้าน)
      for (let i = d; i > 0; i -= 1.5) {
        rr(x0 + i, y0 - i, w, h, 26);
        ctx.fillStyle = i > d - 3 ? '#efe2ff' : '#cdb9f6'; ctx.fill();
      }
      rr(x0 + d, y0 - d, w, h, 26); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
      // หูหิ้ว
      ctx.beginPath(); ctx.moveTo(x0 + 70, y0 - d / 2); ctx.lineTo(x0 + 70, y0 - 62); ctx.quadraticCurveTo(x0 + 70, y0 - 82, x0 + 92, y0 - 82);
      ctx.lineTo(x0 + 128, y0 - 82); ctx.quadraticCurveTo(x0 + 150, y0 - 82, x0 + 150, y0 - 62); ctx.lineTo(x0 + 150, y0 - d / 2);
      ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.strokeStyle = '#b9a6f2'; ctx.stroke();
      // ขาหน้า 2 ขา
      for (const fx of [x0 + 22, x1 - 22]) { rr(fx - 14, y1 - 12, 28, FLOOR - y1 + 10, 8); ctx.fillStyle = '#b9a6f2'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.stroke(); }
      // หน้า
      rr(x0, y0, w, h, 26);
      const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, '#c5f0f2'); g.addColorStop(.5, '#e7dafc'); g.addColorStop(1, '#ffe1ef');
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      // แถบฐาน
      rr(x0 + 8, y1 - 34, w - 16, 26, 12); ctx.fillStyle = '#d2bdf7'; ctx.fill();
      // ช่องปล่อย
      rr(MOUTH.x0, MOUTH.y0, MOUTH.x1 - MOUTH.x0, MOUTH.y1 - MOUTH.y0, 18);
      const mg = ctx.createLinearGradient(0, MOUTH.y0, 0, MOUTH.y1); mg.addColorStop(0, '#2c2740'); mg.addColorStop(1, '#4a4268');
      ctx.fillStyle = mg; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      // จอ
      rr(SCREEN.x0, SCREEN.y0, SCREEN.x1 - SCREEN.x0, SCREEN.y1 - SCREEN.y0, 18);
      const sg = ctx.createLinearGradient(0, SCREEN.y0, 0, SCREEN.y1); sg.addColorStop(0, '#d9f4ff'); sg.addColorStop(1, '#efe4ff');
      ctx.fillStyle = sg; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      const scx = (SCREEN.x0 + SCREEN.x1) / 2, scy = (SCREEN.y0 + SCREEN.y1) / 2 - 6;
      if (screenImg && screenImg.complete && screenImg.naturalWidth) ctx.drawImage(screenImg, scx - 32, scy - 32, 64, 64);
      else { ctx.font = '44px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(screenEmoji, scx, scy); }
      // แถบเป้าหมาย
      const pct = Math.min(1, diamonds / GOAL);
      rr(SCREEN.x0 + 12, SCREEN.y1 - 20, SCREEN.x1 - SCREEN.x0 - 24, 10, 5); ctx.fillStyle = 'rgba(157,134,232,.25)'; ctx.fill();
      if (pct > 0) { rr(SCREEN.x0 + 12, SCREEN.y1 - 20, (SCREEN.x1 - SCREEN.x0 - 24) * pct, 10, 5); ctx.fillStyle = '#ff6aa8'; ctx.fill(); }
      // ตัวเลขเพชรบนหน้าเครื่อง (ใต้จอ)
      if (SHOW_COUNTER) {
        const label = '💎 ' + Overlay.fmt(diamonds);
        ctx.font = '22px Itim, sans-serif'; const tw = ctx.measureText(label).width;
        const cx = (SCREEN.x0 + SCREEN.x1) / 2, cy = SCREEN.y1 + 28;
        rr(cx - tw / 2 - 14, cy - 17, tw + 28, 34, 17); ctx.fillStyle = '#fffafc'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffcf5c'; ctx.stroke();
        ctx.fillStyle = '#f5a623'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, cx, cy + 1);
      }
      // ป้าย
      rr(x0 + 14, y0 + 14, 120, 30, 15); ctx.fillStyle = '#fffafc'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ff93c0'; ctx.stroke();
      ctx.font = '16px Itim, sans-serif'; ctx.fillStyle = '#ff6aa8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('♡ VJLiveKit', x0 + 74, y0 + 30);
      ctx.restore();
    }
    function drawBody(b) {
      if (b.life > 0.5) Juice.aura(ctx, b.x, b.y, b.r, b.d, nowT);
      const q = b.sq ? Math.max(-0.35, Math.min(0.35, b.sq.x)) : 0;
      ctx.save(); ctx.globalAlpha = b.life; ctx.translate(b.x, b.y + b.r * -q * 0.5); ctx.scale(1 - q, 1 + q); ctx.rotate(b.rot);
      const st = Juice.sticker ? Juice.sticker(b.img, b.r * 2.2 * S * DPR) : null; // สติกเกอร์คมชัด ขอบขาว + เงานุ่ม
      if (st) { const s = b.r * 2.2 * Juice.STICKER_PAD; ctx.drawImage(st, -s / 2, -s / 2, s, s); }
      else if (b.img && b.img.complete && b.img.naturalWidth) { const s = b.r * 2.2; ctx.drawImage(b.img, -s / 2, -s / 2, s, s); }
      else {
        const r = b.r, g = ctx.createRadialGradient(-r * .3, -r * .3, r * .2, 0, 0, r);
        g.addColorStop(0, '#fff6cf'); g.addColorStop(.55, '#ffcf5c'); g.addColorStop(1, '#f5a623');
        ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fillStyle = g; ctx.fill();
        ctx.font = Math.round(r * 1.2) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.e, 0, 1);
      }
      ctx.restore();
    }

    // ฟิสิกส์เดินตามเวลาจริง (ชดเชยเฟรมที่หาย เช่น OBS ซ่อน source)
    let lastT = performance.now(), acc = 0;
    function tick() {
      const now = performance.now(); acc += Math.min(4000, now - lastT); lastT = now;
      let n = 0; while (acc >= 16.7 && n < 240) { step(); beltOffset += BELT_V; if (shakeT > 0) shakeT--; acc -= 16.7; n++; }
      if (n === 240) acc = 0;
    }
    setInterval(() => { if (document.hidden) tick(); }, 250);
    function frame() {
      tick();
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H); ctx.imageSmoothingQuality = 'high';
      ctx.translate(TX, TY); ctx.scale(S, S);
      nowT = performance.now() / 1000;
      if (SKIN && skinImg.ready()) {
        drawMachineImage();
        for (const b of bodies) drawBody(b);
      } else {
        drawBelt();
        for (const b of bodies) drawBody(b);
        drawMachine();
      }
      fx.draw(ctx);
      requestAnimationFrame(frame);
    }

    // ---- ตัวเลข / ผู้ส่ง ----
    let diamonds = 0;
    const $dia = document.getElementById('dia'), $gifter = document.getElementById('gifter'), $ava = document.getElementById('gAva'), $nm = document.getElementById('gNm');
    const cols = ['#ff93c0', '#b9a6f2', '#8fe3cf', '#ffcf5c', '#ff6aa8', '#9d86e8'];
    function updateDia() { $dia.textContent = Overlay.fmt(diamonds); }
    let gifterT = null;
    function showGifter(user) {
      const nm = (user && (user.nickname || user.uniqueId)) || 'ผู้ชม';
      const ava = user && /^https:\/\//.test(user.avatar || '') ? user.avatar : '';
      $ava.style.backgroundImage = ava ? `url("${ava.replace(/"/g, '')}")` : '';
      $ava.style.backgroundColor = ava ? '#fff' : cols[nm.charCodeAt(0) % cols.length];
      $ava.textContent = ava ? '' : nm[0];
      $nm.textContent = nm;
      const p = toScreen((SCREEN.x0 + SCREEN.x1) / 2, M.y0 - 130);
      $gifter.style.left = p.x + 'px'; $gifter.style.top = Math.max(4, p.y) + 'px';
      $gifter.classList.add('show'); clearTimeout(gifterT); gifterT = setTimeout(() => $gifter.classList.remove('show'), 2800);
    }

    // ---- จำกองไว้ (รีเฟรช OBS แล้วกองเดิมกลับมา) ----
    const KEY = 'vjl-coinjar2:' + (P('t', '') || P('username', 'demo')).slice(-24);
    let saveT = null;
    // จำกอง + ยอดเพชร + รหัสไลฟ์ (ยอดจากเซิร์ฟเวอร์เริ่ม 0 ใหม่ทุกครั้งที่รีสตาร์ท → ใช้ค่าที่มากกว่า, ไลฟ์ใหม่ → เริ่มนับใหม่)
    let roomId = null;
    let restoreUntil = 0;
    function saveNow() { if (performance.now() < restoreUntil) return; try { localStorage.setItem(KEY, JSON.stringify({ g: bodies.filter((b) => !b.dying).map((b) => b.src), d: diamonds, room: roomId })); } catch { /* storage ปิด */ } }
    function save() { clearTimeout(saveT); saveT = setTimeout(saveNow, 500); }
    addEventListener('pagehide', () => { clearTimeout(saveT); saveNow(); }); // รีโหลด (deploy ใหม่)/ปิด → บันทึกทันที
    function restore() {
      if (P('reset', '0') === '1') { try { localStorage.removeItem(KEY); } catch { /* ignore */ } return false; }
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) || '[]'), list = Array.isArray(raw) ? raw : (raw.g || []);
        if (!Array.isArray(raw)) { diamonds = raw.d || 0; roomId = raw.room || null; }
        const keep = list.slice(-MAX); restoreUntil = performance.now() + keep.length * 6 + 300;
        keep.forEach((g, i) => setTimeout(() => addBody(g, 'restore'), i * 6)); return list.length > 0;
      }
      catch { return false; }
    }

    const EMOJI = { Rose: '🌹', 'Finger Heart': '🫰', Perfume: '🧴', Galaxy: '🌌', Lion: '🦁', Universe: '🪐', Heart: '❤️', TikTok: '🎵' };
    function onGift(e) {
      const count = e.repeatCount || 1, unit = e.diamondCount || 0, value = e.totalValue || unit * count;
      diamonds += value; updateDia(); save(); shakeT = 24; showGifter(e.user);
      machinePunch.kick(-0.9); // ยุบก่อนปล่อย แล้วเด้งเกิน
      if (unit >= 1000) fx.confetti((SCREEN.x0 + SCREEN.x1) / 2, M.y0 - 20, 50);
      screenImg = giftImg(e.giftImage); screenEmoji = EMOJI[e.giftName] || '🎁';
      const g = { u: e.giftImage || '', e: screenEmoji, d: unit };
      for (let i = 0; i < Math.min(count, 30); i++) setTimeout(() => { addBody(g); save(); }, i * 160);
      if (SKIN && SKIN.music && fx.notes) fx.notes((SCREEN.x0 + SCREEN.x1) / 2, SCREEN.y0, unit >= 100 ? 6 : 3); // ตู้คาราโอเกะ: โน้ตลอยจากจอ
    }

    let prefilled = false;
    function onStats(s) {
      if (!s || typeof s.diamondCount !== 'number') return;
      diamonds = Math.max(diamonds, s.diamondCount); updateDia(); save();
      if (prefilled) return; prefilled = true;
      // ไม่มีกองในความจำแต่ไลฟ์มีเพชรแล้ว → เติมเหรียญตามยอด
      if (!bodies.length && diamonds > 0) for (let i = 0; i < Math.min(120, Math.ceil(Math.sqrt(diamonds) * 2)); i++) addBody({ u: '', e: '🪙', d: 1 }, 'restore');
    }
    Overlay.on('event', (e) => { if (e.type === 'gift' && !e.streaking) { prefilled = true; onGift(e); } });
    Overlay.on('state', (s) => {
      if (s && s.roomId && roomId && s.roomId !== roomId) diamonds = 0; // ไลฟ์ใหม่ → นับเพชรใหม่ (กองยังอยู่จนกดล้าง)
      if (s && s.roomId) roomId = s.roomId;
      onStats(s && s.stats);
    });
    Overlay.on('stats', onStats);

    addEventListener('resize', resize); resize();
    if (restore()) prefilled = true;
    updateDia();
    requestAnimationFrame(frame);

    // ---- เดโม (เปิดไฟล์ตรง ๆ / ?demo=1) ----
    if (!Overlay.connected) {
      const names = ['somchai', 'mimi', 'บิ๊ก', 'lisa', 'ต้นน้ำ'];
      const gifts = [['Rose', 1], ['Finger Heart', 5], ['Perfume', 20], ['TikTok', 1], ['Galaxy', 1000], ['Lion', 2999]];
      setInterval(() => {
        const g = gifts[Math.floor(Math.random() * gifts.length)], nm = names[Math.floor(Math.random() * names.length)];
        onGift({ type: 'gift', user: { uniqueId: nm, nickname: nm, avatar: '' }, giftName: g[0], diamondCount: g[1], repeatCount: g[1] >= 1000 ? 1 : 1 + Math.floor(Math.random() * 3) });
      }, 1500);
    }
  })();
  </script>
