<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FX Overlay</title>
<link rel="icon" href="favicon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Itim&display=swap');
  html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Itim',sans-serif; }
  #fx { position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; }
  .media { max-width:70vw; max-height:70vh; border-radius:20px; box-shadow:0 20px 50px rgba(0,0,0,.4);
    animation:pop .4s cubic-bezier(.2,1.4,.4,1); }
  .text { font-size:48px; color:#fff; text-align:center; padding:20px 40px; border-radius:24px;
    background:linear-gradient(135deg,#ff93c0,#9d86e8); box-shadow:0 16px 40px rgba(120,80,150,.45);
    animation:pop .4s cubic-bezier(.2,1.4,.4,1); max-width:80vw; }
  @keyframes pop { from{transform:scale(.5);opacity:0;} to{transform:scale(1);opacity:1;} }
  @keyframes fade { to{opacity:0;transform:scale(.96);} }
  #armBtn { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); pointer-events:auto;
    font-family:'Itim',sans-serif; font-size:15px; border:none; cursor:pointer; padding:9px 18px; border-radius:999px;
    color:#fff; background:linear-gradient(135deg,#b9a6f2,#9d86e8); box-shadow:0 6px 14px rgba(150,120,180,.3); }
  /* ---- ไพ่ทาโร่ ---- */
  .tarot { position:fixed; left:50%; top:50%; width:260px; transform:translate(-50%,-50%); text-align:center; color:#fff;
    animation:tIn .7s cubic-bezier(.2,1.3,.4,1) both; perspective:1200px; }
  .tarot .who { font-size:24px; margin-bottom:10px; text-shadow:0 2px 6px rgba(0,0,0,.7); }
  .tcard { position:relative; width:260px; height:430px; transform-style:preserve-3d; animation:tFlip 1.1s .7s cubic-bezier(.5,0,.2,1) both; }
  .tface { position:absolute; inset:0; border-radius:20px; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden;
    box-shadow:0 20px 50px rgba(30,10,60,.55), 0 0 0 4px #e9c97a inset, 0 0 0 9px #2a1a4a inset, 0 0 0 11px #e9c97a inset; }
  .tback { background:radial-gradient(circle at 50% 50%, #5a3a9a 0, #2a1650 60%, #170b30 100%); display:grid; place-items:center; }
  .tback::before { content:'✦'; font-size:120px; color:#e9c97a; text-shadow:0 0 20px rgba(233,201,122,.8); }
  .tback::after { content:''; position:absolute; inset:24px; border-radius:14px; border:2px dashed rgba(233,201,122,.55); }
  .tfront { transform:rotateY(180deg); background:linear-gradient(180deg,#fff8ea,#f6e7c8); color:#3a2350; display:flex; flex-direction:column; align-items:center; padding:26px 20px; box-sizing:border-box; }
  .tfront .num { font-size:26px; color:#9a6b1f; letter-spacing:2px; }
  .tfront .sym { font-size:120px; line-height:1; margin:18px 0 10px; filter:drop-shadow(0 6px 10px rgba(120,80,40,.3)); }
  .tfront .th { font-size:34px; font-weight:bold; }
  .tfront .en { font-size:16px; color:#8a6aa8; margin-top:2px; }
  .tfront .mean { font-size:19px; margin-top:16px; line-height:1.35; }
  .tarot .extra { font-size:22px; margin-top:12px; text-shadow:0 2px 6px rgba(0,0,0,.7); animation:tPop .5s 1.7s both; }
  .tglow { position:absolute; left:50%; top:50%; width:520px; height:520px; transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,226,150,.55), rgba(255,226,150,0) 65%); animation:tGlow 1.6s 1.3s ease-out both; z-index:-1; }
  @keyframes tIn { from { transform:translate(-50%,40vh) scale(.6) rotate(-12deg); opacity:0; } to { transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1; } }
  @keyframes tFlip { 0% { transform:rotateY(0) } 100% { transform:rotateY(180deg) } }
  @keyframes tGlow { from { opacity:0; transform:translate(-50%,-50%) scale(.3) } 40% { opacity:1 } to { opacity:0; transform:translate(-50%,-50%) scale(1.3) } }
  @keyframes tPop { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
</style>
</head>
<body>
  <div id="fx"></div>
  <button id="armBtn">🔊 เปิดเสียง FX (คลิกครั้งเดียว)</button>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script>
  (function(){
    const fx=document.getElementById('fx'), armBtn=document.getElementById('armBtn');
    let audioArmed=false;
    armBtn.style.display='none';
    armBtn.addEventListener('click',()=>{ audioArmed=true; armBtn.textContent='✅ พร้อมเล่น FX'; armBtn.disabled=true; setTimeout(()=>armBtn.style.display='none',1200); });

    function clearLater(el,ms){ setTimeout(()=>{ el.style.animation='fade .4s forwards'; setTimeout(()=>el.remove(),400); }, ms||4000); }

    // แทน {user} ด้วยชื่อคนที่ทำให้เกิดเหตุการณ์
    function fill(text,ev){ const u=ev&&ev.user?(ev.user.nickname||ev.user.uniqueId):''; return String(text||'').replace(/\{user\}/g,u); }
    function showText(text,dur){ const t=document.createElement('div'); t.className='text'; t.textContent=text; fx.appendChild(t); clearLater(t,dur); }

    // ---- ไพ่ทาโร่ (Major Arcana 22 ใบ) — ต่อคิวเปิดทีละใบ ----
    const TAROT=[
      ['0','คนโง่','The Fool','🃏','การเริ่มต้นใหม่ กล้าลองสิ่งใหม่ โอกาสดีกำลังมา'],
      ['I','นักมายากล','The Magician','🪄','พลังสร้างสรรค์เต็มเปี่ยม ลงมือทำอะไรก็สำเร็จ'],
      ['II','นักบวชหญิง','The High Priestess','🌙','สัญชาตญาณแม่นยำ ฟังเสียงหัวใจตัวเอง'],
      ['III','จักรพรรดินี','The Empress','👑','ความอุดมสมบูรณ์ ความรักและโชคลาภงอกงาม'],
      ['IV','จักรพรรดิ','The Emperor','🏛️','มั่นคง เป็นผู้นำ คุมเกมได้ทุกสถานการณ์'],
      ['V','พระสังฆราช','The Hierophant','📜','จะได้คำแนะนำดี ๆ จากคนที่หวังดี'],
      ['VI','คู่รัก','The Lovers','💞','ความรักหวานซึ้ง การเลือกที่ใช่สำหรับคุณ'],
      ['VII','รถศึก','The Chariot','🏇','ชัยชนะอยู่ไม่ไกล มุ่งหน้าต่อไปอย่าหยุด'],
      ['VIII','พลัง','Strength','🦁','เข้มแข็งจากข้างใน ใจเย็นแต่หนักแน่น'],
      ['IX','ฤๅษี','The Hermit','🏮','ช่วงเวลาทบทวน คำตอบอยู่ในตัวคุณเอง'],
      ['X','กงล้อแห่งโชคชะตา','Wheel of Fortune','🎡','โชคหมุนมาหา จังหวะชีวิตกำลังดีขึ้น'],
      ['XI','ความยุติธรรม','Justice','⚖️','สิ่งดีที่ทำไว้ กำลังจะได้รับผลตอบแทน'],
      ['XII','คนแขวน','The Hanged Man','🙃','ลองมองมุมใหม่ แล้วจะเห็นทางออก'],
      ['XIII','การเปลี่ยนแปลง','Death','🦋','ปิดฉากเก่า เปิดบทใหม่ที่ดีกว่าเดิม'],
      ['XIV','ความพอดี','Temperance','🏺','ชีวิตสมดุล ทุกอย่างลงตัวพอดี'],
      ['XV','ปีศาจ','The Devil','😈','ระวังสิ่งล่อใจ แล้วคุณจะเป็นอิสระ'],
      ['XVI','หอคอย','The Tower','🗼','เรื่องเซอร์ไพรส์ เปิดทางสู่สิ่งใหม่'],
      ['XVII','ดวงดาว','The Star','⭐','ความหวังเป็นจริง สิ่งที่ขอกำลังจะสมหวัง'],
      ['XVIII','ดวงจันทร์','The Moon','🌕','ฝันดี จินตนาการพาไปไกล ใช้ใจนำทาง'],
      ['XIX','ดวงอาทิตย์','The Sun','☀️','ความสุข ความสำเร็จ พลังบวกเต็มร้อย'],
      ['XX','การพิพากษา','Judgement','📯','การตื่นรู้ และโอกาสครั้งใหม่'],
      ['XXI','โลก','The World','🌍','สำเร็จสมบูรณ์ ครบทุกด้าน'],
    ];
    const tarotQ=[]; let tarotBusy=false;
    function tarot(a,ev){ tarotQ.push([a,ev]); if(!tarotBusy) nextTarot(); }
    function nextTarot(){
      const job=tarotQ.shift(); if(!job){ tarotBusy=false; return; } tarotBusy=true;
      const [a,ev]=job, dur=Math.max(5000,a.durationMs||8000), c=TAROT[Math.floor(Math.random()*TAROT.length)];
      const u=ev&&ev.user?(ev.user.nickname||ev.user.uniqueId):'';
      const el=document.createElement('div'); el.className='tarot';
      const who=document.createElement('div'); who.className='who'; who.textContent=u?`🔮 ไพ่ของ ${u}`:'🔮 ไพ่ของคุณ'; el.appendChild(who);
      const card=document.createElement('div'); card.className='tcard';
      card.innerHTML='<div class="tglow"></div><div class="tface tback"></div><div class="tface tfront"><div class="num"></div><div class="sym"></div><div class="th"></div><div class="en"></div><div class="mean"></div></div>';
      const f=card.querySelector('.tfront'); f.querySelector('.num').textContent=c[0]; f.querySelector('.sym').textContent=c[3];
      f.querySelector('.th').textContent=c[1]; f.querySelector('.en').textContent=c[2]; f.querySelector('.mean').textContent=c[4];
      el.appendChild(card);
      const extra=fill(a.text,ev); if(extra){ const x=document.createElement('div'); x.className='extra'; x.textContent=extra; el.appendChild(x); }
      fx.appendChild(el);
      setTimeout(()=>{ el.style.animation='fade .5s forwards'; setTimeout(()=>{ el.remove(); nextTarot(); },500); }, dur);
    }

    function play(a,ev){
      if(a.type==='tarot') return tarot(a,ev);
      const dur=a.durationMs||5000;
      const text=fill(a.text,ev);
      if(a.type==='sound' && a.url){
        // OBS อนุญาต autoplay อยู่แล้ว — ถ้าเบราว์เซอร์บล็อกค่อยให้กดปุ่มเปิดเสียง
        const au=new Audio(a.url); au.play().catch(()=>{ if(!audioArmed) armBtn.style.display='block'; });
      }
      else if(a.type==='image' && a.url){ const img=document.createElement('img'); img.src=a.url; img.className='media'; fx.appendChild(img); clearLater(img,dur); }
      else if(a.type==='video' && a.url){ const v=document.createElement('video'); v.src=a.url; v.autoplay=true; v.playsInline=true; v.className='media'; fx.appendChild(v);
        v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); if(!audioArmed) armBtn.style.display='block'; }); v.onended=()=>v.remove(); clearLater(v,dur); }
      if(text) showText(text,dur);
    }

    // รับ action จากเซิร์ฟเวอร์ (Actions & Events engine)
    Overlay.on('action',(fire)=>play(fire.action,fire.event));

    // demo fallback — จำลองกฎ "ได้ Galaxy -> โชว์ข้อความ"
    if(!Overlay.connected){
      const samples=[{type:'text',text:'🎉 ขอบคุณสำหรับ Galaxy!'},{type:'tarot',durationMs:7000},{type:'text',text:'🔥 ปังมาก!'}];
      setInterval(()=>play(samples[Math.floor(Math.random()*samples.length)],{user:{nickname:'mimi'}}), 5000);
    }
  })();
  </script>
</body>
</html>
