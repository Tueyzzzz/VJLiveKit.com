<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VJ Mascot Overlay</title>
<link rel="icon" href="favicon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@600;700&display=swap');
  html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Mali','Itim',sans-serif; }
  /* ตัวละคร: กล่องสูง 420px คูณ --s · ยึดมุมตาม pos */
  #wrap { position:fixed; left:0; right:0; bottom:0; display:flex; align-items:flex-end; padding:0 10px; pointer-events:none; }
  .bl #wrap { justify-content:flex-start; } .br #wrap { justify-content:flex-end; } .bc #wrap { justify-content:center; }
  #stage { position:relative; width:420px; height:470px; zoom:var(--s,1); }
  /* ขยับทั้งหมดคุมด้วย JS (requestAnimationFrame + เวลาจริง) — ไม่ใช้ CSS keyframes เพื่อให้ท่าต่อกันเนียน
     คมชัด: ไม่ใส่ will-change ค้างไว้ (Chrome จะ rasterize ครั้งเดียวแล้วยืดภาพ = เบลอ) · walker ใส่เฉพาะตอนกำลังเดิน · y ปัดเป็นพิกเซลจอ */
  #walker { position:absolute; left:0; right:0; bottom:0; height:420px; transform-origin:50% 100%; }
  #walker.moving { will-change:transform; }
  #shadow { position:absolute; left:50%; bottom:6px; width:230px; height:30px; margin-left:-115px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(70,30,90,.32), rgba(70,30,90,0)); }
  #body { position:absolute; inset:0; transform-origin:50% calc(100% - 10px); }
  #char { position:absolute; left:50%; bottom:10px; width:420px; height:420px; margin-left:-210px; filter:drop-shadow(0 6px 10px rgba(80,40,110,.25)); }
  #char img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; visibility:hidden; }
  #char img.vis { visibility:visible; }
  #char.video img:not(.vid) { display:none; }
  #char img.vid { visibility:visible; opacity:0; transition:opacity .16s ease-in-out; }
  #char:not(.video) img.vid { display:none; } /* หมุนรอบตัวในโหมดวิดีโอ: ซ่อนคลิปชั่วคราว */

  /* ของขวัญในมือ (ท่ารับของขวัญ) */
  #gift { position:absolute; left:50%; top:var(--gy,58%); width:92px; height:92px; margin:-46px 0 0 -46px; object-fit:contain; opacity:0; pointer-events:none;
    filter:drop-shadow(0 4px 8px rgba(255,180,220,.8)) drop-shadow(0 0 14px rgba(255,255,255,.9)); transition:opacity .18s ease-out; }
  #gift.on { opacity:1; } /* ตำแหน่ง/แกว่ง/ตกลงมือ = วัตถุติดสปริงแยกจากตัว (JS) */
  /* ชั้นของตกแต่ง (ประกาย/หัวใจ/คอนเฟตติ): ตามตัวแบบมีความเฉื่อย (สปริงอ่อน) */
  #deco { position:absolute; inset:0; pointer-events:none; }

  /* กล่องคำพูด */
  #bubble { position:absolute; left:50%; bottom:430px; transform:translateX(-50%) scale(.6); opacity:0; max-width:360px; width:max-content;
    padding:12px 18px; border-radius:22px; background:linear-gradient(180deg,#fff,#fff3fa); border:3px solid #ffc6e2; color:#7a3f6e;
    font-size:21px; font-weight:700; line-height:1.35; text-align:center; box-shadow:0 8px 22px rgba(200,90,160,.25); transition:all .35s cubic-bezier(.3,1.5,.5,1); }
  #bubble::after { content:''; position:absolute; left:50%; bottom:-14px; margin-left:-12px; border:12px solid transparent; border-top-color:#ffc6e2; border-bottom:0; }
  #bubble.on { opacity:1; transform:translateX(-50%) scale(1); }
  #bubble b { color:#e0468e; }
  .br #bubble { left:auto; right:30px; transform:scale(.6); transform-origin:85% 100%; } .br #bubble.on { transform:scale(1); } .br #bubble::after { left:auto; right:60px; }
  .bl #bubble { left:30px; transform:scale(.6); transform-origin:15% 100%; } .bl #bubble.on { transform:scale(1); } .bl #bubble::after { left:60px; }

  /* ป้ายชื่อ */
  #name { position:absolute; left:50%; bottom:2px; transform:translateX(-50%); padding:3px 14px; border-radius:999px; font-size:15px; font-weight:700; color:#fff;
    background:linear-gradient(90deg,#ff8ac2,#b28bff); box-shadow:0 3px 10px rgba(180,80,160,.3); white-space:nowrap; }

  /* ประกายระยิบระยับ (ดาว 4 แฉก เรืองแสง) */
  .tw { position:absolute; width:var(--z,16px); height:var(--z,16px); pointer-events:none; background:var(--c,#fff);
    clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%); filter:drop-shadow(0 0 6px var(--c,#fff)) drop-shadow(0 0 14px rgba(255,255,255,1)) brightness(1.15);
    animation:twinkle var(--d,1.4s) ease-in-out forwards; }
  .tw.dot { clip-path:circle(50%); }
  @keyframes twinkle { 0% { opacity:0; transform:scale(.2) rotate(0deg) } 35% { opacity:1; transform:scale(1) rotate(25deg) } 65% { opacity:.9; transform:scale(.75) rotate(45deg) } 100% { opacity:0; transform:scale(.1) rotate(90deg) translateY(-14px) } }
  /* อนุภาค */
  .p { position:absolute; pointer-events:none; font-size:26px; animation:rise var(--d,1.8s) ease-out forwards; }
  @keyframes rise { 0% { opacity:0; transform:translate(0,0) scale(.4) } 15% { opacity:1 } 100% { opacity:0; transform:translate(var(--x,0),-220px) scale(1.2) rotate(var(--r,0deg)) } }
  .cf { position:absolute; width:10px; height:14px; border-radius:3px; pointer-events:none; animation:conf var(--d,1.6s) ease-out forwards; }
  @keyframes conf { 0% { opacity:1; transform:translate(0,0) rotate(0) } 100% { opacity:0; transform:translate(var(--x),var(--y)) rotate(var(--r)) } }
</style>
</head>
<body>
  <div id="wrap"><div id="stage"><div id="walker">
    <div id="bubble"></div>
    <div id="shadow"></div>
    <div id="body"><div id="char"></div><img id="gift" alt="" /></div>
    <div id="name" hidden></div>
    <div id="deco"></div>
  </div></div></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script src="js/collect-store.js"></script>
  <script>
  (function () {
    // ตัวแทนวีเจ (มาสคอต) — ยืนมุมจอ หายใจ กะพริบตา ผมปลิว · ได้กิฟต์ยื่นมือรับ (รูปกิฟต์จริง) + ขอบคุณ · กิฟต์ใหญ่ดีใจแล้วเต้น
    // มีคนติดตามส่งหัวใจ · Action "มาสคอต" สั่งเต้น / เดินมาส่งจุ๊บ / ดีใจ / ส่งหัวใจ ได้จากกฎ
    // ?tint=0 (หมุนเฉดสีชุด/ผม) · ?char=G1 · ?pos=br|bl|bc · ?scale=1 · ?thanks=1 · ?thankText=… · ?big=100 · ?follow=1 · ?name=
    const P = (k, d) => Overlay.param(k, d);
    const CHARS = ['G1', 'G2', 'G4', 'G6', 'G8', 'G11', 'B4', 'B7', 'B8', 'B10', 'R1', 'R2', 'R3', 'R4', 'R6', 'R8', 'R10', 'R12', 'R14', 'R5', 'R7', 'R16', 'R18', 'R9', 'R20', 'R11', 'R13', 'A2', 'R15', 'A3', 'R17'];
    const C = CHARS.includes(P('char', 'G1')) || /^C[A-Za-z0-9]{2,24}$/.test(P('char', '')) ? P('char', 'G1') : 'G1'; // C… = มาสคอตสั่งทำ
    const POS = ['bl', 'br', 'bc'].includes(P('pos', 'br')) ? P('pos', 'br') : 'br';
    document.body.className = POS;
    document.documentElement.style.setProperty('--s', Math.max(.3, Math.min(3, parseFloat(P('scale', '1')) || 1)));
    const THANKS = P('thanks', '1') !== '0', FOLLOW = P('follow', '1') !== '0', BIG = Math.max(1, parseInt(P('big', '100'), 10) || 100);
    const THANK_TEXT = P('thankText', 'ขอบคุณ {user} ที่ส่ง {gift} นะคะ 💖');
    const FOLLOW_TEXT = P('followText', 'ขอบคุณ {user} ที่ติดตามน้า 😘');
    const NAME = P('name', '');
    if (NAME) { const n = document.getElementById('name'); n.textContent = NAME; n.hidden = false; }

    // โหลดทุกท่าไว้ก่อน (สลับท่าไม่กระพริบ)
    const $char = document.getElementById('char'), $bubble = document.getElementById('bubble'), $gift = document.getElementById('gift'), $walker = document.getElementById('walker'), $stage = document.getElementById('stage');
    const imgs = {};
    const TINT = ((parseFloat(P('tint', '0')) || 0) % 360 + 360) % 360;
    // เปลี่ยนสี: หมุนเฉดสีเฉพาะส่วนที่สีสด (ชุด ผม ของประดับ) — ข้ามโทนผิว (ส้มอ่อน ๆ) และสีขาว/เทา
    function recolor(src) {
      return new Promise((ok) => {
        const im = new Image(); im.crossOrigin = 'anonymous';
        im.onload = () => {
          try {
            const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
            const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0);
            const d = x.getImageData(0, 0, c.width, c.height), a = d.data, sh = TINT / 360;
            for (let i = 0; i < a.length; i += 4) {
              if (a[i + 3] < 8) continue;
              const r = a[i] / 255, g = a[i + 1] / 255, b = a[i + 2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, dl = mx - mn;
              if (dl < 0.08) continue; // ขาว/เทา/ดำ
              const s = dl / (1 - Math.abs(2 * l - 1));
              let h = mx === r ? ((g - b) / dl) % 6 : mx === g ? (b - r) / dl + 2 : (r - g) / dl + 4; h /= 6; if (h < 0) h += 1;
              const sv = dl / mx; // ความสดแบบ HSV (ผิวสีอ่อนมากจะไม่ถูกนับว่าสีจัด)
              if ((h <= 0.14 || h >= 0.96) && sv < 0.5 && mx > 0.55) continue; // โทนผิว (รวมแก้มแดง)
              if (h > 0.02 && h < 0.12 && sv < 0.62 && mx > 0.4) continue; // ผิวส่วนเงา
              h = (h + sh) % 1;
              const q = l < .5 ? l * (1 + s) : l + s - l * s, p2 = 2 * l - q;
              const f = (t) => { t = (t + 1) % 1; return t < 1 / 6 ? p2 + (q - p2) * 6 * t : t < .5 ? q : t < 2 / 3 ? p2 + (q - p2) * (2 / 3 - t) * 6 : p2; };
              a[i] = f(h + 1 / 3) * 255; a[i + 1] = f(h) * 255; a[i + 2] = f(h - 1 / 3) * 255;
            }
            x.putImageData(d, 0, 0); ok(c.toDataURL('image/webp', .9));
          } catch (e) { ok(src); }
        };
        im.onerror = () => ok(src); im.src = src;
      });
    }
    // ถอดรหัสภาพไว้ล่วงหน้า: ไม่งั้นครั้งแรกที่ท่าโผล่ Chrome จะถอดรหัสทีหลัง → เห็นเงาเทา/ว่างแวบหนึ่งตอนจาง
    const warm = (im) => { if (im.decode) im.decode().catch(() => {}); };
    for (let n = 1; n <= 17; n++) {
      const im = new Image(), src = `mascot/${C}/${n}.webp?v=${encodeURIComponent(window.VJL_VERSION || '1')}`; im.alt = ''; $char.appendChild(im); imgs[n] = im;
      im.onload = () => warm(im);
      if (TINT) recolor(src).then((u) => { im.src = u; }); else im.src = src;
    }
    // ท่าหันรอบตัว 8 ทิศ (18–24 = เฉียงขวา → ข้าง → เฉียงหลัง → หลัง → เฉียงหลังซ้าย → ข้างซ้าย → เฉียงซ้าย)
    // ตัวที่มีครบ → หมุนตัวแบบ 3D เนียน ๆ · ไม่มี → ใช้ท่าหมุนแบบเดิม
    let TURN = 0;
    for (let n = 18; n <= 24; n++) {
      const im = new Image(); im.alt = '';
      const src = `mascot/${C}/${n}.webp?v=${encodeURIComponent(window.VJL_VERSION || '1')}`;
      // เปลี่ยนสี (tint) ด้วย → ย้อมสีเฟรมหมุนแบบเดียวกับท่าอื่น ไม่งั้นหมุนแล้วสีเพี้ยน
      const probe = new Image(); probe.onload = () => {
        im.onload = () => { $char.appendChild(im); imgs[n] = im; TURN++; warm(im); };
        if (TINT) recolor(src).then((u) => { im.src = u; }); else im.src = src;
      }; probe.src = src;
    }
    // ท่าหันรอบตัวแบบละเอียด 16 ทิศ: 25–32 = มุมกึ่งกลาง 22.5° · 67.5° · … · 337.5° (แทรกระหว่าง 1,18–24)
    // โหลดผ่านเส้นทางเดียวกัน (probe + ย้อมสี tint) · ขาดเฟรมไหน → ช่วงนั้นจางข้าม 45° แบบ 8 ทิศเดิม
    for (let n = 25; n <= 32; n++) {
      const im = new Image(); im.alt = '';
      const src = `mascot/${C}/${n}.webp?v=${encodeURIComponent(window.VJL_VERSION || '1')}`;
      const probe = new Image(); probe.onload = () => {
        im.onload = () => { $char.appendChild(im); imgs[n] = im; warm(im); };
        if (TINT) recolor(src).then((u) => { im.src = u; }); else im.src = src;
      }; probe.src = src;
    }
    // ---- เครื่องยนต์ฟิสิกส์: ตัวละครมีมวล — สปริง (หน่วงวิกฤต/เด้งเล็กน้อย) + แรงโน้มถ่วง ----
    // อินทิเกรตแบบ semi-implicit Euler ที่ 120Hz คงที่ (สะสมเวลาจริง) แล้ววาดแบบประมาณค่าระหว่างสเต็ป → ลื่นทุกจอ ไม่สั่น
    const $body = document.getElementById('body'), $shadow = document.getElementById('shadow'), $deco = document.getElementById('deco');
    const RM = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
    let DECO = RM && RM.matches ? 0 : 1; // ลดการเคลื่อนไหว → ปิดของตกแต่ง (เอียง/บีบยืด/แกว่ง/ความเฉื่อยของประกาย)
    if (RM && RM.addEventListener) RM.addEventListener('change', () => { DECO = RM.matches ? 0 : 1; });
    const SWAY = (() => { const v = parseFloat(P('sway', '1')); return isNaN(v) ? 1 : Math.max(0, Math.min(3, v)); })(); // ?sway=0 ปิดการเอียง/โยกตัว
    const now = () => performance.now();
    const c01 = (t) => (t < 0 ? 0 : t > 1 ? 1 : t);
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const eQuad = (t) => (t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
    const DPR = () => window.devicePixelRatio || 1;
    const snap = (v) => Math.round(v * DPR()) / DPR(); // ปัดให้ตรงพิกเซลจอ → ภาพไม่เบลอจากการเลื่อนครึ่งพิกเซล
    const FADE = 150;

    // เลเยอร์ท่า: ท่าใหม่จางขึ้น "ทับ" ท่าเดิม (ท่าเดิมทึบอยู่ข้างใต้ = ไม่มีวูบ) แล้วซ่อนท่าเดิมทันทีที่ท่าใหม่ทึบเต็ม (ไม่เหลือเงาซ้อน)
    const L = { under: [], top: 0, a0: 1, t0: 0, d: 0 };
    let SPIN = null, WALKING = false, VIDMODE = false;
    const topAlpha = (t) => (L.d <= 0 ? L.a0 : L.a0 + (1 - L.a0) * eQuad(c01((t - L.t0) / L.d)));
    function pose(n, ms) {
      if (SPIN || !imgs[n] || L.top === n || (imgs[n].complete && !imgs[n].naturalWidth && L.top)) return; // รูปโหลดไม่ขึ้น → อยู่ท่าเดิม (ไม่โชว์กรอบรูปเสีย)
      const t = now(), a = topAlpha(t);
      let under = a >= 1 ? [] : L.under.slice(), a0 = 0;
      if (L.top) under.push({ n: L.top, a });
      under = under.filter((u) => { if (u.n === n) { a0 = Math.max(a0, u.a); return false; } return true; }).slice(-3);
      ms = ms == null ? FADE : ms;
      Object.assign(L, { under: ms > 0 ? under : [], top: n, a0: ms > 0 ? a0 : 1, t0: t, d: Math.max(0, ms) });
    }
    const shown = {};
    function drawLayers(t) {
      const a = topAlpha(t); if (a >= 1 && L.under.length) L.under = [];
      const want = {}; L.under.forEach((u, i) => { want[u.n] = [u.a, i + 1]; }); if (L.top) want[L.top] = [a, L.under.length + 1];
      for (const k in imgs) {
        const w = want[k] || [0, 0], o = Math.round(w[0] * 1000) / 1000, prev = shown[k];
        if (prev && prev[0] === o && prev[1] === w[1]) continue;
        const st = imgs[k].style; st.opacity = String(o); st.zIndex = String(w[1]); imgs[k].classList.toggle('vis', o > 0); shown[k] = [o, w[1]];
      }
    }

    const H = 1 / 120, GRAV = 3000, TAU = Math.PI * 2; // แรงโน้มถ่วง px/s² (กระโดดสูง 110px ลอย ~0.54 วิ)
    // แรงสปริง: ความถี่ธรรมชาติ f (Hz) · อัตราหน่วง z (1 = หน่วงวิกฤต ไม่เด้ง · <1 = เลยเป้านิดแล้วกลับ)
    const spr = (x, v, target, f, z) => { const w = TAU * f; return -w * w * (x - target) - 2 * z * w * v; };
    const gauss = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * Math.random()); };
    // B = ตัวละคร (y: + = ลง, sq = บีบ(-)/ยืด(+) แกนตั้ง, rot องศา) · WK = ตำแหน่งเดิน · GF = ของขวัญในมือ · DC = ชั้นประกาย · ID = ยืนว่าง
    const B = { y: 0, vy: 0, ay: 0, air: false, sq: 0, vsq: 0, rot: 0, vrot: 0, arot: 0 };
    const WK = { x: 0, vx: 0, ax: 0, s: 1, fx: 0, fs: 1, tx: 0, ts: 1, D: 1, u: 0, vu: 0, vmax: 1, amax: 300, ramp: 1, on: false };
    const GF = { x: 0, vx: 0, y: 0, vy: 0, a: 0, va: 0, s: 1, vs: 0 };
    const DC = { x: 0, vx: 0, y: 0, vy: 0 };
    const ID = { r: 0, vr: 0, sh: 0, vsh: 0, shT: 0, next: 5 };
    let JMP = null, calm = 1, busy = false;
    function kick(vy, vsq) { B.vy += vy; B.vsq += vsq; } // แรงกระแทกสั้น ๆ (ก้าวเท้า/เด้งเล็ก)
    function jump(h, prep, dip) { JMP = { h, prep, dip, t: 0 }; } // ย่อตัว prep วิ → พุ่งขึ้นสูง h px (วิถีโค้งตามแรงโน้มถ่วง)
    function hop() { jump(14, .07, .035); }
    function beat() { jump(8, .1, .045); }
    // เดิน: เร่ง → ความเร็วคงที่ → ผ่อน ตามแรง (ไม่ใช่เส้นโค้งเวลา) · คำนวณความเร็วสูงสุดให้ถึงที่หมายราว ๆ ms
    function moveWalker(x, s, ms) {
      const dx = x - WK.x, D = Math.max(Math.abs(dx), 80), T = Math.max(.3, ms / 1000 - .06), a = WK.amax, kk = 1 / (2 * a) + 1 / (1.6 * a); // เร่ง a · เบรก .8a
      const disc = T * T - 4 * kk * D;
      Object.assign(WK, { fx: WK.x, fs: WK.s, tx: x, ts: s, D, u: 0, vu: dx ? Math.max(0, WK.vx * D / dx) : 0, ramp: 0, on: true,
        vmax: disc > 0 ? (T - Math.sqrt(disc)) / (2 * kk) : T / (2 * kk) });
      $walker.classList.add('moving');
    }
    // ลำดับหมุน 16 ทิศ (ทุก 22.5°): [1,25,18,26,19,27,20,28,21,29,22,30,23,31,24,32,1] · ตัวที่ไม่มี 25–32 → 8 ทิศ [1,18,…,24,1]

      () => walk(),
      async () => { if (TURN === 7) await spin(); else pose(3), await wait(900); }, // หมุนโชว์ (เฉพาะตัวที่มีท่าหันรอบตัว)
      async () => { for (let i = 0; i < 6; i++) { pose(i % 2 ? 5 : 4, 110); kick(-30, .06); await wait(230); } },                   // สะบัดผม
      async () => { pose(8); hop(); particles(['💗', '💕'], 4, 1.6); await wait(1100); },                      // ส่งหัวใจเล่น ๆ
      async () => { pose(3); await wait(1200); },                                                              // ยิ้มเฉย ๆ (ไม่โยกตัว)
      async () => { for (const n of [9, 10, 9, 10]) { pose(n, 160); beat(); await wait(330); } }, // เต้นสั้น ๆ
      async () => { pose(7); hop(); particles(['✨', '⭐'], 4, 1.4); await wait(900); },                        // ดีใจเบา ๆ
    ];
    (function idleAct() {
      setTimeout(async () => { if (!busy && !running) { busy = true; try { if (VIDEO.on) { const r = Math.random(); if (r < 0.15 && TURN === 7) await spin(); else if (r < 0.4 && VIDEO.clips.dance) await clip('dance', 3600); } else await IDLE[Math.floor(Math.random() * IDLE.length)](); } catch (e) { /* ignore */ } pose(1); busy = false; } idleAct(); }, 6000 + Math.random() * 6000);
    })();

    // ---- คิวท่าทาง (ทีละอย่าง ไม่ทับกัน) ----
    const queue = []; let running = false;
    function enqueue(fn) { if (queue.length > 6) queue.shift(); queue.push(fn); if (!running) run(); }
    async function run() { running = true; while (queue.length) { busy = true; try { await queue.shift()(); } catch (e) { /* ignore */ } pose(1); busy = false; await wait(250); } running = false; }

    async function receive(e) {
      const img = e.giftImage || (window.VJLCollect ? VJLCollect.imgFor(e.giftName) : '');
      if (VIDEO.on && VIDEO.clips.thanks) playClip('thanks'); else { pose(6); hop(); }
      if (img) { // ของขวัญตกลงมือ: เริ่มสูง เล็ก เอียง → สปริงดึงเข้ามือ เด้งแล้วนิ่ง · ถือชิ้นเดิมอยู่แล้ว → เด้งในมือแทน (ไม่วาร์ป)
        if ($gift.classList.contains('on')) { GF.vy -= 320; GF.vs += 2.2; GF.va += 90; $gift.src = img; }
        else { $gift.src = img; Object.assign(GF, { x: 0, vx: 0, y: -115, vy: -180, a: -25, va: 0, s: .3, vs: 0 }); $gift.classList.add('on'); }
      }
      if (THANKS) say(fillText(THANK_TEXT, e), 3000);
      particles(['✨', '💖', '⭐'], 6);
      if (SPARK !== 'off') twinkle(SPARK === 'lots' ? 14 : 8, 0.8);
      await wait(2600); $gift.classList.remove('on');
    }
    async function joy(e) {
      if (VIDEO.on && VIDEO.clips.joy) { confetti(); particles(['🎉', '✨', '💖'], 10); if (SPARK !== 'off') twinkle(20, 1.1); if (e && THANKS) say(fillText(THANK_TEXT, e), 3800); await clip('joy', 4200); return; }
      pose(7); hop(); confetti(); particles(['🎉', '✨', '💖'], 10); if (SPARK !== 'off') twinkle(20, 1.1);
      if (e && THANKS) say(fillText(THANK_TEXT, e), 3800);
      await wait(1600);
    }
    async function dance(times = 3) {
      if (await clip('dance', times <= 2 ? 3600 : 5200)) return;
      for (let i = 0; i < times; i++) for (const n of [9, 10, 11]) { pose(n, 160); beat(); await wait(380); }
    }
    async function heart(e) {
      if (VIDEO.on && VIDEO.clips.heart) { particles(['💗', '💕', '💖', '🩷'], 12, 2); if (e) say(fillText(FOLLOW_TEXT, e), 3000); await clip('heart', 4200); return; }
      if (VIDEO.on) { particles(['💗', '💕', '💖', '🩷'], 12, 2); if (e) say(fillText(FOLLOW_TEXT, e), 3000); playClip('joy'); await wait(2200); return; }
      pose(8); hop(); particles(['💗', '💕', '💖', '🩷'], 12, 2);
      if (e) say(fillText(FOLLOW_TEXT, e), 3000);
      await wait(2200);
    }
    async function kiss(e) {
      // เดินเข้ามาใกล้จอ → ส่งจุ๊บ → หันหลังเดินกลับ
      const toward = POS === 'br' ? -120 : POS === 'bl' ? 120 : 0;
      WALKING = true; moveWalker(toward, 1.35, 1620);
      for (let i = 0; i < 6; i++) await step(i % 2 ? 13 : 12, 270);
      WALKING = false;
      pose(14); kick(-45, .1); await wait(650);
      pose(15, 120); kick(30, -.2); setTimeout(() => kick(-70, .25), 180); particles(['💋', '💗', '💕'], 14, 2.2);
      if (e) say(fillText('จุ๊บ ๆ ให้ {user} 💋', e), 2600);
      await wait(1300);
      WALKING = true; moveWalker(0, 1, 1620);
      for (let i = 0; i < 6; i++) await step(i % 2 ? 17 : 16, 270);
      WALKING = false;
    }

    let lastPing = 0;
    const ping = async (n, parts) => { // ท่าสั้น ๆ ตอบแชท/ไลก์ (เว้นอย่างน้อย 2.5 วิ)
      if (busy || running || Date.now() - lastPing < 2500) return; lastPing = Date.now(); busy = true;
      if (VIDEO.on) { if (parts) particles(parts, 3, 1.4); await wait(650); busy = false; return; }
      pose(n); hop(); if (parts) particles(parts, 3, 1.4); await wait(650); pose(1); busy = false;
    };
    Overlay.on('event', (e) => {
      if (e.type === 'chat') void ping(3);
      else if (e.type === 'like') void ping(8, ['💗', '💖']);
      if (e.type === 'gift' && !e.streaking) {
        const value = e.totalValue || (e.diamondCount || 0) * (e.repeatCount || 1);
        if (value >= BIG) enqueue(async () => { await receive(e); await joy(null); await dance(2); });
        else enqueue(() => receive(e));
      } else if (e.type === 'follow' && FOLLOW) enqueue(() => heart(e));
    });
    // Action "มาสคอต" จากกฎ (หน้า Actions)
    Overlay.on('action', (f) => {
      const a = f.action || {}; if (a.type !== 'mascot') return;
      const ev = f.event || {}, m = a.move || 'dance';
      enqueue(async () => {
        if (a.text) say(fillText(a.text, ev), 3200);
        if (m === 'spin') await spin(); else if (m === 'jump') await bigJump(); else if (m === 'walk') await walk(220); else if (m === 'kiss') await kiss(a.text ? null : ev); else if (m === 'joy') await joy(null); else if (m === 'heart') await heart(a.text ? null : ev); else await dance(3);
      });
    });

    // ---- พรีวิว (ไม่มีลิงก์จริง) ----
    if (!Overlay.connected) {
      const demo = window.VJLCollect ? () => VJLCollect.demoGift() : () => ({ type: 'gift', user: { nickname: 'mimi' }, giftName: 'Rose', diamondCount: 1 });
      const seq = [() => enqueue(() => receive(demo())), () => enqueue(() => heart({ user: { nickname: 'บิ๊ก' } })), () => enqueue(() => receive(demo())),
        () => enqueue(async () => { await joy(null); await dance(2); }), () => enqueue(() => kiss({ user: { nickname: 'lisa' } }))];
      let i = 0; setTimeout(function loop() { seq[i++ % seq.length](); setTimeout(loop, 6500); }, 900);
    }
  })();
  </script>
</body>
