<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat Overlay</title>
<link rel="icon" href="favicon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@500;700&display=swap');
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Mali','Itim',sans-serif}
  #chat{position:fixed;bottom:20px;width:min(440px,70vw);display:flex;flex-direction:column;gap:8px}
  #chat.bl{left:20px} #chat.br{right:20px;align-items:flex-end}
  .bubble{display:flex;align-items:flex-start;gap:10px;animation:rise .3s ease;transition:opacity .6s}
  .bubble.gone{opacity:0}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:'Itim',sans-serif;font-size:15px;flex:none;
    background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.75);box-shadow:0 3px 8px rgba(0,0,0,.3)}
  .msg{background:rgba(25,12,35,var(--bg,.35));border:1.5px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-radius:16px;padding:8px 14px;font-size:var(--fs,17px);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);word-break:break-word}
  .msg .who{font-family:'Itim',sans-serif;color:#ffb3d6;margin-right:6px}
</style>
</head>
<body>
  <div id="chat"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script>
  /*
   * แชทสด — กระจกโปร่งแสง พร้อมรูปโปรไฟล์จริง
   *   max=8  จำนวนข้อความ     fade=0  วินาทีก่อนข้อความจางหาย (0 = ไม่จาง)
   *   pos=bl|br  bg=35 (ความทึบ %, 0 = ใส)  fontSize=17
   */
  (function(){
    const P=(k,d)=>Overlay.param(k,d), num=(k,d)=>{ const v=parseFloat(P(k,d)); return Number.isFinite(v)?v:d; };
    const chat=document.getElementById('chat'); const MAX=Math.max(1,num('max',8)), FADE=num('fade',0)*1000;
    chat.className=P('pos','bl')==='br'?'br':'bl';
    document.documentElement.style.setProperty('--bg', String(Math.max(0,Math.min(100,num('bg',35)))/100));
    document.documentElement.style.setProperty('--fs', num('fontSize',17)+'px');
    const cols=['#ff93c0','#b9a6f2','#8fe3cf','#ffcf5c','#ff6aa8','#9d86e8']; const colOf=(nm)=>cols[(nm||'?').charCodeAt(0)%cols.length];
    function add(user,text){
      const nm=(user&&(user.nickname||user.uniqueId))||'ผู้ชม', avatar=user&&/^https:\/\//.test(user.avatar||'')?user.avatar:'';
      const b=document.createElement('div'); b.className='bubble';
      const ava=document.createElement('div'); ava.className='ava';
      if(avatar) ava.style.backgroundImage=`url("${avatar.replace(/"/g,'')}")`; else { ava.style.background=colOf(nm); ava.textContent=nm[0]; }
      const msg=document.createElement('div'); msg.className='msg';
      const who=document.createElement('span'); who.className='who'; who.textContent=nm;
      msg.append(who, document.createTextNode(text));
      b.append(ava,msg); chat.appendChild(b);
      while(chat.children.length>MAX) chat.removeChild(chat.firstChild);
      if(FADE>0) setTimeout(()=>{ b.classList.add('gone'); setTimeout(()=>b.remove(),700); }, FADE);
    }
    Overlay.on('event',(e)=>{ if(e.type==='chat') add(e.user, e.comment||''); });
    if(!Overlay.connected){ const names=['mimi','บิ๊ก','lisa','ต้นน้ำ','somchai','เฟิร์น']; const msgs=['สวัสดีครับ','เก่งมาก!','สู้ๆ','กดไลค์ให้แล้ว','555','ปังมาก','น่ารักอะ','รักเลย 💕'];
      setInterval(()=>add({nickname:names[Math.floor(Math.random()*names.length)]}, msgs[Math.floor(Math.random()*msgs.length)]), 1600); }
  })();
  </script>
</body>
</html>
