<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PK MVP Overlay</title>
<link rel="icon" href="favicon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@500;700&display=swap');
  html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Mali','Itim',sans-serif; }
  #box { position:fixed; zoom:var(--s,1); width:330px; -webkit-font-smoothing:antialiased; transition:opacity .5s, transform .5s; }
  #box.tl { left:16px; top:16px } #box.tr { right:16px; top:16px } #box.bl { left:16px; bottom:16px } #box.br { right:16px; bottom:16px }
  #box.tc { left:50%; top:16px; margin-left:-165px }
  #box.off { opacity:0; transform:translateY(-10px) scale(.96); pointer-events:none; }
  .panel { position:relative; border-radius:24px; padding:12px 12px 10px; overflow:hidden;
    background:linear-gradient(160deg,rgba(255,220,238,var(--bgx,.95)),rgba(228,214,255,var(--bgx,.95))); border:2px solid #fff;
    color:#5a2b55; box-shadow:0 10px 26px rgba(200,90,160,.28); }
  .title { font-family:'Itim',sans-serif; font-size:21px; text-align:center; color:#e0468e; text-shadow:0 2px 0 #fff; margin:0 0 8px; }
  .bar { position:relative; display:flex; height:26px; border-radius:999px; overflow:hidden; background:#fff; box-shadow:inset 0 1px 3px rgba(150,60,120,.18); margin-bottom:6px; }
  .bar .us { background:linear-gradient(90deg,#ff8fc0,#ff6aa8); transition:flex-grow .6s ease; flex:1 1 0; min-width:44px; }
  .bar .them { background:linear-gradient(90deg,#b9a2ff,#8f74f0); transition:flex-grow .6s ease; flex:1 1 0; min-width:44px; }
  .bar span { position:absolute; top:0; line-height:26px; font-weight:700; font-size:14px; color:#fff; text-shadow:0 1px 2px rgba(90,20,70,.5); }
  .bar .n-us { left:10px } .bar .n-them { right:10px }
  .row { display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:16px; margin-top:6px; background:rgba(255,255,255,.78); animation:in .45s ease both; }
  .row.bump { animation:bump .6s ease; }
  .rk { width:26px; flex:none; text-align:center; font-size:22px; }
  .av { position:relative; width:40px; height:40px; flex:none; border-radius:50%; background:linear-gradient(135deg,#ffd1e6,#d9ccff); border:2px solid #fff;
    box-shadow:0 2px 6px rgba(180,80,150,.25); display:grid; place-items:center; font-weight:700; font-size:17px; color:#c2367a; overflow:hidden; }
  .av img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .nm { min-width:0; flex:1; font-size:16px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#4a2347; }
  .sc { flex:none; font-size:15px; font-weight:700; color:#e0468e; }
  .opp { margin-top:8px; font-size:13px; text-align:center; color:#6c4fb8; background:rgba(255,255,255,.55); border-radius:999px; padding:4px 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { font-size:14px; text-align:center; opacity:.85; padding:10px 6px; }
  .wait { font-family:'Itim',sans-serif; font-size:18px; text-align:center; padding:6px 0 4px; color:#a0558c; }
  /* จบ PK: โชว์ MVP ตัวใหญ่ */
  .final .crown { text-align:center; font-size:40px; line-height:1; animation:bob 1.6s ease-in-out infinite; }
  .final .bigav { width:86px; height:86px; margin:4px auto 6px; font-size:34px; border-width:3px; box-shadow:0 0 0 4px #ffd76a, 0 6px 18px rgba(220,140,40,.45); }
  .final .bignm { text-align:center; font-size:22px; font-weight:700; color:#4a2347; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .final .bigsc { text-align:center; font-size:15px; color:#e0468e; font-weight:700; margin-bottom:4px; }
  .final .res { display:inline-block; padding:2px 12px; border-radius:999px; background:#fff; font-size:14px; font-weight:700; color:#e0468e; }
  .final .rest { display:flex; gap:6px; justify-content:center; margin-top:6px; font-size:13px; color:#6b3b67; flex-wrap:wrap; }
  .spark { position:absolute; font-size:16px; pointer-events:none; animation:spark 2.4s ease-in-out infinite; opacity:0; }
  /* ธีม */
  .th-glass .panel { background:rgba(40,20,60,var(--bg,.45)); backdrop-filter:blur(8px); border:1.5px solid rgba(255,255,255,.35); color:#fff; box-shadow:0 10px 26px rgba(60,20,80,.3); }
  .th-glass .title { color:#fff; text-shadow:0 2px 4px rgba(60,10,60,.5); } .th-glass .row { background:linear-gradient(90deg,rgba(255,111,170,.35),rgba(150,110,240,.25)); }
  .th-glass .nm, .th-glass .final .bignm { color:#fff; text-shadow:0 1px 3px rgba(60,10,60,.6); } .th-glass .sc { color:#fff2a8; } .th-glass .opp { background:rgba(255,255,255,.15); color:#e8deff; }
  .th-glass .wait { color:#fff; } .th-glass .final .bigsc { color:#fff2a8; }
  .th-white .panel { background:rgba(255,255,255,var(--bgx,.96)); border:1px solid rgba(0,0,0,.06); color:#23202b; border-radius:16px; box-shadow:0 8px 22px rgba(0,0,0,.12); }
  .th-white .title { color:#23202b; text-shadow:none; } .th-white .row { background:#f6f4f9; border-radius:12px; } .th-white .sc { color:#ff4fa3; }
  .th-gold .panel { background:linear-gradient(180deg,rgba(60,10,25,var(--bgx,.92)),rgba(30,5,15,var(--bgx,.92))); border:2px solid #d4af37; color:#fff4d0; }
  .th-gold .title { color:#ffe08a; text-shadow:0 2px 0 #7a5410; } .th-gold .row { background:linear-gradient(90deg,rgba(212,175,55,.22),rgba(212,175,55,.06)); border:1px solid rgba(212,175,55,.45); }
  .th-gold .nm, .th-gold .final .bignm { color:#fff4d0; } .th-gold .sc, .th-gold .final .bigsc { color:#ffd76a; } .th-gold .opp { background:rgba(212,175,55,.15); color:#ffe8b0; } .th-gold .wait { color:#ffe08a; }
  @keyframes in { from { opacity:0; transform:translateX(-14px) } to { opacity:1; transform:none } }
  @keyframes bump { 40% { transform:scale(1.05); box-shadow:0 0 0 3px #ffe17a, 0 0 18px #ffcf5c } }
  @keyframes bob { 50% { transform:translateY(-5px) rotate(-6deg) } }
  @keyframes spark { 0%,100% { opacity:0; transform:scale(.4) } 50% { opacity:1; transform:scale(1.1) rotate(20deg) } }
</style>
</head>
<body>
  <div id="box" class="off"><div class="panel" id="panel"></div></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script>
  (function () {
    // 👑 MVP ของ PK: 3 อันดับคนช่วยฝั่งเรามากสุดระหว่าง PK (สด) + MVP ฝั่งคู่แข่ง · จบ PK โชว์ MVP ตัวใหญ่ค้างไว้ ?hold= วินาที
    // ?pos=tl|tr|bl|br|tc · ?theme=candy|glass|white|gold · ?title= · ?them=1 · ?idle=wait|hide · ?hold=20 · ?scale=1 · ?bg=45
    const P = (k, d) => Overlay.param(k, d), esc = Overlay.esc, fmt = (n) => (Math.round(Number(n)) || 0).toLocaleString('en-US');
    const box = document.getElementById('box'), panel = document.getElementById('panel');
    const POS = ['tl', 'tr', 'bl', 'br', 'tc'].includes(P('pos', 'tr')) ? P('pos', 'tr') : 'tr';
    const THEME = ['candy', 'glass', 'white', 'gold'].includes(P('theme', 'candy')) ? P('theme', 'candy') : 'candy';
    const TITLE = P('title', '👑 MVP ของ PK').trim() || '👑 MVP ของ PK';
    const SHOW_THEM = !['0', 'false'].includes(String(P('them', '1')));
    const SHOW_BAR = !['0', 'false'].includes(String(P('bar', '1')));
    const IDLE = P('idle', 'wait') === 'hide' ? 'hide' : 'wait';
    const HOLD = Math.max(3, Math.min(300, parseFloat(P('hold', '20')) || 20)) * 1000;
    box.className = POS + ' th-' + THEME + ' off';
    box.style.setProperty('--s', Math.max(.4, Math.min(4, parseFloat(P('scale', '1')) || 1)));
    box.style.setProperty('--bgx', Math.max(.3, Math.min(1, parseFloat(P('bg', '45')) / 100 + .45)));
    panel.style.setProperty('--bg', Math.max(0, Math.min(100, parseFloat(P('bg', '45')))) / 100);

    const MEDAL = ['🥇', '🥈', '🥉'];
    let state = 'idle', us = 0, them = 0, mvp = [], themMvp = null, prev = new Map(), finalTimer = null, staleTimer = null;

    const initial = (n) => esc((Array.from(String(n || '?').trim())[0] || '?').toUpperCase());
    function avatar(m, cls) {
      const img = m && m.avatar ? `<img src="${esc(m.avatar)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
      return `<div class="av ${cls || ''}">${initial(m && m.name)}${img}</div>`;
    }
    function barHtml() {
      if (!SHOW_BAR) return '';
      const a = Math.max(us, 0), b = Math.max(them, 0), tot = a + b;
      const fa = tot ? a / tot : .5;
      return `<div class="bar"><div class="us" style="flex-grow:${fa.toFixed(3)}"></div><div class="them" style="flex-grow:${(1 - fa).toFixed(3)}"></div>`
        + `<span class="n-us">💖 ${fmt(a)}</span><span class="n-them">${fmt(b)} 😈</span></div>`;
    }
    function oppHtml() { return SHOW_THEM && themMvp ? `<div class="opp">😈 MVP คู่แข่ง: <b>${esc(themMvp.name)}</b> · ${fmt(themMvp.score)}</div>` : ''; }
    function show(on) { box.classList.toggle('off', !on); }

    function renderIdle() {
      state = 'idle'; prev = new Map();
      if (IDLE === 'hide') { show(false); return; }
      panel.className = 'panel';
      panel.innerHTML = `<div class="title">${esc(TITLE)}</div><div class="wait">⚔️ รอ PK…</div>`;
      show(true);
    }
    function renderLive() {
      state = 'live'; panel.className = 'panel';
      let rows = '';
      mvp.slice(0, 3).forEach((m, i) => {
        const old = prev.get(m.name), bump = old !== undefined && old !== m.score;
        rows += `<div class="row${bump ? ' bump' : ''}" style="${old !== undefined ? 'animation-name:' + (bump ? 'bump' : 'none') : ''}"><div class="rk">${MEDAL[i]}</div>${avatar(m)}<div class="nm">${esc(m.name)}</div><div class="sc">⚔️ ${fmt(m.score)}</div></div>`;
      });
      prev = new Map(mvp.map((m) => [m.name, m.score]));
      panel.innerHTML = `<div class="title">${esc(TITLE)}</div>${barHtml()}${rows || '<div class="empty">ยังไม่มีคนช่วย — ส่งของขวัญเลย! 💖</div>'}${oppHtml()}`;
      show(true);
      clearTimeout(staleTimer); staleTimer = setTimeout(renderIdle, 6 * 60 * 1000); // ไม่มีข้อมูล PK นานมาก = PK จบไปแล้ว (สัญญาณจบหาย)
    }
    function renderFinal(result) {
      state = 'final'; clearTimeout(staleTimer); panel.className = 'panel final';
      const top = mvp[0];
      const res = result === 'win' ? '🏆 ชนะ PK!' : result === 'lose' ? '💪 สู้เต็มที่!' : result === 'draw' ? '🤝 เสมอ' : '⚔️ จบ PK';
      if (!top) panel.innerHTML = `<div class="title">${esc(TITLE)}</div><div style="text-align:center"><span class="res">${res}</span></div><div class="empty">ขอบคุณทุกคนที่ช่วยกันนะ 💖</div>`;
      else {
        const rest = mvp.slice(1, 3).map((m, i) => `<span>${MEDAL[i + 1]} ${esc(m.name)} · ${fmt(m.score)}</span>`).join('');
        let sp = ''; for (let i = 0; i < 6; i++) sp += `<span class="spark" style="left:${8 + Math.random() * 84}%;top:${6 + Math.random() * 60}%;animation-delay:${(i * .4).toFixed(1)}s">${['✨', '💖', '⭐'][i % 3]}</span>`;
        panel.innerHTML = `${sp}<div class="title">${esc(TITLE)}</div><div style="text-align:center"><span class="res">${res}</span></div>`
          + `<div class="crown">👑</div>${avatar(top, 'bigav')}<div class="bignm">${esc(top.name)}</div><div class="bigsc">⚔️ ${fmt(top.score)} คะแนน · ขอบคุณมากก 💖</div>`
          + (rest ? `<div class="rest">${rest}</div>` : '') + oppHtml();
      }
      show(true);
      clearTimeout(finalTimer); finalTimer = setTimeout(renderIdle, HOLD);
    }

    function onPk(k) {
      if (!k) return;
      if (k.kind === 'start') { clearTimeout(finalTimer); us = 0; them = 0; mvp = []; themMvp = null; prev = new Map(); renderLive(); return; }
      if (k.kind === 'score') {
        if (state === 'final') return; // คะแนนที่มาช้าหลังจบ
        if (typeof k.us === 'number') us = k.us; if (typeof k.them === 'number') them = k.them;
        if (Array.isArray(k.mvp)) mvp = k.mvp; if (k.themMvp !== undefined) themMvp = k.themMvp || null;
        renderLive(); return;
      }
      if (k.kind === 'end') {
        if (typeof k.us === 'number') us = k.us; if (typeof k.them === 'number') them = k.them;
        if (Array.isArray(k.mvp) && k.mvp.length) mvp = k.mvp; if (k.themMvp) themMvp = k.themMvp;
        renderFinal(k.result);
      }
    }
    Overlay.on('event', (e) => { if (e && e.type === 'pk') onPk(e.pk); });
    renderIdle();

    // เดโม (ตัวอย่างในแดชบอร์ด/ไม่มีลิงก์): PK จำลองวนไปเรื่อย ๆ
    if (!Overlay.connected) {
      const NAMES = ['น้องมะลิ', 'พี่หมีใจดี', 'Sweetie_Bun', 'ต้าร์ 🌸', 'MintyMoo', 'ป๋าเปา'];
      let t = null;
      const cycle = () => {
        onPk({ kind: 'start' });
        const pts = new Map(); let u = 0, th = 0, step = 0;
        t = setInterval(() => {
          step++;
          const who = NAMES[Math.floor(Math.random() * NAMES.length)], add = [1, 5, 10, 30, 99][Math.floor(Math.random() * 5)];
          pts.set(who, (pts.get(who) || 0) + add); u += add; th += Math.floor(Math.random() * 60);
          const list = [...pts].map(([name, score]) => ({ name, score })).sort((a, b) => b.score - a.score).slice(0, 3);
          if (step < 14) onPk({ kind: 'score', us: u, them: th, mvp: list, themMvp: { name: 'คู่แข่งสายเปย์', score: Math.round(th * .4) } });
          else { clearInterval(t); onPk({ kind: 'end', result: u >= th ? 'win' : 'lose', us: u, them: th, mvp: list }); setTimeout(cycle, Math.min(HOLD, 8000) + 2500); }
        }, 900);
      };
      setTimeout(cycle, 1200);
    }
  })();
  </script>
</body>
</html>
