# docker-compose สำหรับ production (บน Vultr)
# ปกติ GitHub Actions เป็นคน deploy ให้ (ดู DEPLOY.md) — image build บน CI แล้วเก็บที่ GHCR
# รันเองบนเครื่อง: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# (ค่าใน .env ถูกอ่านอัตโนมัติ ทั้งสำหรับ ${...} ในไฟล์นี้และเป็น env ของ app)
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/tueyzzzz/vjlivekit.com:latest}
    env_file: .env
    environment:
      # จำกัด heap ของ Node ให้พอดีเครื่อง 1GB
      - NODE_OPTIONS=--max-old-space-size=384
      - SNAPSHOT_DIR=/app/data/live
    volumes:
      # สถิติ/อันดับไลฟ์ (Top Gifters) — รีสตาร์ท/deploy กลางไลฟ์แล้วโหลดคืน
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # หมายเหตุ: Redis ยังไม่ได้ใช้ในโค้ด v1 จึงไม่รันเพื่อประหยัด RAM — เพิ่มกลับเมื่อทำ Socket.IO Redis adapter

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging: *logging

volumes:
  appdata:
  pgdata:
  caddy_data:
  caddy_config:
