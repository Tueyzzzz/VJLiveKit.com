<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gift Garden Overlay</title>
  <link rel="icon" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Kanit',sans-serif;color:#fff}
    #fx{position:fixed;inset:0}
    .shadow{text-shadow:0 2px 4px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.8)}
    #alert{position:fixed;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;
      background:rgba(20,10,30,.55);backdrop-filter:blur(4px);opacity:0;transform:translate(-50%,10px);transition:opacity .35s,transform .35s;white-space:nowrap;pointer-events:none}
    #alert.show{opacity:1;transform:translate(-50%,0)}
    #alert img.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#b9a6f2}
    #alert img.gift{width:36px;height:36px;object-fit:contain}
    #alert .nm{font-weight:600;font-size:18px} #alert .sub{font-size:15px;opacity:.9}
    #board{position:fixed;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border-radius:999px;
      background:rgba(20,10,30,.45);border:1.5px solid rgba(255,215,106,.7);font-size:20px;white-space:nowrap;pointer-events:none}
    #board img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#b9a6f2}
    #board .c{color:#ffd76a;font-weight:600;margin-left:6px}
    #board:empty{display:none}
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="alert" class="shadow"><img class="ava" alt="" /><div><div class="nm"></div><div class="sub"></div></div><img class="gift" alt="" /></div>
  <div id="board" class="shadow"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script src="js/juice.js"></script>

        slots: [[-88.0,-445.1],[13.0,-394.2],[177.4,-338.0],[29.5,-279.1],[-15.0,-392.2],[-201.5,-251.0],[43.1,-428.3],[-84.4,-308.0],[42.7,-383.0],[-124.1,-382.2],[80.4,-352.5],[45.9,-346.9],[-182.7,-236.6],[-33.5,-435.5],[-117.3,-346.5],[11.0,-247.8],[145.8,-260.3],[-108.1,-286.3],[-65.6,-393.8],[-71.6,-457.9],[8.6,-300.4],[59.9,-403.8],[149.4,-283.9],[177.8,-241.8],[-49.9,-465.6],[135.3,-344.9],[-7.0,-436.3],[194.7,-310.4],[-28.3,-465.6],[127.3,-372.5],[177.0,-266.3],[173.0,-314.0],[151.0,-306.0],[199.5,-247.4],[-26.7,-410.2],[22.7,-434.3],[-100.5,-328.4],[-140.6,-233.8],[85.2,-389.0],[114.5,-411.0],[-195.1,-313.6],[29.5,-461.6],[-123.3,-423.5],[-151.0,-346.9],[105.7,-368.5],[9.8,-454.3],[63.2,-375.7],[215.1,-282.3],[-78.8,-413.8],[161.4,-359.7],[-193.9,-336.4],[-168.2,-281.1],[-138.1,-269.1],[47.5,-259.4],[-41.1,-393.8],[-134.9,-307.6],[-16.2,-283.9],[-167.8,-308.4],[-103.7,-372.5],[-44.3,-254.2],[119.3,-324.0],[-40.3,-314.8],[-3.8,-415.4],[-136.5,-407.0],[-80.8,-271.9],[94.4,-305.2],[-62.4,-299.1],[132.9,-236.2],[-98.0,-423.1],[-39.1,-289.9],[-192.3,-289.9],[-159.8,-375.3],[-167.4,-330.0],[-21.9,-260.3],[-160.2,-241.8],[-18.2,-306.4],[93.6,-333.6],[-207.1,-271.5],[-58.7,-276.7],[128.1,-294.7],[-65.6,-321.2],[-110.9,-307.2],[155.4,-338.0],[3.4,-273.1],[114.5,-349.3],[-57.1,-415.0],[-103.3,-401.8],[29.5,-302.8],[22.7,-413.0],[-11.0,-332.0],[155.0,-231.4],[181.9,-288.3],[-53.9,-442.3],[-117.3,-221.4],[149.8,-391.0],[108.1,-390.6],[47.1,-449.9],[-183.9,-266.3],[-82.4,-380.6],[-149.4,-292.3],[-136.9,-329.6],[-171.0,-354.9],[-138.5,-366.9],[-29.1,-375.7],[-81.2,-336.8],[197.9,-270.3],[128.5,-395.4],[-155.0,-395.8],[-26.3,-239.0],[-211.5,-298.7],[-158.2,-262.7]],
        bigs: [[9.8,-454.3],[-88.0,-445.1],[59.9,-403.8],[128.5,-395.4],[-124.1,-382.2],[177.4,-338.0],[-40.3,-314.8],[-195.1,-313.6],[29.5,-279.1],[177.0,-266.3]] },
    };
    const TREE = TREES[SKIN_NAME] || null;
    const POT_SKIN = SKIN_NAME === 'classic' ? null : TREE || { src: 'themes/pot-heart.webp', k: 0.24, x: -151.9, y: -219.8, w: 303.8, h: 219.8 };
    const potImg = POT_SKIN ? Juice.skin(POT_SKIN.src, num('hue', 0), num('sat', 1), num('bright', 1)) : null;
    const POT_TOP = POT_SKIN ? -179.2 : -96; // กิ่งงอกจากกลางดิน
    const stems = [];
    for (let i = 0; i < 11; i++) {
      const a = -Math.PI / 2 + (i / 10 - .5) * 2.3 + (rnd() - .5) * .12; // พัดกว้าง ~130°
      const len = 230 + rnd() * 120 - Math.abs(i - 5) * 6;
      const stem = { a, len, bend: (rnd() - .5) * .5, phase: rnd() * 6.28, twigs: [] };
      for (let k = 0; k < 3; k++) stem.twigs.push({ t: .35 + k * .2 + rnd() * .08, a: (rnd() < .5 ? -1 : 1) * (.45 + rnd() * .35), len: 50 + rnd() * 55 });
      stems.push(stem);
    }
    // จุดติดดอก (เรียงจากโคนขึ้นไปปลาย สลับกิ่ง → ดอกกระจายทั่วต้น)
    const slots = [];
    for (let r = 0; r < 12; r++) for (let i = 0; i < stems.length; i++) {
      const st = stems[(i * 7 + r * 3) % stems.length];
      if (r < 8) slots.push({ stem: st, t: .3 + r * .09 + rnd() * .03, twig: null, off: (rnd() - .5) * 10 });
      else { const tw = st.twigs[(r - 8) % st.twigs.length]; slots.push({ stem: st, twig: tw, t: .45 + (r - 8) * .18 + rnd() * .05, off: (rnd() - .5) * 8 }); }
    }

    const BIG_SPOTS = TREE ? TREE.bigs.map(([x, y]) => ({ tree: true, x, y, t: rnd() }))
      : [5, 4, 6, 3, 7, 2, 8, 1, 9, 0, 10].map((i) => ({ stem: stems[i] }))
      .concat(stems.flatMap((st) => st.twigs.map((tw) => ({ stem: st, twig: tw }))));
    if (TREE) slots.splice(0, slots.length, ...TREE.slots.map(([x, y]) => ({ tree: true, x, y, t: rnd() })));
    // ตำแหน่งบนกิ่ง ณ เวลา time (มีลมแกว่ง)
    function stemPoint(st, t, time) {
      const sway = Math.sin(time * 0.9 + st.phase) * 0.06 * SWAY * t;
      // กิ่งโค้งแบบน้ำพุ: โคนตั้งขึ้น ปลายโค้งออกด้านข้าง (มุมเปลี่ยนต่อเนื่องตามความยาว = โค้งจริง)
      const c = Math.cos(st.a) * 1.9 + st.bend * 1.8, a0 = st.a - Math.cos(st.a) * 0.95 - st.bend * 0.6 + sway;
      if (Math.abs(c) > 1e-3) {
        const base = POT_SKIN ? { x: Math.cos(st.a) * 46, y: POT_TOP + 8 - Math.abs(Math.cos(st.a)) * 6 } : { x: Math.cos(st.a) * 14, y: POT_TOP + 4 };
        const L = st.len / c, a1 = a0 + c * t;
        return { x: base.x + L * (Math.sin(a1) - Math.sin(a0)), y: base.y - L * (Math.cos(a1) - Math.cos(a0)), a: a1 };
      }
      const a = a0;
      const base = POT_SKIN ? { x: Math.cos(st.a) * 46, y: POT_TOP + 8 - Math.abs(Math.cos(st.a)) * 6 } : { x: Math.cos(st.a) * 14, y: POT_TOP + 4 };
      return { x: base.x + Math.cos(a) * st.len * t, y: base.y + Math.sin(a) * st.len * t, a };
    }
    function slotPoint(sl, time) {
      if (sl.tree) return { x: sl.x + Math.sin(time * 0.9 + sl.y * 0.02) * 3 * SWAY * (-sl.y / 400), y: sl.y }; // พุ่มใบไหวตามลม
      if (!sl.twig) { const p = stemPoint(sl.stem, sl.t, time); return { x: p.x + sl.off, y: p.y }; }
      const p0 = stemPoint(sl.stem, sl.twig.t, time);
      const a = p0.a + sl.twig.a + Math.sin(time * 1.3 + sl.stem.phase + sl.twig.t * 5) * 0.08 * SWAY;
      return { x: p0.x + Math.cos(a) * sl.twig.len * sl.t, y: p0.y + Math.sin(a) * sl.twig.len * sl.t };
    }

    // ---- ดอกไม้ ----
    const flowers = [], bigs = [], fx = new Juice.Particles();
    const imgCache = {};
    function giftImg(url) { if (!url || !/^https:\/\//.test(url)) return null; let im = imgCache[url]; if (!im) { im = new Image(); im.src = url; imgCache[url] = im; } return im; }
    const PETALS = ['#ffb5c8', '#c9b8ff', '#a8e6cf', '#ffd3a5', '#a9d8ff', '#fff1a8'];
    function addFlower(g, born) {
      if (g.big) {
        const i = bigs.length % 6;
        bigs.push({ g, img: giftImg(g.u), born, color: PETALS[bigs.length % PETALS.length], jx: (Math.random() - .5) * 30, jy: (Math.random() - .5) * 30 });
      } else {
        const sl = slots[flowers.length % slots.length], lap = Math.floor(flowers.length / slots.length);
        flowers.push({ g, img: giftImg(g.u), born, sl, jx: lap ? (Math.random() - .5) * 22 : 0, jy: lap ? (Math.random() - .5) * 22 : 0 });
      }
    }

    // ---- วาด ----
    function drawPot() {
      const w = 92, h = 96, top = POT_TOP;
      ctx.save(); const br = Juice.breathe(performance.now() / 1000, 0.012); ctx.scale(1 + (1 - br) * 0.5, br);
      if (POT_SKIN) {
        ctx.beginPath(); ctx.ellipse(0, -4, TREE ? 170 : 125, 12, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(90,70,140,.25)'; ctx.fill();
        if (potImg.ready()) ctx.drawImage(potImg.source, POT_SKIN.x, POT_SKIN.y, POT_SKIN.w, POT_SKIN.h);
        ctx.restore(); return;
      }
      // เงา
      ctx.beginPath(); ctx.ellipse(0, -2, w * 1.05, 12, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(90,70,140,.25)'; ctx.fill();
      // ตัวกระถาง (ทรงถ้วย)
      ctx.beginPath();
      ctx.moveTo(-w, top + 14); ctx.bezierCurveTo(-w - 4, top + 60, -w * .78, -6, -w * .62, -4);
      ctx.lineTo(w * .62, -4); ctx.bezierCurveTo(w * .78, -6, w + 4, top + 60, w, top + 14); ctx.closePath();
      const g = ctx.createLinearGradient(-w, 0, w, 0);
      g.addColorStop(0, '#d9c7a4'); g.addColorStop(.3, '#fff8ea'); g.addColorStop(.55, POT); g.addColorStop(1, '#bfa67c');
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(120,95,60,.35)'; ctx.stroke();
      // ลายนูน
      ctx.strokeStyle = 'rgba(150,120,80,.35)'; ctx.lineWidth = 2;
      for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.arc(i * 26, top + 66, 9, 0, Math.PI * 2); ctx.stroke(); }
      ctx.font = '600 20px Kanit, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(140,110,70,.6)'; ctx.fillText('♡ VJLiveKit', 0, top + 40);
      // ขอบปาก + ดิน
      ctx.beginPath(); ctx.ellipse(0, top + 14, w + 6, 16, 0, 0, Math.PI * 2);
      const rg = ctx.createLinearGradient(0, top, 0, top + 30); rg.addColorStop(0, '#fffaf0'); rg.addColorStop(1, '#d8c39c');
      ctx.fillStyle = rg; ctx.fill(); ctx.strokeStyle = 'rgba(120,95,60,.35)'; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, top + 12, w - 6, 10, 0, 0, Math.PI * 2); ctx.fillStyle = '#5b4535'; ctx.fill();
      ctx.restore();
    }
    // ก้อนดินรอบโคนกิ่ง → กิ่งดูงอกออกมาจากดินจริง (สุ่มคงที่)
    const TUFTS = stems.flatMap((st) => [0, 1, 2].map((j) => ({ st, dx: (j - 1) * 5 + (rnd() - .5) * 3, dy: 1 + rnd() * 3, r: 3.2 + rnd() * 2.2, c: ['#4a3122', '#5e3f2b', '#6d4a33'][j] })));
    function drawSoilTufts(time) {
      for (const t of TUFTS) { const p = stemPoint(t.st, 0, time); ctx.beginPath(); ctx.arc(p.x + t.dx, p.y + t.dy, t.r, 0, Math.PI * 2); ctx.fillStyle = t.c; ctx.fill(); }
    }
    function drawStems(time) {
      ctx.lineCap = 'round';
      for (const st of stems) {
        ctx.strokeStyle = '#b5486b'; let prev = stemPoint(st, 0, time);
        for (let t = .05; t <= 1.001; t += .05) { // เส้นเรียวจากโคนหนาไปปลายบาง
          const p = stemPoint(st, t, time); ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y);
          ctx.lineWidth = 7.5 - 5 * t; ctx.stroke(); prev = p;
        }
        for (const tw of st.twigs) {
          const a = stemPoint(st, tw.t, time); ctx.beginPath(); ctx.moveTo(a.x, a.y);
          const e = slotPoint({ stem: st, twig: tw, t: 1 }, time); const mx = (a.x + e.x) / 2, my = (a.y + e.y) / 2, nx = -(e.y - a.y) * 0.22 * Math.sign(tw.a), ny = (e.x - a.x) * 0.22 * Math.sign(tw.a); ctx.quadraticCurveTo(mx + nx, my + ny - 4, e.x, e.y); // กิ่งย่อยโค้ง
          ctx.lineWidth = 3; ctx.strokeStyle = '#c45a7c'; ctx.stroke();
          // ใบ
          ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(st.a + tw.a);
          ctx.beginPath(); ctx.ellipse(6, 0, 9, 4, 0, 0, Math.PI * 2); ctx.fillStyle = '#4fbf86'; ctx.fill(); ctx.restore();
        }
      }
    }
    const pop = (born, now) => { const k = Math.min(1, (now - born) / 450); return k < 1 ? 1.25 * Math.sin(k * Math.PI / 2) - 0.25 * Math.sin(k * Math.PI) : 1; };
    function drawGift(img, emoji, size) {
      const st = Juice.sticker ? Juice.sticker(img, size * S() * DPR) : null; // สติกเกอร์คมชัด ขอบขาว + เงานุ่ม
      if (st) { const s = size * Juice.STICKER_PAD; ctx.drawImage(st, -s / 2, -s / 2, s, s); }
      else if (img && img.complete && img.naturalWidth) ctx.drawImage(img, -size / 2, -size / 2, size, size);
      else { ctx.font = Math.round(size * .8) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(emoji || '🌹', 0, 2); }
    }
    function drawFlowers(time, now) {
      for (const f of flowers) {
        const p = slotPoint(f.sl, time), s = pop(f.born, now);
        if (!f.sparkled) { f.sparkled = true; if (f.born > 0) fx.sparkle(p.x + f.jx, p.y + f.jy, 4); }
        ctx.save(); ctx.translate(p.x + f.jx, p.y + f.jy); ctx.scale(s, s); ctx.rotate(Math.sin(time * 1.6 + f.sl.t * 9) * .12 * SWAY);
        drawGift(f.img, f.g.e, Math.min(30 * FLOWER * (Juice.sizeFor ? Juice.sizeFor(f.g.d, 1.6) : 1), 70)); ctx.restore(); // ของแพงดอกใหญ่ขึ้น
      }
      bigs.forEach((b, i) => {
        // ตำแหน่งดอกใหญ่: ยอดกิ่งหลัก (กลางก่อน) → ปลายกิ่งย่อย · เกินแล้ววนซ้ำแบบเหลื่อมนิด ๆ (ไม่ซ้อนเป็นเสา)
        const k = i % BIG_SPOTS.length, lap = Math.floor(i / BIG_SPOTS.length), sp = BIG_SPOTS[k];
        const p0 = sp.tree ? slotPoint(sp, time) : sp.twig ? slotPoint({ stem: sp.stem, twig: sp.twig, t: 1 }, time) : stemPoint(sp.stem, 1, time);
        const px = p0.x + (lap ? b.jx : 0), py = p0.y - (sp.tree ? 0 : sp.twig ? 8 : 26) + (lap ? b.jy : 0);
        const s = pop(b.born, now), R = 46 * FLOWER * (sp.twig ? 0.72 : sp.tree ? 0.85 : 1);
        Juice.aura(ctx, px, py, R * 0.9, b.g.d || 1000, time);
        if (!b.sparkled) { b.sparkled = true; if (b.born > 0) { fx.sparkle(px, py, 10, '#ffe08a'); fx.confetti(px, py, 30); } }
        ctx.save(); ctx.translate(px, py); ctx.scale(s, s); ctx.rotate(Math.sin(time * .7 + i) * .1 * SWAY);
        for (let k = 0; k < 10; k++) { // กลีบ
          ctx.save(); ctx.rotate(k * Math.PI / 5); ctx.beginPath(); ctx.ellipse(0, -R * .78, R * .3, R * .5, 0, 0, Math.PI * 2);
          const pg = ctx.createLinearGradient(0, -R * 1.2, 0, -R * .3); pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, b.color);
          ctx.fillStyle = pg; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(90,70,140,.35)'; ctx.stroke(); ctx.restore();
        }
        ctx.beginPath(); ctx.arc(0, 0, R * .62, 0, Math.PI * 2); ctx.fillStyle = '#fff8f0'; ctx.fill();
        drawGift(b.img, b.g.e, R * 1.15); ctx.restore();
      });
    }
    function frame(now) {
      const time = now / 1000;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H); ctx.imageSmoothingQuality = 'high';
      const o = origin(), s = S(); ctx.translate(o.x, o.y); ctx.scale(s, s);
      if (TREE) drawPot(); else if (POT_SKIN) { drawPot(); drawStems(time); drawSoilTufts(time); } else { drawStems(time); drawPot(); }
      drawFlowers(time, now);
      fx.step(); fx.draw(ctx);
      requestAnimationFrame(frame);
    }

    // ---- แจ้งเตือน / ผู้ให้สูงสุด ----
    const $alert = document.getElementById('alert'), $board = document.getElementById('board');
    function layoutUi() {
      const o = origin(), s = S();
      $alert.style.left = o.x + 'px'; $alert.style.top = Math.max(4, o.y - (TREE ? 560 : 470 - 96 - POT_TOP) * s) + 'px';
      $board.style.left = o.x + 'px'; $board.style.top = (o.y + 10) + 'px';
    }
    let alertT = null, ranking = {};
    const safe = (u) => /^https:\/\//.test(u || '') ? u : '';
    function showAlert(e, count) {
      if (!SHOW_ALERT) return;
      const ava = $alert.querySelector('.ava'), gi = $alert.querySelector('.gift');
      ava.src = safe(e.user && e.user.avatar); ava.style.visibility = ava.src ? 'visible' : 'hidden';
      $alert.querySelector('.nm').textContent = (e.user && (e.user.nickname || e.user.uniqueId)) || 'ผู้ชม';
      $alert.querySelector('.sub').textContent = `ส่ง ${e.giftName || 'ของขวัญ'} ×${count}`;
      gi.src = safe(e.giftImage); gi.style.display = gi.src ? 'block' : 'none';
      $alert.classList.add('show'); clearTimeout(alertT); alertT = setTimeout(() => $alert.classList.remove('show'), 5000);
    }
    function renderBoard() {
      if (!SHOW_BOARD) return;
      const top = Object.values(ranking).sort((a, b) => b.c - a.c)[0];
      if (!top) { $board.innerHTML = ''; return; }
      $board.innerHTML = `<span>👑</span>${safe(top.a) ? `<img src="${top.a.replace(/"/g, '%22')}" alt="">` : ''}<span>${Overlay.esc(top.n)}</span><span class="c">💎 ${Overlay.fmt(top.c)}</span>`;
    }

    // ---- จำต้นไม้ไว้ (รีเฟรชแล้วดอกยังอยู่) ----
    const KEY = 'vjl-garden:' + (P('t', '') || P('username', 'demo')).slice(-24);
    let saveT = null;
    const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify({ f: flowers.map((f) => f.g).concat(bigs.map((b) => b.g)), r: ranking })); } catch { /* storage ปิด */ } }, 500); };
    try {
      if (P('reset', '0') === '1') localStorage.removeItem(KEY);
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s) { ranking = s.r || {}; (s.f || []).forEach((g) => addFlower(g, -1e6)); }
    } catch { /* ignore */ }

    const EMOJI = { Rose: '🌹', 'Finger Heart': '🫰', Perfume: '🧴', Galaxy: '🌌', Lion: '🦁', Universe: '🪐', Heart: '❤️', TikTok: '🎵' };
    function onGift(e) {
      const count = e.repeatCount || 1, unit = e.diamondCount || 0, value = e.totalValue || unit * count;
      if (unit < MIN_COINS) return;
      const g = { u: e.giftImage || '', e: EMOJI[e.giftName] || '🌹', d: unit, big: unit >= BIG ? 1 : 0 };
      const n = g.big ? 1 : Math.min(count, 40);
      for (let i = 0; i < n; i++) setTimeout(() => { addFlower(g, performance.now()); save(); }, i * 120);
      const u = e.user || {}, id = u.uniqueId || u.nickname || '?';
      const row = ranking[id] || { n: u.nickname || id, a: u.avatar || '', c: 0 };
      row.c += value; row.n = u.nickname || row.n; row.a = u.avatar || row.a; ranking[id] = row;
      renderBoard(); showAlert(e, count); save();
    }
    Overlay.on('event', (e) => { if (e.type === 'gift' && !e.streaking) onGift(e); });

    addEventListener('resize', resize); resize(); renderBoard();
    requestAnimationFrame(frame);

    if (!Overlay.connected) {
      const names = ['somchai', 'mimi', 'บิ๊ก', 'lisa', 'ต้นน้ำ'];
      const gifts = [['Rose', 1], ['Rose', 1], ['Finger Heart', 5], ['Perfume', 20], ['Galaxy', 1000], ['Lion', 2999]];
      setInterval(() => {
        const g = gifts[Math.floor(Math.random() * gifts.length)], nm = names[Math.floor(Math.random() * names.length)];
        onGift({ type: 'gift', user: { uniqueId: nm, nickname: nm, avatar: '' }, giftName: g[0], diamondCount: g[1], repeatCount: g[1] >= 1000 ? 1 : 1 + Math.floor(Math.random() * 4) });
      }, 1200);
    }
  })();
  </script>
