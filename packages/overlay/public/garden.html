<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gift Garden Overlay</title>
  <link rel="icon" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Kanit',sans-serif;color:#fff}
    #fx{position:fixed;inset:0}
    .shadow{text-shadow:0 2px 4px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.8)}
    #alert{position:fixed;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;
      background:rgba(20,10,30,.55);backdrop-filter:blur(4px);opacity:0;transform:translate(-50%,10px);transition:opacity .35s,transform .35s;white-space:nowrap;pointer-events:none}
    #alert.show{opacity:1;transform:translate(-50%,0)}
    #alert img.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#b9a6f2}
    #alert img.gift{width:36px;height:36px;object-fit:contain}
    #alert .nm{font-weight:600;font-size:18px} #alert .sub{font-size:15px;opacity:.9}
    #board{position:fixed;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border-radius:999px;
      background:rgba(20,10,30,.45);border:1.5px solid rgba(255,215,106,.7);font-size:20px;white-space:nowrap;pointer-events:none}
    #board img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#b9a6f2}
    #board .c{color:#ffd76a;font-weight:600;margin-left:6px}
    #board:empty{display:none}
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="alert" class="shadow"><img class="ava" alt="" /><div><div class="nm"></div><div class="sub"></div></div><img class="gift" alt="" /></div>
  <div id="board" class="shadow"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script src="js/collect-store.js"></script>
  <script src="js/juice.js"></script>

      ctx.save(); ctx.beginPath();
      ctx.moveTo(M.L, P.y + P.h); ctx.lineTo(M.L, M.y); ctx.lineTo(M.lo(M.y - dy), M.y - dy); ctx.lineTo(M.lo(top), top);
      ctx.lineTo(M.hi(top), top); ctx.lineTo(M.hi(M.y - dy), M.y - dy); ctx.lineTo(M.R, M.y); ctx.lineTo(M.R, P.y + P.h); ctx.closePath(); ctx.clip();
      drawBouquetGreensIn(time); ctx.restore();
    }
    function drawBouquetGreensIn(time) {
      if (!BQLEAF.length || !vegImg(BQLEAF[0].spr)) drawBouquetLeaves(time);
      else for (const c of BQLEAF) { // โคนกลางล่างของภาพ = จุดรวบในห่อ · หมุนออกเป็นพัด · ไหวเบา ๆ
        const im = vegImg(c.spr); if (!im) continue;
        const H = c.len, W = H / c.asp;
        ctx.save(); ctx.translate(c.bx, c.by); ctx.rotate(c.rot + Math.sin(time * 1.1 + c.phase) * 0.03 * SWAY); ctx.scale(c.m, 1);
        ctx.drawImage(im, -W / 2, -H, W, H); ctx.restore();
      }
      QSTEMS.forEach((st, i) => { if (st.len > 2) drawStem(st, i, time, 1); });
    }
    function drawPotLeaves(time) { // กระถาง: กอใบเล็ก ๆ ปิดปากกระถาง ทับโคนก้าน
      for (const c of POTLEAF) { ctx.save(); ctx.translate(c.bx, c.by); drawClumpLeaves(c, time); ctx.restore(); }
    }
    const bedPer = CLUMPS.map(() => []); let bedVer = -1;
    function drawBed(time, now) {
      if (bedVer !== fVer) { bedVer = fVer; bedPer.forEach((a) => { a.length = 0; }); for (const f of flowers) if (f.sl.cl) bedPer[f.sl.cl.i].push(f); } // จัดกลุ่มใหม่เฉพาะตอนดอกเปลี่ยน
      const per = bedPer;
      ctx.lineCap = 'round';
      CLUMPS.forEach((c, i) => {
        c.fst.forEach((st, k) => { if (st.len > 2) drawStem(st, i + k, time, 1); }); // ก้านดอกก่อน → ใบกอทับโคนก้าน (ยังไม่ได้ของขวัญ = ยังไม่งอก)
        ctx.save(); ctx.translate(c.bx, c.by);
        ctx.beginPath(); ctx.ellipse(0, 0, c.cw * 0.42, c.cw * 0.09, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(40,25,15,.28)'; ctx.fill(); // เงาโคนกอบนดิน
        drawClumpLeaves(c, time);
        ctx.restore();
        per[i].forEach((f) => drawFlower(f, time, now));
      });
    }
    const pop = (born, now) => { const k = Math.min(1, (now - born) / 450); return k < 1 ? 1.25 * Math.sin(k * Math.PI / 2) - 0.25 * Math.sin(k * Math.PI) : 1; };
    function drawGift(img, emoji, size, hold) {
      const px = size * S() * DPR; let st = null;
      if (hold) { // แคชสติกเกอร์ไว้ที่ตัวดอก (ไม่ต้องสร้างคีย์ทุกเฟรม) — ขนาดปัดเป็นขั้นเดียวกับ Juice.sticker
        const q = Math.ceil(px * 1.25 / 8);
        if (hold.stQ === q && hold.stI === img && hold.st) st = hold.st;
        else if (Juice.sticker) { st = Juice.sticker(img, px); if (st) { hold.st = st; hold.stQ = q; hold.stI = img; } }
      } else st = Juice.sticker ? Juice.sticker(img, px) : null; // สติกเกอร์คมชัด ขอบขาว + เงานุ่ม
      if (st) { const s = size * Juice.STICKER_PAD; ctx.drawImage(st, -s / 2, -s / 2, s, s); }
      else if (img && img.complete && img.naturalWidth) ctx.drawImage(img, -size / 2, -size / 2, size, size);
      else { ctx.font = Math.round(size * .8) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(emoji || '🌹', 0, 2); }
    }
    let mList = [], mVer = -1;
    function drawFlowers(time, now) {
      if (MEADOW) { // ทุ่งหญ้า: ดอกในทุ่ง (แถวหลังก่อน) → หญ้าแถวหน้าบังโคนก้าน
        if (mVer !== fVer) { mVer = fVer; mList = flowers.filter((f) => f.sl.meadow).sort((p, q) => p.sl.by - q.sl.by); }
        for (const f of mList) drawFlower(f, time, now);
        drawMeadow(time, 1);
      }
      for (const f of flowers) {
        if (f.sl.cl || f.sl.meadow) continue; // แปลงผัก: วาดไปพร้อมกอแล้ว (drawBed) · ดอกในทุ่งวาดไปแล้วข้างบน
        drawFlower(f, time, now);
      }
      drawBigs(time, now);
    }
    function drawFlower(f, time, now) {
      {
        const bk = bloomK(f, f.sl.stem); if (bk <= 0) return;
        let p = slotPoint(f.sl, time); const s = pop(f.born, now) * bk;
        if (f.sl.meadow) p = drawMeadowStalk(f, p, now);
        if (!f.sparkled && bk >= 1) { f.sparkled = true; if (f.born > 0) fx.sparkle(p.x + f.jx, p.y + f.jy, 4); }
        ctx.save(); ctx.translate(p.x + f.jx, p.y + f.jy); ctx.scale(s, s); ctx.rotate(Math.sin(time * 1.6 + f.sl.t * 9) * .12 * SWAY);
        if (f.fs == null) f.fs = Math.min(30 * FLOWER * (BOUQ ? 1.35 : f.sl.cl ? 0.9 : f.sl.meadow ? 0.8 : 1) * flowerSize(f.g.d, 2.5), 75); // ของแพงดอกใหญ่ขึ้น
        drawGift(f.img, f.g.e, f.fs * dens, f); ctx.restore(); // ดอกเยอะ = เล็กลงพร้อมกันทุกดอก
      }
    }
    function drawBigs(time, now) {
      bigs.forEach((b, i) => {
        // ตำแหน่งดอกใหญ่: ยอดกิ่งหลัก (กลางก่อน) → ปลายกิ่งย่อย · เกินแล้ววนซ้ำแบบเหลื่อมนิด ๆ (ไม่ซ้อนเป็นเสา)
        const k = i % BIG_SPOTS.length, lap = Math.floor(i / BIG_SPOTS.length), sp = BIG_SPOTS[k];
        const p0 = sp.ext ? slotPoint(sp.ext, time) : sp.tree ? slotPoint(sp, time) : sp.twig ? slotPoint({ stem: sp.stem, twig: sp.twig, t: 1 }, time) : stemPoint(sp.stem, 1, time);
        const px = p0.x + (lap ? b.jx : 0), py = p0.y - (sp.tree || sp.ext ? 0 : sp.twig ? 8 : 26) + (lap ? b.jy : 0);
        const bk = bloomK(b, sp.stem); if (bk <= 0) return;
        const s = pop(b.born, now) * bk, R = 46 * FLOWER * (0.4 + 0.6 * dens) * (BOUQ ? 0.55 : sp.bed ? 0.7 : sp.stem && sp.stem.bed ? 0.75 : sp.twig || sp.ext ? 0.72 : sp.tree ? 0.85 : 1); // ช่อ: ดอกใหญ่เล็กลงให้กลืนกับช่อ · แน่นขึ้นก็เล็กลง (น้อยกว่าดอกเล็ก → ยังใหญ่เด่น)
        if (sp.stalk != null) { // แปลงผัก: ก้านสั้นแข็งแรงโผล่จากกอ
          ctx.beginPath(); ctx.moveTo(sp.x, sp.stalk); ctx.quadraticCurveTo(sp.x - 4, (sp.stalk + py) / 2, px, py + R * 0.4);
          ctx.lineCap = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = STEM.stem; ctx.stroke();
        }
        Juice.aura(ctx, px, py, R * 0.9, b.g.d || 1000, time);
        if (!b.sparkled && bk >= 1) { b.sparkled = true; if (b.born > 0) { fx.sparkle(px, py, 10, '#ffe08a'); fx.confetti(px, py, 30); } }
        ctx.save(); ctx.translate(px, py); ctx.scale(s, s); ctx.rotate(Math.sin(time * .7 + i) * .1 * SWAY);
        for (let k = 0; k < 10; k++) { // กลีบ
          ctx.save(); ctx.rotate(k * Math.PI / 5); ctx.beginPath(); ctx.ellipse(0, -R * .78, R * .3, R * .5, 0, 0, Math.PI * 2);
          if (b.pgR !== R) { b.pgR = R; b.pg = ctx.createLinearGradient(0, -R * 1.2, 0, -R * .3); b.pg.addColorStop(0, '#ffffff'); b.pg.addColorStop(1, b.color); } // ไล่สีกลีบเดียวกันทุกกลีบ → สร้างครั้งเดียว
          ctx.fillStyle = b.pg; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(90,70,140,.35)'; ctx.stroke(); ctx.restore();
        }
        ctx.beginPath(); ctx.arc(0, 0, R * .62, 0, Math.PI * 2); ctx.fillStyle = '#fff8f0'; ctx.fill();
        drawGift(b.img, b.g.e, R * 1.15, b); ctx.restore();
      });
    }
    function frame(now) {
      const time = now / 1000;
      if (GSTEMS.length) growStems(performance.now()); // นาฬิกาเดียวกับ feedStem (เวลา rAF อาจคนละฐาน)
      stepDens(performance.now());
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H); ctx.imageSmoothingQuality = 'high';
      const o = origin(), s = S(); ctx.translate(o.x, o.y); ctx.scale(s, s);
      // ต้นไม้/กระถาง + กิ่ง + ดอกไม้ (ของขวัญ) หายใจด้วยค่าเดียวกัน — ยุบ-ยืดรอบโคนไปพร้อมกัน
      const br = Juice.breathe(time, 0.012), breathe = () => ctx.scale(1 + (1 - br) * 0.5, br);
      ctx.save(); breathe();
      // ห่อช่อ/แจกัน (behind): กิ่งอยู่หลังห่อ ดูเหมือนงอกจากด้านใน ไม่มีดิน
      if (TREE) { drawPot(); drawMeadow(time, 0); } else if (BOUQ) { drawBouquetGreens(time); drawPot(); } else if (BED) { drawPot(); drawBed(time, now); } else if (POT_SKIN) { drawPot(); drawStems(time); if (GROW_POT) drawPotLeaves(time); else drawSoilTufts(time); } else { drawStems(time); drawPot(); }
      ctx.restore();
      tickGround();
      drawGround(time, now); // กองบนพื้นอยู่นิ่ง และอยู่หน้าเนิน/กระถาง
      ctx.save(); breathe(); drawFlowers(time, now); ctx.restore();
      fx.step(); fx.draw(ctx);
      requestAnimationFrame(frame);
    }

    // ---- แจ้งเตือน / ผู้ให้สูงสุด ----
    const $alert = document.getElementById('alert'), $board = document.getElementById('board');
    function layoutUi() {
      const o = origin(), s = S();
      const at = Math.max(4, o.y - (TREE ? 560 : (BED ? 440 : 374) - POT_TOP) * s);
      $alert.style.left = o.x + 'px'; $alert.style.top = at + 'px';
      if (GROW_POT && s > 0) { // กระถาง: เพดานความสูงก้าน = ใต้ป้ายแจ้งเตือน (เผื่อดอกใหญ่บนยอด) — คิดใหม่ทุกครั้งที่ขนาดจอเปลี่ยน
        const pillBottom = (at + 66 - o.y) / s, room = Math.max(150, (POT_TOP + 8) - pillBottom - 46 * FLOWER - 60);
        for (const st of stems) { st.capLen = room / Math.max(0.55, Math.cos(st.lean)); if (st.grow) st.len = stemLen(st); }
      }
      $board.style.left = o.x + 'px'; $board.style.top = (o.y + 10) + 'px';
    }
    let alertT = null, ranking = {};
    const safe = (u) => /^https:\/\//.test(u || '') ? u : '';
    function showAlert(e, count) {
      if (!SHOW_ALERT) return;
      const ava = $alert.querySelector('.ava'), gi = $alert.querySelector('.gift');
      ava.src = safe(e.user && e.user.avatar); ava.style.visibility = ava.src ? 'visible' : 'hidden';
      $alert.querySelector('.nm').textContent = (e.user && (e.user.nickname || e.user.uniqueId)) || 'ผู้ชม';
      $alert.querySelector('.sub').textContent = `ส่ง ${e.giftName || 'ของขวัญ'} ×${count}`;
      gi.src = safe(e.giftImage); gi.style.display = gi.src ? 'block' : 'none';
      $alert.classList.add('show'); clearTimeout(alertT); alertT = setTimeout(() => $alert.classList.remove('show'), 5000);
    }
    function renderBoard() {
      if (!SHOW_BOARD) return;
      const top = Object.values(ranking).sort((a, b) => b.c - a.c)[0];
      if (!top) { $board.innerHTML = ''; return; }
      $board.innerHTML = `<span>👑</span>${safe(top.a) ? `<img src="${top.a.replace(/"/g, '%22')}" alt="">` : ''}<span>${Overlay.esc(top.n)}</span><span class="c">💎 ${Overlay.fmt(top.c)}</span>`;
    }

    // ---- จำต้นไม้ไว้ (รีเฟรชแล้วดอกยังอยู่) ----
    const KEY = (Overlay.widget === 'tree' ? 'vjl-tree:' : 'vjl-garden:') + (P('t', '') || P('username', 'demo')).slice(-24); // ต้นไม้/กระถาง จำกองแยกกัน
    let saveT = null;
    const saveNow = () => { try { localStorage.setItem(KEY, JSON.stringify({ f: flowers.map((f) => f.g).concat(bigs.map((b) => b.g), ground.filter((b) => !b.dying).map((b) => b.g)), r: ranking })); } catch { /* storage ปิด */ } };
    const save = () => { clearTimeout(saveT); saveT = setTimeout(saveNow, 500); };
    addEventListener('pagehide', () => { clearTimeout(saveT); saveNow(); }); // รีโหลด (deploy ใหม่)/ปิด → บันทึกทันที
    try {
      if (P('reset', '0') === '1') localStorage.removeItem(KEY);
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      let list = s ? (s.f || []) : [];
      if (s) ranking = s.r || {};
      // กองกลาง (ใช้ร่วมทุกแบบ) มาก่อน — เปลี่ยนแบบแล้วของขวัญไม่หาย
      if (window.VJLCollect) { VJLCollect.seed(list); if (VJLCollect.has()) list = VJLCollect.gifts(400).map((g) => ({ u: g.u, e: g.em || VJLCollect.emoji(g.name, '🌹'), d: g.d, big: g.d >= BIG ? 1 : 0 })); }
      list.forEach((g) => addFlower(g, -1e6));
    } catch { /* ignore */ }

    const EMOJI = { Rose: '🌹', 'Finger Heart': '🫰', Perfume: '🧴', Galaxy: '🌌', Lion: '🦁', Universe: '🪐', Heart: '❤️', TikTok: '🎵' };
    function onGift(e) {
      const count = e.repeatCount || 1, unit = e.diamondCount || 0, value = e.totalValue || unit * count;
      if (unit < MIN_COINS) return;
      const g = { u: (e.giftImage || (window.VJLCollect ? VJLCollect.imgFor(e.giftName) : '')), e: EMOJI[e.giftName] || '🌹', d: unit, big: unit >= BIG ? 1 : 0 };
      const n = Math.min(count, g.big ? 30 : 150); // ส่ง x5 = ขึ้น 5 ดอก (ดอกใหญ่ก็นับครบ เดิมนับแค่ 1) · ยอดเต็มแล้วร่วงกองพื้น
      const k = e.__add != null ? Math.min(e.__add, n) : n; // คอมโบ: บานทันทีทีละชุดระหว่างกด
      for (let i = 0; i < k; i++) setTimeout(() => { addFlower(g, performance.now()); save(); }, i * (k > 40 ? 50 : 120));
      if (e.__partial) return; // ยังกดคอมโบอยู่ → อันดับ/แจ้งเตือน/บันทึก ทำตอนจบครั้งเดียว
      if (window.VJLCollect) VJLCollect.record(e, n);
      const u = e.user || {}, id = u.uniqueId || u.nickname || '?';
      const row = ranking[id] || { n: u.nickname || id, a: u.avatar || '', c: 0 };
      row.c += value; row.n = u.nickname || row.n; row.a = u.avatar || row.a; ranking[id] = row;
      if (POT_SKIN && POT_SKIN.music && fx.notes) fx.notes(0, TREE ? -380 : POT_TOP - 120, unit >= 100 ? 5 : 2);
      renderBoard(); if (!e.__quiet) showAlert(e, count); save();
    }
    Overlay.on('state', (st) => { if (window.VJLCollect) VJLCollect.backfill(st, onGift); }); // เติมชิ้นที่พลาด (deploy/รีโหลดกลางไลฟ์)
    if (window.VJLCollect && VJLCollect.live) VJLCollect.live(onGift); else Overlay.on('event', (e) => { if (e.type === 'gift' && !e.streaking) onGift(e); });

    addEventListener('resize', resize); resize(); renderBoard();
    requestAnimationFrame(frame);

    if (!Overlay.connected) {
      VJLCollect.demoBurst(onGift);
      setInterval(() => onGift(VJLCollect.demoGift()), 1200); // ของขวัญจริง (รูปจาก TikTok)
    }
  })();
  </script>
