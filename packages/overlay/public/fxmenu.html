<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gift Menu Overlay</title>
<link rel="icon" href="favicon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@500;700&display=swap');
  html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Mali','Itim',sans-serif; }
  #box { position:fixed; transform-origin:var(--o,0 0); transform:scale(var(--s,1)); width:340px; }
  #box.tl { left:16px; top:16px; --o:0 0 } #box.tr { right:16px; top:16px; --o:100% 0 }
  #box.bl { left:16px; bottom:16px; --o:0 100% } #box.br { right:16px; bottom:16px; --o:100% 100% }
  .panel { border-radius:22px; padding:12px 12px 10px; color:#fff; background:rgba(40,20,60,var(--bg,.45)); backdrop-filter:blur(8px);
    border:1.5px solid rgba(255,255,255,.35); box-shadow:0 10px 26px rgba(60,20,80,.3); }
  .title { font-family:'Itim',sans-serif; font-size:21px; text-align:center; margin:0 0 8px; text-shadow:0 2px 4px rgba(60,10,60,.5); }
  .row { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:16px; margin-top:6px;
    background:linear-gradient(90deg,rgba(255,111,170,.35),rgba(150,110,240,.25)); animation:in .5s ease both; }
  .row.hot { animation:in .5s ease both, hot 1s ease-in-out 2; }
  .ico { width:48px; height:48px; flex:none; display:grid; place-items:center; border-radius:14px; background:rgba(255,255,255,.18); font-size:28px; }
  .ico img { width:44px; height:44px; object-fit:contain; filter:drop-shadow(0 2px 3px rgba(0,0,0,.3)); animation:bob 2.4s ease-in-out infinite; }
  .txt { min-width:0; flex:1; }
  .what { font-size:17px; font-weight:700; line-height:1.25; text-shadow:0 1px 3px rgba(60,10,60,.6); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .how { font-size:13px; opacity:.92; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .how b { color:#fff2a8; }
  .empty { font-size:14px; text-align:center; opacity:.85; padding:10px; }
  /* แบบหมุนทีละรายการ */
  #box.rotate .row { margin-top:0; }
  @keyframes in { from { opacity:0; transform:translateX(-14px) } to { opacity:1; transform:none } }
  @keyframes bob { 50% { transform:translateY(-3px) rotate(-4deg) } }

  /* ===== เทมเพลตหน้าตา (theme) ===== */
  .th-candy .panel { background:linear-gradient(160deg,rgba(255,214,235,var(--bgx,.95)),rgba(225,210,255,var(--bgx,.95))); border:2px solid #fff; color:#5a2b55; box-shadow:0 10px 24px rgba(200,90,160,.25); }
  .th-candy .title { color:#e0468e; text-shadow:0 2px 0 #fff; } .th-candy .row { background:rgba(255,255,255,.75); } .th-candy .ico { background:#ffe3f1; }
  .th-candy .what { text-shadow:none; color:#4a2347; } .th-candy .how b { color:#e0468e; }
  .th-white .panel { background:rgba(255,255,255,var(--bgx,.96)); border:1px solid rgba(0,0,0,.06); color:#23202b; border-radius:16px; box-shadow:0 8px 22px rgba(0,0,0,.12); }
  .th-white .title { color:#23202b; text-shadow:none; font-family:'Kanit',sans-serif; } .th-white .row { background:#f6f4f9; border-radius:12px; } .th-white .ico { background:#fff; }
  .th-white .what { text-shadow:none; } .th-white .how b { color:#ff4fa3; }
  .th-neon .panel { background:rgba(8,6,20,var(--bgx,.85)); border:2px solid #ff4fd8; box-shadow:0 0 16px #ff4fd8, inset 0 0 14px rgba(255,79,216,.4); }
  .th-neon .title { color:#fff; text-shadow:0 0 6px #fff, 0 0 14px #ff4fd8, 0 0 28px #ff4fd8; } .th-neon .row { background:rgba(255,79,216,.08); border:1px solid rgba(0,229,255,.5); box-shadow:0 0 8px rgba(0,229,255,.35); }
  .th-neon .what { text-shadow:0 0 8px #00e5ff; } .th-neon .how b { color:#00e5ff; }
  .th-gold .panel { background:linear-gradient(180deg,rgba(60,10,25,var(--bgx,.92)),rgba(30,5,15,var(--bgx,.92))); border:2px solid #d4af37; box-shadow:0 0 0 3px rgba(212,175,55,.25), 0 12px 28px rgba(0,0,0,.45); }
  .th-gold .title { color:#ffe08a; text-shadow:0 2px 0 #7a5410; font-family:'Kanit',sans-serif; } .th-gold .row { background:linear-gradient(90deg,rgba(212,175,55,.22),rgba(212,175,55,.06)); border:1px solid rgba(212,175,55,.45); }
  .th-gold .what { color:#fff4d0; } .th-gold .how b { color:#ffd76a; }
  .th-bubble .panel { background:transparent; border:0; box-shadow:none; backdrop-filter:none; padding:0; }
  .th-bubble .title { background:linear-gradient(90deg,#ff7ab8,#b28bff); border-radius:999px; padding:6px 14px; display:inline-block; }
  .th-bubble #box .panel, .th-bubble .panel { text-align:center; }
  .th-bubble .row { background:rgba(255,255,255,.9); color:#4a2347; border-radius:999px; box-shadow:0 4px 12px rgba(0,0,0,.18); } .th-bubble .what { text-shadow:none; } .th-bubble .how b { color:#e0468e; } .th-bubble .ico { background:#ffe3f1; border-radius:50%; }
  /* แนวนอน: การ์ดเรียงเป็นแถว รูปอยู่บน ข้อความอยู่ล่าง */
  #box.horiz { width:auto; max-width:96vw; } #box.horiz #list { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  #box.horiz .row { flex-direction:column; width:118px; text-align:center; margin-top:0; padding:8px 6px; }
  #box.horiz .ico { width:58px; height:58px; } #box.horiz .ico img { width:54px; height:54px; }
  #box.horiz .what { white-space:normal; font-size:15px; line-height:1.2; } #box.horiz .how { font-size:12px; }
  /* ของขวัญขยับ */
  /* แบบไอคอน (ค่าเริ่มต้น): รูปของขวัญไม่มีพื้นหลัง คำอธิบายอยู่ใต้รูป ไม่ต้องบอก "ส่ง กุหลาบ x เหรียญ" (เห็นรูปก็รู้) */
  .it-tile .row { flex-direction:column; text-align:center; gap:2px; padding:6px 4px; background:none !important; border:0 !important; box-shadow:none !important; }
  .it-tile .ico { background:none !important; width:64px; height:64px; } .it-tile .ico img { width:62px; height:62px; }
  .it-tile .what { white-space:normal; font-size:16px; max-width:150px; }
  .it-tile .row.gift .how { display:none; }
  .it-tile.horiz .row { width:120px; }
  .mv-bounce .ico img { animation:mvBounce 1.1s cubic-bezier(.3,1.6,.5,1) infinite; }
  .mv-spin .ico img { animation:mvSpin 3.2s linear infinite; }
  .mv-pulse .ico img { animation:mvPulse 1.3s ease-in-out infinite; }
  .mv-wiggle .ico img { animation:mvWiggle .9s ease-in-out infinite; }
  .mv-none .ico img { animation:none; }
  .row:nth-child(2n) .ico img { animation-delay:-.4s } .row:nth-child(3n) .ico img { animation-delay:-.8s }
  @keyframes mvBounce { 0%,100% { transform:translateY(0) scale(1) } 30% { transform:translateY(-9px) scale(1.06,.96) } 55% { transform:translateY(0) scale(1.08,.92) } 70% { transform:translateY(-3px) } }
  @keyframes mvSpin { to { transform:rotateY(360deg) } }
  @keyframes mvPulse { 50% { transform:scale(1.18); filter:drop-shadow(0 0 8px rgba(255,220,240,.9)) } }
  @keyframes mvWiggle { 0%,100% { transform:rotate(0) } 25% { transform:rotate(-12deg) } 75% { transform:rotate(12deg) } }
  @keyframes hot { 50% { box-shadow:0 0 0 3px #ffe17a, 0 0 22px #ffcf5c; transform:scale(1.04) } }
</style>
</head>
<body>
  <div id="box"><div class="panel"><div class="title" id="title"></div><div id="list"></div></div></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay-client.js"></script>
  <script>
  (function () {
    // เมนูของขวัญ: บอกผู้ชมว่าส่งอะไร → เกิดอะไรบนจอ (ดึงจากกฎ Actions ที่เปิดอยู่ อัปเดตเองเมื่อแก้กฎ)
    // ?title= · ?pos=tl|tr|bl|br · ?layout=list|rotate · ?every=5 (วินาที, แบบหมุน) · ?max=6 · ?scale=1 · ?bg=45 · ?other=true (รวมแชท/ติดตาม/แชร์)
    const P = (k, d) => Overlay.param(k, d);
    const box = document.getElementById('box'), list = document.getElementById('list');
    const POS = ['tl', 'tr', 'bl', 'br'].includes(P('pos', 'tl')) ? P('pos', 'tl') : 'tl';
    const LAYOUT = P('layout', 'list') === 'rotate' ? 'rotate' : 'list';
    const DIR = P('dir', 'vertical') === 'horizontal' ? 'horiz' : 'vert';
    const MOVE = ['bob', 'bounce', 'spin', 'pulse', 'wiggle', 'none'].includes(P('move', 'bounce')) ? P('move', 'bounce') : 'bounce';
    const THEME = ['glass', 'candy', 'white', 'neon', 'gold', 'bubble'].includes(P('theme', 'glass')) ? P('theme', 'glass') : 'glass';
    box.className = POS + ' ' + LAYOUT + ' ' + DIR + ' mv-' + MOVE + ' th-' + THEME + ' it-' + (P('item', 'tile') === 'row' ? 'row' : 'tile');
    box.style.setProperty('--bgx', Math.max(.3, Math.min(1, parseFloat(P('bg', '45')) / 100 + .45)));
    box.style.setProperty('--s', Math.max(.4, Math.min(2.5, parseFloat(P('scale', '1')) || 1)));
    box.querySelector('.panel').style.setProperty('--bg', Math.max(0, Math.min(100, parseFloat(P('bg', '45')))) / 100);
    document.getElementById('title').textContent = P('title', '🎁 ส่งของขวัญเพื่อ…');
    const MAX = Math.max(1, Math.min(12, parseInt(P('max', '6'), 10) || 6));
    const EVERY = Math.max(2, Math.min(30, parseFloat(P('every', '5')) || 5)) * 1000;
    const OTHER = P('other', 'true') !== 'false';
    const EV = { follow: ['➕', 'กดติดตาม'], share: ['🔗', 'แชร์ไลฟ์'], like: ['❤️', 'กดไลก์'], chat: ['💬', 'พิมพ์'] };
    const fmt = (n) => Number(n).toLocaleString('en-US');
    // เลือกจากแดชบอร์ด: ซ่อนบางกฎ / เปลี่ยนรูปของขวัญที่แสดง
    let SEL = {}; try { SEL = JSON.parse(P('items', '') || '{}') || {}; } catch (e) { SEL = {}; }
    const HIDE = new Set(SEL.hide || []), ICONS = SEL.icons || {}, LABELS = SEL.labels || {}; // LABELS = คำในเมนูที่วีเจแก้เอง (แทนชื่อกฎ)

    function rowEl(m) {
      const r = document.createElement('div'); r.className = 'row' + (m.event === 'gift' ? ' gift' : ''); if (m.id) r.dataset.rule = m.id;
      const ico = document.createElement('div'); ico.className = 'ico';
      if (m.image) { const im = document.createElement('img'); im.src = m.image; im.alt = ''; ico.appendChild(im); }
      else ico.textContent = m.event === 'gift' ? '🎁' : (EV[m.event] || ['✨'])[0];
      const tx = document.createElement('div'); tx.className = 'txt';
      const what = document.createElement('div'); what.className = 'what'; what.textContent = LABELS[m.id] || m.label;
      const how = document.createElement('div'); how.className = 'how';
      if (m.event === 'gift') {
        if (m.gift) how.innerHTML = `ส่ง <b></b>${m.diamonds ? ` · 💎${fmt(m.diamonds)}` : ''}`, how.querySelector('b').textContent = m.th || m.gift;
        else how.innerHTML = m.minDiamonds ? `ส่งของขวัญ <b>💎${fmt(m.minDiamonds)}</b> ขึ้นไป` : 'ส่ง <b>ของขวัญอะไรก็ได้</b>';
      } else if (m.event === 'chat') { how.innerHTML = 'พิมพ์ <b></b> ในแชท'; how.querySelector('b').textContent = `“${m.keyword || ''}”`; }
      else how.innerHTML = `<b>${(EV[m.event] || ['', m.event])[1]}</b>`;
      tx.append(what, how); r.append(ico, tx); return r;
    }

    let items = [], timer = null, idx = 0;
    function render() {
      clearInterval(timer); list.innerHTML = '';
      // รายการที่วีเจเพิ่มเองในหน้าตั้งค่า (ไม่ต้องมีกฎ) — ต่อท้ายตามราคา
      const custom = (SEL.custom || []).filter((c) => c && c.label).map((c) => ({ id: c.id, event: 'gift', gift: c.gift, th: c.th, image: /^https:\/\//.test(c.image || '') ? c.image : undefined, diamonds: c.diamonds, label: c.label }));
      const show = items.concat(custom).sort((a, b) => (a.event === 'gift' ? (a.diamonds || a.minDiamonds || 0) : 1e9) - (b.event === 'gift' ? (b.diamonds || b.minDiamonds || 0) : 1e9)).filter((m) => (OTHER || m.event === 'gift') && !HIDE.has(m.id)).map((m) => (/^https:\/\//.test(ICONS[m.id] || '') ? { ...m, image: ICONS[m.id] } : m));
      if (!show.length) { list.innerHTML = '<div class="empty">ยังไม่มีกฎ — ตั้งที่เมนู Actions &amp; Events</div>'; return; }
      if (LAYOUT === 'rotate') {
        const step = () => { list.innerHTML = ''; list.appendChild(rowEl(show[idx++ % show.length])); };
        step(); if (show.length > 1) timer = setInterval(step, EVERY);
      } else show.slice(0, MAX).forEach((m, i) => { const r = rowEl(m); r.style.animationDelay = i * 0.08 + 's'; list.appendChild(r); });
    }
    if (Overlay.socket) Overlay.socket.on('menu', (m) => { items = Array.isArray(m) ? m : []; render(); });

    // มีคนส่งกิฟต์ที่อยู่ในเมนู → ไฮไลต์แถวนั้น ให้คนอื่นเห็นว่าใช้ได้จริง
    Overlay.on('action', (f) => {
      if (LAYOUT !== 'list' || !f || !f.name) return;
      [...list.children].forEach((r) => { if ((r.dataset.rule === f.ruleId || r.querySelector('.what')?.textContent === f.name)) { r.classList.remove('hot'); void r.offsetWidth; r.classList.add('hot'); } });
    });

    // ตัวอย่างในแดชบอร์ด (ไม่มีลิงก์จริง): ล็อกอินอยู่ → ใช้กฎจริงของวีเจเป็นค่าเริ่มต้น · ไม่มี/ยังไม่มีกฎ → ตัวอย่างสมมติ
    let session = null; try { session = localStorage.getItem('vjl_token') || sessionStorage.getItem('vjl_token'); } catch (e) { /* ignore */ }
    if (!Overlay.connected && session) {
      fetch('/api/actions/menu', { headers: { Authorization: 'Bearer ' + session } }).then((r) => (r.ok ? r.json() : null))
        .then((j) => { if (j && j.items && (j.items.length || (SEL.custom || []).length)) { items = j.items; render(); } }).catch(() => {});
    }
    if (!Overlay.connected) {
      const IMG = 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/';
      items = [
        { event: 'gift', gift: 'Rose', th: 'กุหลาบ', diamonds: 1, label: '🔮 เปิดไพ่ทาโร่ 1 ใบ', image: IMG + 'eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.webp' },
        { event: 'gift', gift: 'Finger Heart', th: 'หัวใจนิ้ว', diamonds: 5, label: '🦋 ผีเสื้อเทพนิยาย', image: IMG + 'a4c4dc437fd3a6632aba149769491f49.png~tplv-obj.webp' },
        { event: 'gift', minDiamonds: 99, label: '🃏 ไพ่ 3 ใบ อดีต · ปัจจุบัน · อนาคต' },
        { event: 'chat', keyword: 'ดูดวง', label: '💬 ดูดวงฟรี 1 ใบ' },
        { event: 'follow', label: '💗 ขอบคุณที่ติดตาม' },
      ];
      render();
    }
  })();
  </script>
</body>
</html>
